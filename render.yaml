# One-click deploy config for Render. Everything here is safe to commit —
# the keys themselves are entered in Render's dashboard, never in this file.
services:
  - type: web
    name: hold-and-play   # serves both apps: /holds and /games
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter          # a disk is required for the server-side store
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Paste the real values in Render → your service → Environment.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
      # The games app's catalog (IGDB or RAWG) is deliberately left out: it is
      # optional, and listing it here makes Render demand a value before it will
      # deploy. Add CATALOG_PROVIDER and its credentials later in the dashboard
      # if you want it; TMDb and Will It Hold do not need them.
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "8787"
