    <div class="stats">
      <div><b>${s.passages}</b><span>story passages${s.turns?` · ${s.turns} yours`:""}</span></div>
      <div><b style="color:var(--${s.rep4>.1?"bad":s.rep4>.04?"economy":"ink"})">${pct(s.rep4)}</b><span>4-word runs already used (seq-rep-4)</span></div>
      <div><b>${pct(s.distinct2)}</b><span>distinct word pairs (distinct-2)</span></div>
      <div><b>${s.top?`${esc(s.top.w)} ${Math.round(s.top.share*100)}%`:"—"}</b><span>most common sentence opener</span></div>
      <div><b>${s.fancy} : ${s.said}</b><span>fancy tags : “said”</span></div>
    </div>
    <p class="note" style="margin-top:6px">Rough guide from this page, not from the papers: human fiction usually repeats under 3% of its 4-word runs; past about 10% readers feel the loop.</p>
    ${legend(finds,SCAT)}
    <div class="sheet" id="sheet">${marked(text,finds,[])}</div>
    ${findList(finds,text)}
    ${engineFix(an)}
    <h2>Rewrite the latest passage</h2>
    <p class="note">Sends the story and what was counted above to Claude and asks for a rewrite that keeps the plot. The page then re-counts the new passage itself. If you wrote the engine's prompt, check it in the Prompt tab too.</p>
    <div class="row"><button class="go" id="fixstory" ${state.busy?"disabled":""}>Rewrite without the loops</button></div>
    ${status()}${fix}`}


/* ==========================================================================
   IDEAS — brainstorming where the page keeps score. The model writes down
   the obvious ideas first so the real ones go elsewhere; code checks every
   new idea against those and against everything already on the table, and
   carries what you kept and passed on into the next round.
   ========================================================================== */

const MOVES=["invert it","combine it with an unrelated field","change the scale","change whose it is (point of view, audience)",
  "add a hard constraint","take a metaphor literally","move it in time or place","make the worst version and find what's good in it",
  "borrow the structure of another form"];

const stem=w=>w.replace(/'s$/,"").replace(/(?:ies)$/,"y").replace(/(?:es|s)$/,"");
const ideaWords=s=>new Set((String(s||"").toLowerCase().match(/[a-z0-9']+/g)||[]).filter(contentWord).map(stem));
// Share of the smaller idea's content words found in the other; two words minimum, so one shared noun isn't "close".
function overlap(a,b){if(!a.size||!b.size)return 0;let n=0;for(const x of a)if(b.has(x))n++;return n<2?0:n/Math.min(a.size,b.size)}

function ideaFlags(idea,earlier,obvious){
  const flags=[];const w=ideaWords(idea.title+" "+idea.pitch);
  for(const o of obvious)if(overlap(w,ideaWords(o))>=.5){flags.push(`Close to an obvious one: “${o}”`);break}
  for(const e of earlier)if(overlap(w,ideaWords(e.title+" "+e.pitch))>=.5){flags.push(`Close to #${e.id}, ${e.title}`);break}
  for(const n of DEFAULT_NAMES)if(new RegExp(`\\b${escRe(n)}\\b`).test(idea.pitch+" "+idea.title)){flags.push(`Default AI name: ${n}`);break}
  const b=beatsIn(idea.pitch);if(b.length)flags.push(`Stock beat: “${b[0].hit}”`);
  return flags}

function ideasContext(){
  const all=state.ideas;
  const kept=all.filter(i=>i.status==="kept"),passed=all.filter(i=>i.status==="passed");
  return`What they're working on: """${state.topic.trim().slice(0,1500)}"""
${state.ikind==="story"?"This is for a story: ideas can be premises, characters, settings, twists or scenes, whichever the request is after.\n":""}${state.iavoid.trim()?`They don't want: ${state.iavoid.trim().slice(0,400)}\n`:""}${all.length?`
Ideas already on the table (their tool flags near-duplicates, so a reworded one is wasted):
${all.map(i=>`- ${i.title}: ${i.pitch}`).join("\n").slice(0,5000)}
`:""}${kept.length?`
They kept these, so build in the directions they point:
${kept.map(i=>`- ${i.title}`).join("\n")}
`:""}${passed.length?`
They passed on these, so steer away from whatever they have in common:
${passed.map(i=>`- ${i.title}`).join("\n")}
`:""}`}

async function runIdeas(riffId){
  if(words(state.topic).length<3){state.err="Say what you're brainstorming first.";return render()}
  const riff=riffId?state.ideas.find(i=>i.id===riffId):null;
  state.busy="ideas";state.err="";render();
  try{
    const out=await ask(riff?`You're brainstorming with someone, and they want more from one idea.

${ideasContext()}
The idea to riff on: ${riff.title}: ${riff.pitch}

Give 4 variations. Each changes a different element: who it's about, where or when it happens, the mechanism or central object, and the stakes or the ending. Keep what made the original worth riffing on. Each should be concrete enough to picture: a specific person, place, object or event, not a category.${state.ikind==="story"?" Pick names that belong to the setting rather than the ones AI stories default to.":""}

Reply with only this JSON:
{"ideas":[{"title":"3 to 6 words","pitch":"one or two sentences","move":"which element changed","why":"what this version has that the original didn't, one sentence"}]}`
:`You're brainstorming with someone. They'll judge the ideas, so your job is range, not safety.

${ideasContext()}
First write down the five ideas that come to mind first, the ones most people and most AI models would suggest for this. They go on the list so the real ideas can go somewhere else; the tool flags any idea that lands close to them${state.ideas.length?", and to the ones already on the table":""}.

Then 8 ideas, each using a different one of these moves, named: ${MOVES.join("; ")}. Wild ideas are welcome, because an impractical idea often points at a practical one, but each should be concrete enough to picture: a specific person, place, object or mechanism rather than a category.${state.ikind==="story"?" Pick names that belong to the setting rather than the ones AI stories default to.":""}

Reply with only this JSON:
{"obvious":["","","","",""],"ideas":[{"title":"3 to 6 words","pitch":"one or two sentences","move":"the move used","why":"what makes it worth a look, one sentence"}]}`);
    const obvious=riff?state.iobvious:(out.obvious||[]).map(String).filter(Boolean).slice(0,6);
    if(!riff)state.iobvious=[...new Set(state.iobvious.concat(obvious))].slice(-24);
    const round=riff?`Riffs on #${riff.id}`:`Round ${state.iround=(state.iround||0)+1}`;
    let next=(state.ideas.reduce((a,i)=>Math.max(a,i.id),0))+1;
    for(const x of (out.ideas||[]).slice(0,10)){
      const idea={id:next++,title:String(x.title||"").slice(0,90),pitch:String(x.pitch||"").slice(0,500),
        move:String(x.move||"").slice(0,80),why:String(x.why||"").slice(0,300),round,status:""};
      if(!idea.title&&!idea.pitch)continue;
      idea.flags=ideaFlags(idea,state.ideas,state.iobvious);
      state.ideas.push(idea)}
    save()}
  catch(e){if(!(e&&e.code==="cancelled"))state.err=errCopy(e)}
  state.busy="";render()}

function ideaCard(i){
  return`<div class="idea ${i.status}" data-card="${i.id}">
    <div class="ih"><span class="lab">#${i.id} · ${esc(i.move)}</span></div>
    <div class="it">${esc(i.title)}</div>
    <div class="ip">${esc(i.pitch)}</div>
    ${i.why?`<div class="why">${esc(i.why)}</div>`:""}
    ${(i.flags||[]).map(f=>`<div class="iflag">${esc(f)}</div>`).join("")}
    <div class="row" style="margin-top:8px">
      <button class="ghost sm" data-act="keep" data-idea="${i.id}" aria-pressed="${i.status==="kept"}">${i.status==="kept"?"Kept":"Keep"}</button>
      <button class="ghost sm" data-act="pass" data-idea="${i.id}" aria-pressed="${i.status==="passed"}">${i.status==="passed"?"Passed":"Pass"}</button>
      <button class="ghost sm" data-act="riff" data-idea="${i.id}" ${state.busy?"disabled":""}>Riff on this</button>
    </div></div>`}

function ideasPanel(){
  const rounds=[];for(const i of state.ideas){let r=rounds.find(x=>x.name===i.round);if(!r)rounds.push(r={name:i.round,items:[]});r.items.push(i)}
  const kept=state.ideas.filter(i=>i.status==="kept");
  const flagged=state.ideas.filter(i=>(i.flags||[]).length).length;
  return`<p class="intro">Brainstorm with Claude while the page keeps score. Each round starts by writing down the obvious ideas so the real ones can go somewhere else. The page flags any idea that lands close to one of those, or to one you've already seen, and your Keep and Pass steer the next round.</p>
    <div class="field"><label class="lab" for="topic">What are you brainstorming</label><textarea id="topic" style="min-height:90px" placeholder="A premise for a heist story set somewhere unusual…">${esc(state.topic)}</textarea></div>
    <div class="pair">
      <div><label class="lab" for="ikind">Kind</label><select id="ikind"><option value="story" ${state.ikind==="story"?"selected":""}>Story ideas</option><option value="any" ${state.ikind!=="story"?"selected":""}>Anything else</option></select></div>
      <div><label class="lab" for="iavoid">Leave out (optional)</label><input type="text" id="iavoid" value="${esc(state.iavoid)}" placeholder="No time travel, nothing grim…"></div>
    </div>
    <div class="row"><button class="go" id="ideasgo" ${state.busy?"disabled":""}>${state.ideas.length?"More ideas":"Brainstorm"}</button>
      ${state.ideas.length?`<button class="ghost" id="ideasreset" ${state.busy?"disabled":""}>Start over</button>`:""}</div>
    ${status()}
    ${state.iobvious.length?`<h3>The obvious ones, written down to get past them</h3><ul class="note obv">${state.iobvious.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:""}
    ${state.ideas.length?`<p class="note" style="margin-top:10px">${state.ideas.length} ideas so far · ${kept.length} kept${flagged?` · ${flagged} flagged by the page as close to something already here`:""}</p>`:""}
    ${rounds.slice().reverse().map(r=>`<h2>${esc(r.name)}</h2><div class="ideas">${r.items.map(ideaCard).join("")}</div>`).join("")}
    ${kept.length?`<h2>Kept</h2><button class="ghost copy" data-copy="ikept">Copy</button><pre id="ikept" style="font:15px/1.6 var(--serif)">${esc(kept.map(i=>`${i.title}: ${i.pitch}`).join("\n\n"))}</pre>`:""}`}

function footer(){
  return`<div class="sourcebox"><b>Where the knowledge comes from.</b> Prose marks: Strunk &amp; White, Orwell's rules, Helen Sword on zombie nouns, plain-language guidelines, Gary Provost on sentence rhythm, and the Flesch readability formulas. Prompt marks and reviews: Anthropic's prompt-audit guidance for current Claude models. Story marks: repetition counted directly, with the measures from Holtzman et al. and Welleck et al. (seq-rep-n) and Li et al. (distinct-n); stock beats from AI-fiction community ban lists; Elmore Leonard on dialogue tags. Ideas: Osborn's brainstorming rules (defer judgment, go for quantity, welcome wild ideas, build on others) and SCAMPER-style moves; the near-duplicate and obvious-idea checks are word overlap counted by this page. Every mark is a heuristic that finds a candidate for you to judge, and passive-voice and cliché detection will sometimes flag something that's fine. The model-prose list is a pattern, not proof. Nothing is sent anywhere until you press a button, and your drafts stay in this browser.</div>`}

function render(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===state.tab)));
  const focus=document.activeElement&&document.activeElement.id;
  const sel=focus&&document.activeElement.selectionStart;
  const main=document.getElementById("main");
  main.innerHTML=(state.tab==="prose"?prosePanel():state.tab==="prompt"?promptPanel():state.tab==="story"?storyPanel():state.tab==="ideas"?ideasPanel():buildPanel())+footer();
  if(focus){const el=document.getElementById(focus);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}}

// Typing re-marks only the sheet and the lists, never the textarea itself.
let tId=0;
function refreshMarks(){
  clearTimeout(tId);tId=setTimeout(()=>{
    const ta=document.activeElement;const id=ta&&ta.id;const s=ta&&ta.selectionStart,e=ta&&ta.selectionEnd;
    const sc=window.scrollY;render();window.scrollTo(0,sc);
    if(id){const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(s,e)}catch(x){}}}},280)}

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="prose"){state.prose=t.value;state.sampleProse=false;state.critique=null;save();return refreshMarks()}
  if(t.id==="story"){state.story=t.value;state.sampleStory=false;state.storyFix=null;save();return refreshMarks()}
  if(t.id==="prompt"){state.prompt=t.value;state.samplePrompt=false;state.review=null;save();return refreshMarks()}
  if(["topic","ikind","iavoid"].includes(t.id)){state[t.id]=t.value;save();return}
  if(["purpose","reader","goal","who","rules","shape"].includes(t.id)){state[t.id]=t.value;save()}});

document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,mark,.find");if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;state.err="";state.active=-1;save();return render()}
  if(t.dataset.cat){state.showCats[t.dataset.cat]=!state.showCats[t.dataset.cat];return render()}
  if(t.tagName==="MARK"||t.classList.contains("find")){
    const i=t.dataset.i;state.active=/^\d+$/.test(i)?Number(i):i;render();
    const other=t.tagName==="MARK"?document.querySelector(`.find[data-i="${i}"]`):document.querySelector(`mark[data-i="${i}"]`);
    if(other&&other.scrollIntoView)other.scrollIntoView({block:"center",behavior:"smooth"});return}
  if(t.id==="critique")return void runCritique();
  if(t.id==="review")return void runReview();
  if(t.id==="build")return void runBuild();
  if(t.id==="fixstory")return void runStoryFix();
  if(t.id==="ideasgo")return void runIdeas();
  if(t.id==="ideasreset"){state.ideas=[];state.iobvious=[];state.iround=0;state.err="";save();return render()}
  if(t.dataset.act){const id=Number(t.dataset.idea);const idea=state.ideas.find(i=>i.id===id);if(!idea)return;
    if(t.dataset.act==="riff")return void runIdeas(id);
    const want=t.dataset.act==="keep"?"kept":"passed";idea.status=idea.status===want?"":want;save();
    const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.id==="stop"){if(ctl)ctl.abort();return}
  if(t.id==="togglequotes"){state.showQuotes=!state.showQuotes;return render()}
  if(t.dataset.copy){const el=document.getElementById(t.dataset.copy);const txt=el?el.textContent:"";
    const done=()=>{t.textContent="Copied";setTimeout(()=>{t.textContent="Copy"},1400)};
    try{navigator.clipboard.writeText(txt).then(done,()=>{selectText(el)})}catch(e){selectText(el)}}});
function selectText(el){if(!el)return;const r=document.createRange();r.selectNodeContents(el);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r)}

load();render();
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}render()})();
</script>
