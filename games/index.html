<title>Two Hours In</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#e9ecee;--card:#f7f8f9;--ink:#16191d;--dim:#666d75;
  --rule:#ccd2d7;--soft:#dde1e4;--sig:#2f6f8f;--sig-wash:#2f6f8f1a;--ok:#2f7a55;--bad:#a33227;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101316;--card:#181c20;--ink:#e7e9ea;--dim:#8b939b;
  --rule:#2a2f35;--soft:#212529;--sig:#67b2d6;--sig-wash:#67b2d624;--ok:#6db98c;--bad:#e0776a}}
:root[data-theme="dark"]{
  --ground:#101316;--card:#181c20;--ink:#e7e9ea;--dim:#8b939b;
  --rule:#2a2f35;--soft:#212529;--sig:#67b2d6;--sig-wash:#67b2d624;--ok:#6db98c;--bad:#e0776a}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;
  font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:26px 18px 80px}
.mono{font-family:"Roboto Mono",ui-monospace,Menlo,monospace}
.lab{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}

header.top{border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top h1{font-family:"Barlow Condensed",sans-serif;font-size:33px;font-weight:700;
  letter-spacing:.01em;margin:0;text-transform:uppercase}
header.top p{margin:5px 0 0;color:var(--dim);font-size:13.5px;max-width:56ch}
.hr{border-bottom:1px solid var(--ink);margin-bottom:18px}

.tabs{display:flex;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;

.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sig)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--card);border:1px solid var(--rule);border-radius:3px;
  color:var(--ink);font-family:inherit;font-size:16px;padding:12px 13px}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{outline:none;border-color:var(--sig)}
button.go{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--ground);

button.go:hover{background:transparent;color:var(--ink)}
button.go[disabled]{opacity:.45}
button.ghost{appearance:none;background:none;border:1px solid var(--rule);color:var(--ink);border-radius:3px;
  font-family:inherit;font-size:14px;font-weight:600;padding:11px 15px;cursor:pointer;min-height:44px}
.seg{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.seg button{appearance:none;background:none;border:1px solid var(--rule);color:var(--dim);border-radius:3px;
  font-family:"Roboto Mono",monospace;font-size:11.5px;padding:10px 12px;cursor:pointer;min-height:42px;
  touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.fieldlab{margin:18px 0 0;display:block}

.status{margin-top:15px;font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:9px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--sig);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.status .dot{animation:none}}
.err{margin-top:15px;border-left:2px solid var(--sig);padding:8px 0 8px 12px;font-size:13.5px}
.saved{color:var(--ok);font-size:13px;margin-top:9px}
.note{color:var(--dim);font-size:13px;margin-top:12px;max-width:58ch}
.subtle{color:var(--dim);font-size:13px;margin:4px 0 0;max-width:60ch}
h2.sec{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;
  font-size:19px;font-weight:700;margin:30px 0 0}

/* verdict */
.sheet{margin-top:22px}
.flagx{display:inline-block;border:1px solid var(--rule);color:var(--dim);font-family:"Roboto Mono",monospace;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;margin-bottom:10px}
.verdict{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:15px 0 17px}
.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.vname{font-size:19px;font-weight:600;line-height:1.25}
.vident{color:var(--dim);font-size:13px;margin-top:3px;max-width:42ch}
.vnum{font-family:"Barlow Condensed",sans-serif;font-size:62px;font-weight:700;line-height:.82;
  color:var(--sig);font-variant-numeric:tabular-nums;text-align:right}
.vband{text-align:right;font-family:"Roboto Mono",monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-top:6px;max-width:21ch;margin-left:auto;text-wrap:balance}
.dock{margin-top:13px;border-left:2px solid var(--sig);background:var(--sig-wash);padding:9px 12px;font-size:13.5px}

/* shape stats */
.shape{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-top:16px}
.shape div{background:var(--card);padding:10px 11px}
.shape .n{font-family:"Roboto Mono",monospace;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.15}
.shape .k{display:block;margin-top:3px}
.wall{margin-top:12px;border-left:2px solid var(--bad);padding:9px 12px;font-size:13.5px;background:var(--card)}

/* axes */
.axis{padding:13px 0;border-bottom:1px solid var(--soft)}
.arow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.alab{font-size:14.5px;font-weight:600}
.ahint{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:1px}
.aval{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--dim)}
.ticks{display:flex;gap:3px;margin:8px 0 7px}
.ticks i{height:6px;flex:1;background:var(--rule);border-radius:1px}
.ticks i.on{background:var(--sig)}
.anote{color:var(--dim);font-size:13.5px}

/* tactics */
.plan{margin-top:20px;border:1px solid var(--ink);border-radius:3px;background:var(--card);padding:15px 17px}
.plan h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;
  font-size:17px;font-weight:700;margin:0 0 4px}
.plan ul{margin:10px 0 0;padding-left:19px}
.plan li{margin-bottom:7px;font-size:14.5px}
.plan li:last-child{margin-bottom:0}
.stoprule{margin-top:13px;border-top:1px solid var(--rule);padding-top:11px;font-size:14px}
.ss{display:inline-block;font-family:"Roboto Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border:1px solid var(--rule);margin-top:11px}
.ss.yes{border-color:var(--ok);color:var(--ok)}
.ss.no{border-color:var(--bad);color:var(--bad)}

/* verdict capture */
.after{margin-top:20px;border-top:1px solid var(--rule);padding-top:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.chip{appearance:none;background:var(--card);border:1px solid var(--rule);color:var(--ink);border-radius:3px;
  font-family:inherit;font-size:14px;padding:12px 16px;cursor:pointer;
  min-height:46px;flex:1 1 auto;min-width:128px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip:active{background:var(--ink);color:var(--ground)}

/* picks */
.pick{border-top:1px solid var(--rule);padding:15px 0}
.pick:first-of-type{border-top:2px solid var(--ink)}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.pname{font-size:16.5px;font-weight:600}
.pname span{color:var(--dim);font-weight:400}
.pnum{font-family:"Roboto Mono",monospace;font-size:19px;font-weight:500;color:var(--sig)}
.pident{color:var(--dim);font-size:12.5px;margin-top:3px}
.pwhy{margin-top:8px;font-size:14.5px}
.tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:"Roboto Mono",monospace;font-size:10.5px;border:1px solid var(--rule);color:var(--dim);padding:3px 8px}

/* tables */
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:400;border-bottom:1px solid var(--ink);padding:0 10px 6px 0;white-space:nowrap}
td{border-bottom:1px solid var(--soft);padding:9px 10px 9px 0;vertical-align:top}
td.num{font-family:"Roboto Mono",monospace;white-space:nowrap}
.del{appearance:none;background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;font-size:18px;padding:4px 6px}
.del:hover{color:var(--sig)}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input[type=text]{flex:2;min-width:140px}
.addrow input.sc{flex:0 0 78px;min-width:78px;text-align:center}
.justadded td{background:var(--sig-wash)}
.readout{margin-top:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.readout div{background:var(--card);padding:11px 12px}
.readout .n{font-family:"Roboto Mono",monospace;font-size:20px}
.empty{color:var(--dim);font-size:13.5px;margin-top:12px;font-style:italic}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <header class="top">
    <h1>Two Hours In</h1>
    <p>Not whether a game is good — whether it survives the first week. Most of the backlog was bought by someone who already knew it was good.</p>
  </header>
  <div class="hr"></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="read" aria-selected="true">Check one</button>
    <button class="tab" data-tab="find" aria-selected="false">Find one</button>
    <button class="tab" data-tab="cal" aria-selected="false">Your scale</button>
  </div>
  <section id="panel-read"></section>
  <section id="panel-find" hidden></section>
  <section id="panel-cal" hidden></section>
</div>

<script>
"use strict";

/* ---------- what actually decides whether a game survives ---------- */

const AXES = [
  { key:"ramp",     label:"Good in the first hour",  hint:"Fun before the tutorial ends, not twenty hours in when it opens up", w:2.5 },
  { key:"session",  label:"A session can be short",  hint:"Forty minutes is a whole unit of progress, not a wasted load screen", w:2.5 },
  { key:"reentry",  label:"Survives a two-week gap", hint:"Come back and still know the controls, the build, and what you were doing", w:2.5 },
  { key:"feedback", label:"Something lands often",   hint:"Constant readable reward. Not walking, menus, and inventory",       w:2   },
  { key:"grind",    label:"No wall, no grind",       hint:"No difficulty spike or mandatory chore between you and the good part", w:2 },
  { key:"friction", label:"Cheap to press play",     hint:"Launch, patch, load, lobby. Whether you need other people to be online", w:1.5 },
];
const WSUM = AXES.reduce((a,x)=>a+x.w,0);

const VERDICTS = [
  { key:"credits",  label:"Rolled credits" },
  { key:"rotation", label:"Still in rotation" },
  { key:"drifted",  label:"Drifted off it" },
  { key:"bailed",   label:"Bounced early" },
];

// Starting estimates about a generic player, NOT this person's history. Every one is
// flagged so the app can say so, and the whole point of the scale tab is to replace them.
const BASE_ANCHORS = [
  { title:"Vampire Survivors", score:9.5, note:"Fun inside sixty seconds, a run is twenty minutes, nothing to remember between sessions.", seed:true },
  { title:"Balatro", score:9.5, note:"One run fits anywhere, the rules teach themselves, stopping is always clean.", seed:true },
  { title:"Hades", score:9, note:"Run-based, dying is progress, the story comes to you instead of needing to be tracked.", seed:true },
  { title:"Rocket League", score:9, note:"Five-minute matches, no state to hold, instant to start alone.", seed:true },
  { title:"Doom Eternal", score:7.5, note:"Level-sized chunks and constant feedback, but the difficulty genuinely walls people.", seed:true },
  { title:"Hollow Knight", score:5.5, note:"Great loop, but long gaps between save points and a map you have to hold in your head.", seed:true },
  { title:"Elden Ring", score:5, note:"Enormous pull, and enormous re-entry cost: two weeks off and you have forgotten where you were going and what your build does.", seed:true },
  { title:"Civilization VI", score:5, note:"The strongest pull-forward of anything here and still abandoned constantly, because one game does not fit in one session and turn 90 is unreadable after a break.", seed:true },
  { title:"Red Dead Redemption 2", score:4, note:"Long slow opening, deliberate pacing, and travel time between the parts that land.", seed:true },
  { title:"Crusader Kings III", score:3, note:"Opaque for hours, endless, and returning to a save you did not write notes on is hopeless.", seed:true },
];

const DOCTRINE = `HOLD is whether this person is still playing this game in two weeks. It is NOT quality,
score, art, ambition or whether it is worth playing. A masterpiece can score 3 and a shallow
game can score 9. Never let your opinion of the game move this number.

What raises it: being genuinely fun inside the first thirty minutes; a complete satisfying
unit — a run, a match, a level, a heist — that fits in one short sitting; being able to stop
cleanly and come back cold without relearning controls, systems or your own plan; constant
readable feedback; low cost to press play.

What sinks it: a long ramp where the game is defended as "it opens up after fifteen hours";
progress that only exists in multi-hour blocks; a build, a map or a quest state you must hold
in your head between sessions; mandatory grind or a difficulty wall in front of the good part;
launcher updates, long loads, matchmaking, or needing other people online before anything
happens; an open world that replaces gameplay with travel.

THE COMMONEST FAILURE IS NOT BOREDOM, IT IS THE GAP. A game that was loved for ten hours and
then never opened again scored high on pull and low on re-entry. Weigh re-entry as heavily as
the hook and say plainly what would be forgotten.

Be concrete about the actual game. Real minutes, real systems, the real name of the mission or
the biome where people stop. Do not write generalities about attention spans.`;

const FORM_RULES = `WHETHER IT ENDS CHANGES THE QUESTION:
- IF IT HAS AN ENDING (campaign, story, credits) then holding means reaching the credits.
  The wall is a named point in the campaign or an hour count. Say how many hours to credits
  honestly, ignoring completionist padding, and treat a fifty-hour campaign as a much harder
  ask than a twelve-hour one even when both are excellent.
- IF IT IS ENDLESS (roguelike, live service, sim, builder, competitive multiplayer) there are
  no credits, so holding means still being opened a month from now. Score re-entry on how
  punishing a two-week gap is: a roguelike forgives it completely because every run starts
  fresh; a live service punishes it hardest, because the season, the meta and the friends have
  all moved on; a long sim save is somewhere between and usually unreadable on return.
  Set hoursToCredits to 0 and set endless true.
- IF IT NEEDS OTHER PEOPLE the cost to press play includes them. A game that needs three
  friends online holds far worse than one you can drop into alone, however good it is, and
  that belongs in the friction score and said out loud in the note.`;

const PLACEMENT = `THE USER'S SCALE IS THE FINAL AUTHORITY.
Pick exactly ONE anchor below that is closest in HOLD — not genre, quality or platform.
Copy its title EXACTLY. Then give a delta from -1.5 to +1.5. 0 means just as likely to stick;
+0.5 clearly stickier; -0.5 clearly likelier to be abandoned. Usually stay within +/-0.75.
Final score = anchor score + delta. The axes are evidence for the placement, never an override.`;

const SHAPE = `FAMILIARITY 0-3: 3 you know the game thoroughly; 2 well enough; 1 mostly reputation;
0 unknown — say so rather than inventing detail.
IDENT: developer, year, and what you actually do in it, in one line, so a wrong match is caught.`;

const STATES = [
  ["fried",  "Fried",     "He is depleted. Only recommend games that ask almost nothing to start: instantly readable, short units, no build to plan, no people to coordinate, no systems to relearn."],
  ["normal", "Normal",    ""],
  ["locked", "Locked in", "He has real attention available. Denser and more demanding games are allowed — but it still has to survive the gap after this week, not merely be worth playing tonight."],
];

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const ax05=v=>clamp(Number(v)||0,0,5);
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
function band(v){
  if(v>=9)return"It'll stick";
  if(v>=8)return"Holds";
  if(v>=7)return"Holds if you set it up";
  if(v>=5.5)return"You'll drift off it";
  if(v>=4)return"Two or three sessions";
  return"Bounces in the first hour";
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* ---------- state ---------- */

const state={anchors:BASE_ANCHORS.map(x=>({...x})),log:[],seen:[],loaded:false};
let db=null,sample=null,tab="read",ctl=null;
let readTitle="",readBusy=false,readErr="";
let mood="normal",form="either",company="alone",floor=7,platform="",findBusy=false,findErr="",picks=[];
let setEasy="",setHard="",setDrop="",setErr="";
let justAdded=null,addErr="",dbUnavailable=false,dbErr="",lastSave={cloud:null,local:null};
const saveStatus={};
const DOC="games/state", LS="games:v1";

let reading={name:"Elden Ring",example:true,
  ident:"FromSoftware, 2022. An open world you explore on horseback, fighting bosses that take many attempts.",
  placement:{anchor:"Elden Ring",delta:0},
  scores:{ramp:3,session:2,reentry:1,feedback:3,grind:2,friction:4},
  notes:{ramp:"The first hour is genuinely strong — you are out in the world and fighting inside ten minutes.",
    session:"A boss attempt is short, but real progress is a two-hour loop of running back and exploring.",
    reentry:"The killer. Two weeks away and you have forgotten your build, your buttons and where you were headed, and nothing in the game reminds you.",
    feedback:"Every hill has something on it. Constant discovery, very little dead ground.",
    grind:"Not grind exactly, but hard stops. Margit and Godskin Duo end runs.",
    friction:"Loads fast, plays offline, no one else needs to be there."},
  shape:{hoursToCredits:60,sessionMinutes:120,hoursToGood:0.5,endless:false,needsOthers:false,
    wall:"Most people stop at the first wall boss, or during the second long break they take from it."},
  tactics:["Summon. The game is balanced around it and pride is what ends runs.",
    "Pick one objective a session and go straight to it — the world will otherwise eat the whole evening.",
    "Keep two weapons, not eight. A build you can describe in a sentence is one you can remember in a fortnight.",
    "If you stop for more than a week, watch two minutes of your own last save before loading it."],
  stopRule:"Stop at a site of grace after you have banked runes, and write your next objective in one line where you will see it.",
  secondScreen:"no",familiarity:3};

function payload(){return{anchors:state.anchors,log:state.log.slice(-300),seen:state.seen.slice(-300),
  last:reading&&!reading.example?reading:null,lastPicks:picks.slice(0,8),platform}}
function adopt(d){if(!d)return false;
  if(Array.isArray(d.anchors))state.anchors=d.anchors;
  if(Array.isArray(d.log))state.log=d.log;
  if(Array.isArray(d.seen))state.seen=d.seen;
  if(typeof d.platform==="string")platform=d.platform;
  if(d.last&&d.last.name){reading=d.last;readTitle=d.last.name}
  if(Array.isArray(d.lastPicks))picks=d.lastPicks;return true}

async function loadState(){let got=false;
  try{db=await claude.use("db");
    if(!db){dbUnavailable=true;dbErr="not available in this view"}
    else{const s=await db.doc(DOC).get();if(s.exists)got=adopt(s.data())}}
  catch(e){db=null;dbUnavailable=true;dbErr=(e&&(e.code||e.message))||"unknown error"}
  try{localStorage.setItem(LS+":probe","1");localStorage.removeItem(LS+":probe");lastSave.local=true}
  catch(e){lastSave.local=false}
  if(!got){try{const raw=localStorage.getItem(LS);if(raw)adopt(JSON.parse(raw))}catch(e){}}
  state.loaded=true;render()}

async function saveState(){const body=payload();let local=false,cloud=false;
  try{localStorage.setItem(LS,JSON.stringify(body));local=true}catch(e){}
  if(db){try{await db.doc(DOC).set(body);cloud=true;dbErr=""}catch(e){dbErr=(e&&(e.code||e.message))||"unknown error"}}
  lastSave={cloud,local};return local||cloud}

/* ---------- prompt blocks ---------- */

function anchorBlock(){return"HIS HOLD ANCHORS (1-10; his numbers are ground truth):\n"+
  state.anchors.slice().sort((a,b)=>b.score-a.score)
  .map(a=>`  ${a.title} = ${a.score}${a.note?" — "+a.note:""}`).join("\n")}

function correctionBlock(){const rows=state.log.filter(e=>Number.isFinite(Number(e.actual))).slice(-30);
  if(!rows.length)return"";
  return`HIS CORRECTIONS — these outrank any prediction:\n`+
    rows.map(e=>`  ${e.title}: app said ${Number(e.score).toFixed(1)}; he says ${Number(e.actual).toFixed(1)}`).join("\n")+
    `\nTreat each as an anchor.`}

// What he actually did with a game is the ground truth this scale exists to predict.
function outcomeBlock(){const rows=state.log.filter(e=>e.verdict).slice(-24);
  if(!rows.length)return"";
  const w={credits:"played it to the credits",rotation:"still has it in rotation",
    drifted:"drifted off it after a while",bailed:"bounced out of it early"};
  return`WHAT ACTUALLY HAPPENED — the outcomes this scale exists to predict. Where a prediction\nmissed, correct toward the outcome:\n`+
    rows.map(e=>`  ${e.title} — predicted ${Number(e.score).toFixed(1)} — he ${w[e.verdict]}`).join("\n")}

function platformBlock(){const p=(platform||"").trim();
  return p?`HE PLAYS ON: ${p}. Only recommend things playable there, and mention it when a game\nis notably better or worse on that hardware.`:""}

function fallbackComposite(s){let t=0;for(const a of AXES)t+=ax05(s&&s[a.key])*a.w;
  return clamp(1+9*Math.pow(t/(5*WSUM),1.15),1,10)}
function placedScore(r){if(!r)return 1;const p=r.placement;
  if(p&&p.anchor){const a=state.anchors.find(x=>norm(x.title)===norm(p.anchor));const d=Number(p.delta);
    if(a&&Number.isFinite(d))return clamp(Number(a.score)+clamp(d,-1.5,1.5),1,10)}
  const direct=Number(r.scaleScore);if(Number.isFinite(direct))return clamp(direct,1,10);
  return fallbackComposite(r.scores)}

function errCopy(e){const c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled")
    return"This page can't reach Claude. Open it from your Claude account and allow it.";
  if(c==="rate_limited")return"Too many requests, or you've hit your usage limit. Give it a minute.";
  if(c==="session_expired")return"Session expired. Sign in again, then retry.";
  if(c==="invalid_json")return"The reply came back malformed. Try again.";
  if(c==="refused")return"Claude declined that one. Try a different title.";
  return"That didn't go through. Try again."}

function saveLine(title,done){const s=saveStatus[title];
  if(s==="saving")return`<div class="status" style="margin-top:9px"><span class="dot"></span>Saving…</div>`;
  if(s==="failed")return`<div class="err" style="margin-top:9px">On screen only — the write to storage failed.</div>`;
  if(s==="ok"||done)return`<div class="saved">${lastSave.cloud?"Saved.":"Saved to this browser."}</div>`;
  return""}

function hrs(n){const v=Number(n);if(!Number.isFinite(v)||v<=0)return"";
  return v<1?`${Math.round(v*60)}<span style="font-size:12px">min</span>`:`${v%1?v.toFixed(1):v}<span style="font-size:12px">h</span>`}

    :"";

    :company==="alone"?"He is playing alone. Do not recommend anything that needs other people online to work."
    :"";
  const prompt=`Recommend up to 6 games this person would still be playing in two weeks.
${formLine}
${coLine}

${DOCTRINE}

${anchorBlock()}

${correctionBlock()}

${outcomeBlock()}

${platformBlock()}

Score each candidate on the axes as evidence (5 is always the good end, including for grind and friction):
${rubric}

   every time.

Reply with only this JSON:
{"picks":[{"title":"","year":0,"ident":"","placement":{"anchor":"EXACT title from the anchors","delta":0},
"scaleScore":0,"near":"why that anchor matches for how well it sticks",
"scores":{"ramp":0,"session":0,"reentry":0,"feedback":0,"grind":0,"friction":0},
"shape":{"sessionMinutes":0,"hoursToCredits":0,"endless":false,"needsOthers":false},

/* ---------- logging ---------- */

async function logVerdict(title,score,verdict){
  const i=state.log.findIndex(e=>e.title===title);
  const row=Object.assign({},i>=0?state.log[i]:{},{title,score:Number(score),verdict,at:Date.now()});
  if(i>=0)state.log[i]=row;else state.log.push(row);
  saveStatus[title]="saving";render();
  const ok=await saveState();saveStatus[title]=ok?"ok":"failed";render()}

async function logCorrection(title,predicted,actual){
  const n=Number(actual);if(!Number.isFinite(n))return;
  const v=clamp(n,1,10);
  const i=state.log.findIndex(e=>e.title===title);
  const row=Object.assign({},i>=0?state.log[i]:{},{title,score:Number(predicted),actual:v,at:Date.now()});
  if(i>=0)state.log[i]=row;else state.log.push(row);
  const ex=state.anchors.find(a=>norm(a.title)===norm(title));
  const note=`Yours, after the app said ${Number(predicted).toFixed(1)}.`;
  if(ex){ex.score=v;if(ex.seed){ex.note=note;delete ex.seed}}
  else state.anchors.push({title,score:v,note});
  saveStatus[title]="saving";render();
  const ok=await saveState();saveStatus[title]=ok?"ok":"failed";render()}

async function mutateAnchors(fn){fn();saveStatus.anchors="saving";render();
  const ok=await saveState();saveStatus.anchors=ok?"ok":"failed";render();
  const row=document.getElementById("justadded");
  if(row&&row.scrollIntoView)row.scrollIntoView({block:"center",behavior:"smooth"})}

  const kept=state.log.filter(e=>e.verdict==="credits"||e.verdict==="rotation");
  const lost=state.log.filter(e=>e.verdict==="bailed"||e.verdict==="drifted");
  const avg=rows=>rows.length?(rows.reduce((s,e)=>s+Number(e.score),0)/rows.length).toFixed(1):"—";

  let h=`<h2 class="sec">Is it reading you</h2>

      <div><div class="n">${avg(lost)}</div><span class="lab">Abandoned</span><div class="aval">${lost.length} logged</div></div>
      <div><div class="n">${mae===null?"—":mae.toFixed(2)}</div><span class="lab">Avg miss</span><div class="aval">${corr.length} corrections</div></div>
    </div>

  if(!state.log.length)h+=`<p class="empty">Nothing yet. Check a game, play it, then say what happened.</p>`;
  else h+=`<div class="tw"><table><thead><tr><th>Game</th><th>Said</th><th>You</th><th>Outcome</th><th></th></tr></thead><tbody>
    ${state.log.slice().reverse().map(e=>`<tr><td>${esc(e.title)}</td>
      <td class="num">${Number(e.score).toFixed(1)}</td>
      <td class="num">${Number.isFinite(Number(e.actual))?Number(e.actual).toFixed(1):"—"}</td>
      <td>${(VERDICTS.find(v=>v.key===e.verdict)||{}).label||"—"}</td>
      <td class="num"><button class="del" data-act="dellog" data-t="${esc(e.title)}" aria-label="Remove">&times;</button></td></tr>`).join("")}
    </tbody></table></div>`;

  if(state.anchors.some(a=>a.seed))h+=`
    <h2 class="sec">Build your scale</h2>
    <p class="subtle">The anchors below are mine — estimates about a generic player, not your history. Everything gets placed against them, so they need to be yours. Name games you have actually played and it will replace mine with those. Hours played is the honest test, not whether you liked it.</p>
    <label class="fieldlab lab" for="s-easy">Sank hours into without trying</label>
    <input type="text" id="s-easy" placeholder="Comma separated" value="${esc(setEasy)}">
    <label class="fieldlab lab" for="s-hard">Finished, but had to push</label>
    <input type="text" id="s-hard" placeholder="Comma separated" value="${esc(setHard)}">
    <label class="fieldlab lab" for="s-drop">Bought or started and dropped</label>
    <input type="text" id="s-drop" placeholder="Comma separated" value="${esc(setDrop)}">
    <div class="seg" style="margin-top:14px">
      <button class="go" data-act="setscale">Use these as my scale</button>
      <button data-act="dropseeds">Just delete yours</button>
    </div>
    ${setErr?`<div class="err">${esc(setErr)}</div>`:""}
    <p class="note">Scored 9 / 6.5 / 3 to start. Adjust any of them below — those numbers are the ruler.</p>`;

  h+=`<h2 class="sec">Anchors</h2>
    <p class="subtle">The actual ruler. Every check and every recommendation is placed against these, so fix any number you disagree with. A game you put 200 hours into is a 9 here even if you think it is trash.</p>
    <div class="tw"><table><thead><tr><th>Game</th><th>Score</th><th>Note</th><th></th></tr></thead><tbody>
    ${state.anchors.slice().sort((a,b)=>b.score-a.score).map(a=>`<tr${a.title===justAdded?` class="justadded" id="justadded"`:""}>
      <td>${esc(a.title)}${a.title===justAdded?` <span class="lab" style="color:var(--sig)">added</span>`:""}${a.seed?` <span class="lab">my guess</span>`:""}</td>
      <td class="num"><input type="text" class="anchsc" data-t="${esc(a.title)}" value="${a.score}" style="width:62px;padding:7px 6px" inputmode="decimal"></td>
      <td style="color:var(--dim);font-size:13px">${esc(a.note||"")}</td>
      <td class="num"><button class="del" data-act="delanch" data-t="${esc(a.title)}" aria-label="Remove">&times;</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="addrow">
      <input type="text" id="na" placeholder="Game" autocomplete="off">

    ${addErr?`<div class="err">${esc(addErr)}</div>`:""}
    ${saveStatus.anchors==="ok"&&justAdded?`<div class="saved">Added. It's the ruler now.</div>`:""}

function storageLine(){
  const cloud=db?(dbErr?`failing (${esc(dbErr)})`:"working"):`unavailable${dbErr?` (${esc(dbErr)})`:""}`;
  const local=lastSave.local===true?"working":lastSave.local===false?"blocked":"untested";
  return`<h2 class="sec">Storage</h2><p class="subtle">Cloud: <b>${cloud}</b><br>This browser: <b>${local}</b></p>`}

/* ---------- plumbing ---------- */

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===tab)));
  const m={read:["panel-read",readPanel],find:["panel-find",findPanel],cal:["panel-cal",calPanel]};
  for(const k of Object.keys(m)){const el=document.getElementById(m[k][0]);
    el.hidden=k!==tab;if(k===tab)el.innerHTML=m[k][1]()}}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act],.tab");if(!t)return;
  if(t.classList.contains("tab")){tab=t.dataset.tab;addErr="";return render()}
  const act=t.dataset.act,v=t.dataset.v;
  if(act==="read")return void doRead();
  if(act==="find")return void doFind();
  if(act==="toscale"){tab="cal";return render()}
  if(act==="mood"){mood=v;return render()}
  if(act==="form"){form=v;return render()}
  if(act==="company"){company=v;return render()}
  if(act==="floor"){const pin=document.getElementById("plat");if(pin)platform=(pin.value||"").trim();
    floor=Number(v);return render()}
  if(act==="correct"&&reading&&!reading.example){
    const el=document.getElementById("actual"),raw=(el&&el.value||"").trim();
    if(!raw||!Number.isFinite(Number(raw))){readErr="Give a score from 1 to 10.";return render()}
    readErr="";return void logCorrection(reading.name,placedScore(reading),Number(raw))}
  if(act==="verdict"&&reading&&!reading.example)
    return void logVerdict(reading.name,placedScore(reading),v);
  if(act==="pverdict"){const p=picks[Number(t.dataset.i)];
    if(p)void logVerdict(p.title,placedScore(p),v);return}
  if(act==="dellog"){state.log=state.log.filter(e=>e.title!==t.dataset.t);saveState();return render()}
  if(act==="delanch")return void mutateAnchors(()=>{state.anchors=state.anchors.filter(a=>a.title!==t.dataset.t)});
  if(act==="setscale"){
    const grab=id=>(document.getElementById(id).value||"").split(",").map(x=>x.trim()).filter(Boolean);
    const easy=grab("s-easy"),hard=grab("s-hard"),drop=grab("s-drop");
    setEasy=easy.join(", ");setHard=hard.join(", ");setDrop=drop.join(", ");
    if(easy.length+hard.length+drop.length<3){setErr="Name at least three between them, and try to fill more than one row — a scale needs a spread.";return render()}
    if(!easy.length||!drop.length){setErr="It needs both ends: something you sank hours into and something you dropped.";return render()}
    setErr="";
    const mk=(list,score,note)=>list.map(t=>({title:t,score,note}));
    const fresh=[];
    for(const a of mk(easy,9,"You kept coming back to it without effort.")
      .concat(mk(hard,6.5,"You got through it, but you had to push."),
              mk(drop,3,"You started it and dropped it.")))
      {const i=fresh.findIndex(x=>norm(x.title)===norm(a.title));if(i>=0)fresh[i]=a;else fresh.push(a)}
    return void mutateAnchors(()=>{
      state.anchors=state.anchors.filter(a=>!a.seed&&!fresh.some(f=>norm(f.title)===norm(a.title)))
        .concat(fresh);
      setEasy=setHard=setDrop=""})}
  if(act==="dropseeds")return void mutateAnchors(()=>{state.anchors=state.anchors.filter(a=>!a.seed)});
  if(act==="addanch"){
    const ti=document.getElementById("na"),sc=document.getElementById("ns");
    const title=(ti.value||"").trim(),raw=(sc.value||"").trim();
    if(!title){addErr="Type a game first.";return render()}
    if(!raw||!Number.isFinite(Number(raw))){addErr="Give it a score out of 10.";return render()}
    addErr="";const score=clamp(Number(raw),1,10);justAdded=title;
    return void mutateAnchors(()=>{
      state.anchors=state.anchors.filter(a=>norm(a.title)!==norm(title));
      state.anchors.push({title,score,note:""})})}});

document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id==="q")doRead();
  if(ev.key==="Enter"&&ev.target.id==="plat"){platform=(ev.target.value||"").trim();doFind()}
  if(ev.key==="Enter"&&(ev.target.id==="na"||ev.target.id==="ns")){
    const b=document.querySelector('[data-act="addanch"]');if(b)b.click()}});

document.addEventListener("change",ev=>{
  if(ev.target.id==="plat"){platform=(ev.target.value||"").trim();return void saveState()}
  if(!ev.target.classList.contains("anchsc"))return;
  const v=Number(ev.target.value),a=state.anchors.find(x=>x.title===ev.target.dataset.t);
  if(a&&Number.isFinite(v))void mutateAnchors(()=>{a.score=clamp(v,1,10);delete a.seed})});

render();
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!sample){readErr="This page can't reach Claude from here. Open it from your Claude account.";findErr=readErr;render()}
  loadState()})();
</script>
