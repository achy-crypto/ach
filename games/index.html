<title>Two Hours In</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#e9ecee;--card:#f7f8f9;--ink:#16191d;--dim:#666d75;
  --rule:#ccd2d7;--soft:#dde1e4;--sig:#2f6f8f;--sig-wash:#2f6f8f1a;--ok:#2f7a55;--bad:#a33227;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101316;--card:#181c20;--ink:#e7e9ea;--dim:#8b939b;
  --rule:#2a2f35;--soft:#212529;--sig:#67b2d6;--sig-wash:#67b2d624;--ok:#6db98c;--bad:#e0776a}}
:root[data-theme="dark"]{
  --ground:#101316;--card:#181c20;--ink:#e7e9ea;--dim:#8b939b;
  --rule:#2a2f35;--soft:#212529;--sig:#67b2d6;--sig-wash:#67b2d624;--ok:#6db98c;--bad:#e0776a}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;
  font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:26px 18px 80px}
.lab{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}

header.top{border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top h1{font-family:"Barlow Condensed",sans-serif;font-size:33px;font-weight:700;
  letter-spacing:.01em;margin:0;text-transform:uppercase}
header.top p{margin:5px 0 0;color:var(--dim);font-size:13.5px;max-width:56ch}
.hr{border-bottom:1px solid var(--ink);margin-bottom:18px}

.tabs{display:flex;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--dim);padding:11px 13px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sig)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--card);border:1px solid var(--rule);border-radius:3px;
  color:var(--ink);font-family:inherit;font-size:16px;padding:12px 13px}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{outline:none;border-color:var(--sig)}
input[type=range]{width:100%;accent-color:var(--sig);height:30px}
button.go{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--ground);
  font-family:inherit;font-weight:600;font-size:15px;padding:12px 20px;border-radius:3px;cursor:pointer;min-height:46px}
button.go:hover{background:transparent;color:var(--ink)}
button.go[disabled]{opacity:.45}
button.ghost{appearance:none;background:none;border:1px solid var(--rule);color:var(--ink);border-radius:3px;
  font-family:inherit;font-size:14px;font-weight:600;padding:11px 15px;cursor:pointer;min-height:44px}
.seg{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.seg button{appearance:none;background:none;border:1px solid var(--rule);color:var(--dim);border-radius:3px;
  font-family:"Roboto Mono",monospace;font-size:11.5px;padding:10px 12px;cursor:pointer;min-height:42px;
  touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.fieldlab{margin:18px 0 0;display:block}

.status{margin-top:15px;font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:9px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--sig);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.status .dot{animation:none}}
.err{margin-top:15px;border-left:2px solid var(--sig);padding:8px 0 8px 12px;font-size:13.5px}
.saved{color:var(--ok);font-size:13px;margin-top:9px}
.note{color:var(--dim);font-size:13px;margin-top:12px;max-width:60ch}
.subtle{color:var(--dim);font-size:13px;margin:4px 0 0;max-width:62ch}
h2.sec{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;
  font-size:19px;font-weight:700;margin:30px 0 0}
.callout{border-left:2px solid var(--sig);background:var(--sig-wash);padding:9px 12px;font-size:13.5px;margin-top:14px}
.caution{border-left:2px solid var(--bad);background:var(--card);padding:9px 12px;font-size:13.5px;margin-top:14px}

/* result head */
.sheet{margin-top:22px}
.flagx{display:inline-block;border:1px solid var(--rule);color:var(--dim);font-family:"Roboto Mono",monospace;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;margin-bottom:10px}
.verdict{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:15px 0 17px}
.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.vname{font-size:19px;font-weight:600;line-height:1.25}
.vident{color:var(--dim);font-size:13px;margin-top:3px;max-width:44ch}
.vnum{font-family:"Barlow Condensed",sans-serif;font-size:58px;font-weight:700;line-height:.82;
  color:var(--sig);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.vnum small{font-size:22px;font-weight:600}
.vband{text-align:right;font-family:"Roboto Mono",monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-top:6px;max-width:22ch;margin-left:auto;text-wrap:balance}
.nodata{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;text-align:right;
  color:var(--dim);line-height:1.05;max-width:8ch;margin-left:auto}

/* confidence meter, kept visually separate from the score */
.conf{margin-top:14px;border:1px solid var(--rule);background:var(--card);padding:11px 12px}
.conf .bar{height:7px;background:var(--soft);margin-top:7px;display:flex;gap:2px}
.conf .bar i{flex:1;background:var(--soft)}
.conf .bar i.on{background:var(--dim)}
.conf .ln{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.conf .v{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--dim)}

/* reasons and frictions */
.reasons{margin-top:16px}
.rz{border-top:1px solid var(--soft);padding:11px 0}
.rz:first-child{border-top:1px solid var(--rule)}
.rzh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rzt{font-size:14.5px;font-weight:600}
.rzt em{font-style:normal;color:var(--dim);font-weight:400}
.rzv{font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--dim);white-space:nowrap}
.rze{color:var(--dim);font-size:13.5px;margin-top:3px}
.pos .rzt::before{content:"";display:inline-block;width:7px;height:7px;background:var(--ok);margin-right:8px;vertical-align:middle}
.neg .rzt::before{content:"";display:inline-block;width:7px;height:7px;background:var(--bad);margin-right:8px;vertical-align:middle}

/* feature table */
.feat{padding:11px 0;border-bottom:1px solid var(--soft)}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.flab{font-size:14.5px;font-weight:600}
.fhint{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:1px}
.fval{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--dim);white-space:nowrap}
.scaleline{position:relative;height:16px;margin:9px 0 6px}
.scaleline .track{position:absolute;top:7px;left:0;right:0;height:2px;background:var(--rule)}
.scaleline .band{position:absolute;top:4px;height:8px;background:var(--sig-wash);border-left:1px solid var(--sig);border-right:1px solid var(--sig)}
.scaleline .you{position:absolute;top:1px;width:2px;height:14px;background:var(--sig)}
.scaleline .it{position:absolute;top:0;width:11px;height:11px;border-radius:50%;background:var(--ink);margin-left:-5px;top:2px}
.scaleline .unk{position:absolute;top:0;left:0;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--dim)}
.fev{color:var(--dim);font-size:13px}

/* tactics */
.plan{margin-top:20px;border:1px solid var(--ink);border-radius:3px;background:var(--card);padding:15px 17px}
.plan h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;
  font-size:17px;font-weight:700;margin:0 0 4px}
.plan ul{margin:10px 0 0;padding-left:19px}
.plan li{margin-bottom:7px;font-size:14.5px}
.plan li:last-child{margin-bottom:0}
.stoprule{margin-top:13px;border-top:1px solid var(--rule);padding-top:11px;font-size:14px}

/* feedback */
.after{margin-top:20px;border-top:1px solid var(--rule);padding-top:13px}
.qrow{margin-top:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{appearance:none;background:var(--card);border:1px solid var(--rule);color:var(--ink);border-radius:3px;
  font-family:inherit;font-size:14px;padding:12px 14px;cursor:pointer;
  min-height:46px;flex:1 1 auto;min-width:74px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip:active{background:var(--ink);color:var(--ground)}
.chip.wide{min-width:140px}

/* picks */
.pick{border-top:1px solid var(--rule);padding:15px 0}
.pick:first-of-type{border-top:2px solid var(--ink)}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.pname{font-size:16.5px;font-weight:600}
.pname span{color:var(--dim);font-weight:400}
.pnum{font-family:"Roboto Mono",monospace;font-size:19px;font-weight:500;color:var(--sig);white-space:nowrap}
.pident{color:var(--dim);font-size:12.5px;margin-top:3px}
.pwhy{margin-top:8px;font-size:14.5px}
.pwhy b{font-weight:600}
.tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:"Roboto Mono",monospace;font-size:10.5px;border:1px solid var(--rule);color:var(--dim);padding:3px 8px}
.tag.warn{border-color:var(--bad);color:var(--bad)}

/* profile */
.pf{padding:14px 0;border-bottom:1px solid var(--soft)}
.pfh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pfname{font-size:15px;font-weight:600}
.pfv{font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--dim);white-space:nowrap}
.sl{margin-top:8px}
.sl label{display:flex;justify-content:space-between;font-family:"Roboto Mono",monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pinned{color:var(--sig)}
.onb{margin-top:12px}
.onb .r{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.onb .r input.t{flex:1 1 150px;min-width:130px}
.onb .r input.w{flex:1 1 170px;min-width:130px}

/* tables */
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:400;border-bottom:1px solid var(--ink);padding:0 10px 6px 0;white-space:nowrap}
td{border-bottom:1px solid var(--soft);padding:9px 10px 9px 0;vertical-align:top}
td.num{font-family:"Roboto Mono",monospace;white-space:nowrap}
.del{appearance:none;background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;font-size:18px;padding:4px 6px}
.del:hover{color:var(--sig)}
.readout{margin-top:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.readout div{background:var(--card);padding:11px 12px}
.readout .n{font-family:"Roboto Mono",monospace;font-size:20px}
.empty{color:var(--dim);font-size:13.5px;margin-top:12px;font-style:italic}
[hidden]{display:none!important}

/* expandable detail */
details{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
details>summary{cursor:pointer;font-family:"Roboto Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);list-style:none;padding:8px 0;min-height:36px;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";font-size:14px;line-height:1}
details[open]>summary::before{content:"\2212"}
details>summary:hover{color:var(--ink)}

/* one result card */
.card{border-top:1px solid var(--rule);padding:16px 0}
.card:first-of-type{border-top:2px solid var(--ink)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.cname{font-size:17px;font-weight:600;line-height:1.25}
.cmeta{color:var(--dim);font-size:12.5px;margin-top:3px}
.cscore{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;line-height:.85;
  color:var(--sig);font-variant-numeric:tabular-nums;text-align:right}
.cprov{font-family:"Roboto Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);text-align:right;margin-top:4px}
.closest{margin-top:11px;font-size:14.5px}
.closest b{font-weight:600}
.bul{margin:9px 0 0;padding-left:18px}
.bul li{font-size:14px;margin-bottom:4px}
.bul li.fr{color:var(--bad)}
.prov{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
.prov span{font-family:"Roboto Mono",monospace;font-size:10.5px;border:1px solid var(--rule);color:var(--dim);padding:3px 8px}
.prov span.est{border-color:var(--sig);color:var(--sig)}
.prov span.thin{border-color:var(--bad);color:var(--bad)}
.setup{border:1px solid var(--sig);background:var(--sig-wash);padding:13px 15px;margin-top:16px;font-size:13.5px}
.setup h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;
  font-size:16px;font-weight:700;margin:0 0 6px}
.setup code{font-family:"Roboto Mono",monospace;font-size:12px;background:var(--card);padding:1px 5px}
.setup ol{margin:8px 0 0;padding-left:20px}
.setup li{margin-bottom:5px}
.rs{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.rs button{appearance:none;background:var(--card);border:1px solid var(--rule);color:var(--ink);border-radius:3px;
  font-family:inherit;font-size:13.5px;padding:10px 12px;cursor:pointer;min-height:44px;touch-action:manipulation}
.rs button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--ground)}
.sugg{margin-top:10px;border-left:2px solid var(--sig);padding:8px 0 8px 12px;font-size:13.5px}
.sugg .rs button{min-height:40px;font-size:13px}
</style>

<div class="wrap">
  <header class="top">
    <h1>Two Hours In</h1>
    <p>Not whether a game is good — whether it holds <em>you</em>. Every game you enjoyed is kept as its own example, and a candidate only has to resemble one of them.</p>
  </header>
  <div class="hr"></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="read" aria-selected="true">Check one</button>
    <button class="tab" data-tab="find" aria-selected="false">Find one</button>
    <button class="tab" data-tab="me" aria-selected="false">Your games</button>
  </div>
  <section id="panel-read"></section>
  <section id="panel-find" hidden></section>
  <section id="panel-me" hidden></section>
</div>

<script>
"use strict";

/* ============================================================================
   1. THE SCORING ENGINE

   Each liked game is a separate example of an experience that worked. A
   candidate matches whichever example it most resembles; liked games are never
   averaged into one imaginary game, so two unrelated tastes do not cancel out.

   The constants here are initial heuristics. They are not validated
   probabilities, and nothing below learns clusters or optimises weights.
   ========================================================================== */

const MATCH_KEYS = [
  "pace", "feedback", "decisions", "variety", "clarity",
  "overhead", "challenge", "downtime", "onramp"
];

function featureValue(features, key) {
  const value = features?.[key]?.value;
  return typeof value === "number" && Number.isFinite(value)
    ? Math.max(0, Math.min(10, value))
    : null;
}

// Importance weights are applied only to known feature pairs.
// Missing information is never interpreted as a zero rating.
function featureSimilarity(a, b, weights = {}, tolerance = 3) {
  let distance = 0;
  let knownWeight = 0;
  let totalWeight = 0;
  let knownCount = 0;
  const parts = [];

  for (const key of MATCH_KEYS) {
    const raw = weights[key];
    const weight = Number.isFinite(raw) ? Math.max(0, raw) : 1;
    totalWeight += weight;

    const av = featureValue(a, key);
    const bv = featureValue(b, key);
    if (av === null || bv === null || weight === 0) continue;

    const gap = av - bv;
    const cost = weight * gap * gap;
    distance += cost;
    knownWeight += weight;
    knownCount++;
    parts.push({ key, gap, cost, candidate: av, reference: bv });
  }

  const coverage = totalWeight > 0 ? knownWeight / totalWeight : 0;

  if (knownCount < 5 || coverage < 0.6) return null;

  const similarity = Math.exp(
    -distance / (2 * knownWeight * tolerance ** 2)
  );

  return {
    similarity,
    coverage,
    parts: parts.sort((a, b) => b.cost - a.cost)
  };
}

// Structured feedback prevents "bad tutorial" from meaning
// "dislikes every feature this game has."
const REASON_RULES = {
  slow_start:       { feature: "onramp", direction: 1 },
  too_repetitive:   { feature: "variety", direction: -1 },
  confusing_goals:  { feature: "clarity", direction: -1 },
  too_much_admin:   { feature: "overhead", direction: 1 },
  too_hard:         { feature: "challenge", direction: 1 },
  too_easy:         { feature: "challenge", direction: -1 },
  too_slow:         { feature: "pace", direction: -1 },
  too_frantic:      { feature: "pace", direction: 1 },
  too_much_waiting: { feature: "downtime", direction: 1 }
};

function reasonPenalty(candidate, droppedExamples) {
  const strongestByFeature = new Map();

  for (const example of droppedExamples) {
    for (const reason of example.reasons || []) {
      const rule = REASON_RULES[reason];
      if (!rule) continue;

      const candidateValue = featureValue(candidate, rule.feature);
      const dislikedValue = featureValue(example.features, rule.feature);

      if (candidateValue === null || dislikedValue === null) continue;

      // Similar or worse on the explicitly disliked dimension
      // receives a penalty. Improving by 3 points removes it.
      const badness =
        rule.direction * (candidateValue - dislikedValue);

      const severity = Math.max(0, Math.min(1, (badness + 3) / 3));
      const previous = strongestByFeature.get(rule.feature) || 0;

      strongestByFeature.set(
        rule.feature,
        Math.max(previous, severity)
      );
    }
  }

  const triggers = [...strongestByFeature.entries()]
    .filter(([, severity]) => severity > 0)
    .map(([feature, severity]) => ({ feature, severity }))
    .sort((a, b) => b.severity - a.severity);

  // Bounded penalty; repeated ratings cannot multiply it forever.
  const points = Math.min(
    25,
    triggers.reduce((sum, trigger) => sum + trigger.severity * 8, 0)
  );

  return { points, triggers };
}

function scoreGame(candidate, profile) {
  const liked = profile.liked || [];
  const dropped = profile.dropped || [];
  const weights = profile.weights || {};
  const tolerance = Number.isFinite(profile.tolerance) ? profile.tolerance : 3;

  const matches = liked
    .filter(example => example.id !== candidate.id)
    .map(example => {
      const result = featureSimilarity(
        candidate.features,
        example.features,
        weights,
        tolerance
      );
      return result ? {
        ...result,
        id: example.id,
        title: example.title
      } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.similarity - a.similarity);

  if (!matches.length) {
    return {
      ok: false,
      reason: liked.length
        ? "Not enough comparable gameplay data"
        : "Add a game you enjoyed to personalize results"
    };
  }

  // Strongest matching experience wins. Different taste patterns
  // don't cancel each other out.
  const best = matches[0];
  const baseScore = best.similarity * 100;
  const friction = reasonPenalty(candidate.features, dropped);

  return {
    ok: true,
    score: Math.round(Math.max(0, baseScore - friction.points)),
    baseScore,
    coverage: best.coverage,
    matchedGame: best.title,
    similarExamples: matches.slice(0, 3),
    matchingFeatures: best.parts
      .filter(part => Math.abs(part.gap) <= 2)
      .sort((a, b) => Math.abs(a.gap) - Math.abs(b.gap))
      .slice(0, 3),
    mismatches: best.parts
      .filter(part => Math.abs(part.gap) > 2)
      .slice(0, 3),
    frictionTriggers: friction.triggers,
    provisional: liked.length < 3
  };
}

/* ============================================================================
   FEATURE VOCABULARY
   ========================================================================== */

const FEATURES = [
  { key:"pace",      label:"Pace",                 hint:"How fast things happen moment to moment",          lo:"Slow",       hi:"Relentless" },
  { key:"feedback",  label:"Feedback speed",       hint:"How fast an action produces a visible result",     lo:"Delayed",    hi:"Instant" },
  { key:"decisions", label:"Meaningful decisions", hint:"How often a choice that actually matters comes up",lo:"Rare",       hi:"Constant" },
  { key:"variety",   label:"Variety",              hint:"How much the activity changes as you keep playing",lo:"Repetitive", hi:"Always new" },
  { key:"clarity",   label:"Goal clarity",         hint:"How plainly it tells you what to do next",         lo:"Work it out",hi:"Always obvious" },
  { key:"overhead",  label:"Mental overhead",      hint:"Systems, inventory, map and build you must hold",  lo:"Almost none",hi:"Heavy" },
  { key:"challenge", label:"Challenge",            hint:"How demanding it is to keep up",                   lo:"Forgiving",  hi:"Punishing" },
  { key:"downtime",  label:"Downtime",             hint:"Travel, menus, cutscenes, waiting, loading",       lo:"Almost none",hi:"Constant" },
  { key:"onramp",    label:"Time to the good part",hint:"How long before it is genuinely engaging",         lo:"Minutes",    hi:"Many hours" },
];
const FLABEL = Object.fromEntries(FEATURES.map(f=>[f.key,f.label]));

const REASON_LABELS = {
  slow_start:"Slow start", too_repetitive:"Got repetitive", confusing_goals:"Never knew what to do",
  too_much_admin:"Too much admin", too_hard:"Too hard", too_easy:"Too easy",
  too_slow:"Too slow", too_frantic:"Too frantic", too_much_waiting:"Too much waiting"
};
const REASON_KEYS = Object.keys(REASON_RULES);

// Free text is never turned into a penalty on its own. These only PROPOSE a tag,
// which does nothing until it is tapped.
const REASON_HINTS = [
  [/tutorial|slow (start|open)|takes (too )?long to get go|first (few )?hours?|ramp/i, "slow_start"],
  [/repetitive|same thing|samey|grind|got old|stale/i, "too_repetitive"],
  [/confus|didn'?t know what|no idea what|unclear|lost|aimless/i, "confusing_goals"],
  [/inventory|menus?|admin|micromanag|bookkeep|spreadsheet|管理|upkeep/i, "too_much_admin"],
  [/too hard|difficult|brutal|kept dying|unfair|wall/i, "too_hard"],
  [/too easy|no challenge|trivial|braindead/i, "too_easy"],
  [/too slow|sluggish|plodding|crawl/i, "too_slow"],
  [/frantic|chaotic|too fast|overwhelm|stressful/i, "too_frantic"],
  [/waiting|travel|loading|walking sim|downtime|backtrack/i, "too_much_waiting"],
];
function suggestReasons(text){
  const t=String(text||"");if(t.trim().length<4)return[];
  const out=[];for(const [re,key] of REASON_HINTS)if(re.test(t)&&!out.includes(key))out.push(key);
  return out}

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const num=v=>{if(v===null||v===undefined||v==="")return null;
  const n=Number(v);return Number.isFinite(n)?n:null};
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").replace(/[^a-z0-9 ]/g,"").trim();
const slug=s=>norm(s).replace(/ /g,"-").slice(0,60);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* ============================================================================
   3. CATALOG

   Gameplay feature RECORDS live here, keyed by a stable id and stored apart
   from anything about the user. Catalog metadata (who made it, when, what it
   runs on) is kept separate from the inferred gameplay ratings, and a rating
   carries whether it was sourced or is an unverified estimate.

   A live catalog is NOT connected. See catalogStatus() for exactly what that
   needs — this page cannot reach one on its own, and an AI-written list of
   titles is not a catalog search, so it is labelled as what it is.
   ========================================================================== */

const CATALOG = {
  // Fill in to enable real search. Nothing here is guessed at runtime.
  connector: null,      // {server:"<claude.ai connector name>", searchTool:"", lookupTool:""}
  endpoint: null,       // {url:"https://your-proxy.example/igdb", note:"needs a backend; see setup"}
};
function catalogConnected(){return !!(CATALOG.connector||CATALOG.endpoint)}

function catalogStatus(){
  return {connected:catalogConnected(),
    provider:CATALOG.connector?"connector":CATALOG.endpoint?"endpoint":"none"}}

const SOURCE = {
  catalog:  {label:"catalog", sourced:true},
  estimate: {label:"unverified estimate", sourced:false},
  manual:   {label:"entered by you", sourced:false},
};

// id is stable across sessions and is what feedback, shown-lists and scoring key on.
function makeId(source,title,externalId){
  if(externalId)return `${source}:${externalId}`;
  return `est:${slug(title)}`}

function getGame(id){return state.games[id]||null}
function findGameByTitle(title){const n=norm(title);
  return Object.values(state.games).find(g=>norm(g.title)===n)||null}

function putGame(rec){
  const prev=state.games[rec.id]||{};
  state.games[rec.id]=Object.assign({},prev,rec,{
    meta:Object.assign({},prev.meta,rec.meta),
    ratings:rec.ratings?Object.assign({},prev.ratings,rec.ratings):prev.ratings});
  const ids=Object.keys(state.games);
  if(ids.length>300){ids.sort((a,b)=>(state.games[a].at||0)-(state.games[b].at||0));
    for(const id of ids.slice(0,ids.length-300))
      if(!state.feedback.some(f=>f.id===id))delete state.games[id]}
  return state.games[rec.id]}

// Ratings are shaped {features:{key:{value,evidence,confidence}}, sourced, refs[], selfConfidence}.
// selfConfidence is the MODEL's own claim and is never shown as verified confidence.
function cleanFeatures(raw){const out={};
  let get;
  if(Array.isArray(raw))get=i=>{const a=raw[i];
    return Array.isArray(a)?{value:a[0],confidence:a[1],evidence:a[2]}:(a||{})};
  else get=i=>(raw&&raw[MATCH_KEYS[i]])||{};
  for(let i=0;i<MATCH_KEYS.length;i++){const c=get(i);
    const v=num(c.value);
    const cell={value:v===null?null:clamp(v,0,10),
      confidence:clamp(num(c.confidence)??0,0,1),
      evidence:String(c.evidence||"").slice(0,220)};
    if(cell.confidence<=0.05||!cell.evidence){cell.value=null;cell.confidence=0}
    out[MATCH_KEYS[i]]=cell}
  return out}

function knownCount(features){return MATCH_KEYS.filter(k=>featureValue(features,k)!==null).length}
function selfConfidence(features){
  let s=0,n=0;for(const k of MATCH_KEYS){const c=features&&features[k];
    if(!c||featureValue(features,k)===null)continue;s+=clamp(num(c.confidence)??0,0,1);n++}
  return n?s/n:0}

/* ============================================================================
   2. PROFILE FROM SAVED FEEDBACK
   ========================================================================== */

// A game never played is not a dislike. A middling rating is neither.
function labelOf(fb){
  if(!fb||fb.played===false)return"";
  const e=num(fb.engage),r=num(fb.ret);
  if(e===null||r===null)return"";
  const pull=(e+r)/2;
  if(pull>=7)return"liked";
  if(pull<=4)return"dropped";
  return"mixed"}

function buildProfile(){
  const liked=[],dropped=[],unrated=[];
  for(const fb of state.feedback){
    const g=getGame(fb.id);
    const lab=labelOf(fb);
    if(!g||!g.ratings||!g.ratings.features){if(lab)unrated.push(fb.title);continue}
    const ex={id:fb.id,title:g.title,features:g.ratings.features,
      reasons:Array.isArray(fb.reasons)?fb.reasons.filter(r=>REASON_RULES[r]):[]};
    if(lab==="liked")liked.push(ex);
    else if(lab==="dropped")dropped.push(ex)}
  return {liked,dropped,unrated,weights:state.weights,tolerance:state.tolerance}}

/* ============================================================================
   STATE AND STORAGE
   ========================================================================== */

const SCHEMA=4;
const state={games:{},feedback:[],weights:{},tolerance:3,
  themesLike:"",themesAvoid:"",shown:[],lastError:null,loaded:false};
for(const k of MATCH_KEYS)state.weights[k]=1;

let db=null,sample=null,tab="read",ctl=null;
let readTitle="",readBusy=false,readErr="",readingId=null,readStep="";
let form="either",company="alone",offlineOnly=false,platform="";
let findBusy=false,findErr="",findNotes=[],findStep="",pickIds=[];
let includeRated=false;
let dbUnavailable=false,dbErr="",lastSave={cloud:null,local:null};
const saveStatus={},suggested={};
const DOC="games/profile", LS="games:v2";

function payload(){return{v:SCHEMA,games:state.games,feedback:state.feedback.slice(-400),
  weights:state.weights,tolerance:state.tolerance,
  themesLike:state.themesLike,themesAvoid:state.themesAvoid,
  shown:state.shown.slice(-400),platform,lastReadId:readingId,lastError:state.lastError}}

// The store hands back FROZEN objects and everything here gets mutated later, so
// loaded state is copied out before it is adopted.
function thaw(v){try{return v==null?v:JSON.parse(JSON.stringify(v))}catch(e){return null}}

function adopt(d){if(!d)return false;
  if(d.games&&typeof d.games==="object")state.games=d.games;
  if(Array.isArray(d.feedback))state.feedback=d.feedback;
  if(d.weights)for(const k of MATCH_KEYS)
    if(num(d.weights[k])!==null)state.weights[k]=Math.max(0,num(d.weights[k]));
  if(num(d.tolerance)!==null&&num(d.tolerance)>0)state.tolerance=num(d.tolerance);
  if(Array.isArray(d.shown))state.shown=d.shown;
  if(typeof d.themesLike==="string")state.themesLike=d.themesLike;
  if(typeof d.themesAvoid==="string")state.themesAvoid=d.themesAvoid;
  if(typeof d.platform==="string")platform=d.platform;
  if(d.lastError)state.lastError=d.lastError;
  if(d.lastReadId)readingId=d.lastReadId;
  if((d.v||0)<SCHEMA)migrate(d);
  if(readingId&&!getGame(readingId))readingId=null;
  if(readingId)readTitle=getGame(readingId).title;
  return true}

// Everything saved under the old title-keyed shape is carried over, not dropped.
function migrate(d){
  const cache=d.cache&&typeof d.cache==="object"?d.cache:null;
  if(cache)for(const key of Object.keys(cache)){const c=cache[key];
    if(!c||!c.features)continue;
    const title=c.title||key;const id=makeId("est",title);
    putGame({id,title,source:"estimate",at:c.at||Date.now(),
      meta:{ident:c.ident||"",theme:c.theme||"",frictions:c.frictions||[]},
      ratings:{features:cleanFeatures(c.features),sourced:false,refs:[],
        selfConfidence:selfConfidence(cleanFeatures(c.features)),at:c.at||Date.now()},
      tactics:c.tactics||[],stopRule:c.stopRule||""})}
  for(const fb of state.feedback){
    if(fb.id&&getGame(fb.id))continue;
    const g=findGameByTitle(fb.title);
    fb.id=g?g.id:makeId("est",fb.title);
    if(!Array.isArray(fb.reasons))fb.reasons=[];
    if(fb.reason&&!fb.note)fb.note=fb.reason}
  if(d.last&&d.last.name&&!readingId){const g=findGameByTitle(d.last.name);if(g)readingId=g.id}
  if(Array.isArray(d.seen))state.shown=d.seen.map(t=>makeId("est",t));
  if(d.prefs&&d.prefs.w)for(const k of MATCH_KEYS)
    if(num(d.prefs.w[k])!==null)state.weights[k]=Math.max(0,num(d.prefs.w[k]))}

async function loadState(){let got=false;
  try{db=await claude.use("db");
    if(!db){dbUnavailable=true;dbErr="not available in this view"}
    else{const s=await db.doc(DOC).get();if(s.exists)got=adopt(thaw(s.data()))}}
  catch(e){db=null;dbUnavailable=true;dbErr=(e&&(e.code||e.message))||"unknown error"}
  try{localStorage.setItem(LS+":probe","1");localStorage.removeItem(LS+":probe");lastSave.local=true}
  catch(e){lastSave.local=false}
  if(!got){try{const raw=localStorage.getItem(LS);if(raw)adopt(JSON.parse(raw))}catch(e){}}
  state.loaded=true;render()}

async function saveState(){const body=payload();let local=false,cloud=false;
  try{localStorage.setItem(LS,JSON.stringify(body));local=true}catch(e){}
  if(db){try{await db.doc(DOC).set(body);cloud=true;dbErr=""}catch(e){dbErr=(e&&(e.code||e.message))||"unknown error"}}
  lastSave={cloud,local};return local||cloud}

function noteError(where,e){
  state.lastError={where,at:Date.now(),code:(e&&e.code)||"",
    name:(e&&e.name)||"",message:String((e&&e.message)||e||"").slice(0,300),
    text:e&&e.text?String(e.text).slice(0,400):""};
  try{saveState()}catch(x){}
  return errCopy(e)}

function errCopy(e){const c=e&&e.code;
  if(!c)return`The page hit an error: ${String((e&&e.message)||e||"unknown").slice(0,120)}`;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled")
    return"This page can't reach Claude. Open it from your Claude account and allow it.";
  if(c==="rate_limited")return"Too many requests, or you've hit your usage limit. Give it a minute.";
  if(c==="session_expired")return"Session expired. Sign in again, then retry.";
  if(c==="invalid_json")return"The reply was cut short or came back malformed. Try again.";
  if(c==="prompt_too_large")return"Too much to send at once. Clear some saved games.";
  if(c==="empty_completion")return"Nothing came back. Try again.";
  if(c==="upstream_error")return"The connection dropped part-way. Try again.";
  if(c==="refused")return"Claude declined that one. Try a different title.";
  return`That didn't go through (${c}). Try again.`}

function saveLine(key,done){const s=saveStatus[key];
  if(s==="saving")return`<div class="status" style="margin-top:9px"><span class="dot"></span>Saving…</div>`;
  if(s==="failed")return`<div class="err" style="margin-top:9px">On screen only — the write to storage failed.</div>`;
  if(s==="ok"||done)return`<div class="saved">${lastSave.cloud?"Saved.":"Saved to this browser."}</div>`;
  return""}

// A reply cut off by the length limit still holds complete objects.
function salvageObjects(text,key){
  const out=[];const s=String(text||"");
  let i=s.indexOf('"'+key+'"');if(i<0)return out;
  i=s.indexOf("[",i);if(i<0)return out;
  let depth=0,start=-1,inStr=false,esc2=false;
  for(let j=i+1;j<s.length;j++){const ch=s[j];
    if(inStr){if(esc2)esc2=false;else if(ch==="\\")esc2=true;else if(ch==='"')inStr=false;continue}
    if(ch==='"'){inStr=true;continue}
    if(ch==="{"){if(depth===0)start=j;depth++;continue}
    if(ch==="}"){depth--;
      if(depth===0&&start>=0){try{out.push(JSON.parse(s.slice(start,j+1)))}catch(e){}start=-1}
      continue}
    if(ch==="]"&&depth===0)break}
  return out}

/* ============================================================================
   RATING GAMES

   The rating call is BLIND. It never sees the profile, the weights, or any
   preferred value — otherwise a rating would drift toward whatever scores well.
   Ratings are estimates unless a catalog supplied sources, and are labelled so.
   ========================================================================== */

const FEATURE_SPEC = FEATURES.map(f=>
  `  ${f.key} (0-10) — ${f.label}: ${f.hint}. 0 = ${f.lo}, 10 = ${f.hi}.`).join("\n");

const RATING_RULES = `RATE THE GAME ITSELF, NOT ITS QUALITY, REPUTATION OR REVIEW SCORE. These describe how
it plays, and none of them is good or bad on its own.

Genre is not enough. Two roguelikes, two shooters, two RPGs sit at opposite ends of most of
these. Rate from how the game actually plays minute to minute.

For EVERY feature give three things:
  value      — 0 to 10, or null if you do not know this game well enough
  evidence   — the concrete detail behind the number, under 20 words: the run length, the
               menu, the travel, the tutorial, the mission type
  confidence — 0 to 1, YOUR OWN certainty for this feature of this game

NEVER fill a gap with a guess dressed as a fact. Unknown means value null and confidence 0.
Coverage is reported separately and a score is withheld when there is too little.`;

const COMPACT = `KEEP THE REPLY SHORT OR IT WILL BE CUT OFF. Evidence is at most TEN words. No prose
outside the JSON. "f" is the nine features IN THE ORDER LISTED ABOVE, each as
[value, confidence, "evidence"]. Use [null,0,""] for one you cannot support.`;

async function rateTitles(titles,onProgress){
  if(!sample)throw{code:"not_granted",message:"no sampling in this view"};
  const prompt=`Rate how each of these games plays, feature by feature.

GAMES, in this order: ${titles.map((t,i)=>`${i+1}. "${t}"`).join("  ")}

${RATING_RULES}

THE NINE FEATURES:
${FEATURE_SPEC}

${COMPACT}

Rate every game on the list, in the order given, keeping its exact title.

Reply with only this JSON:
{"games":[{"t":"exact title as given","d":"developer, year, what you do in it","th":"setting",
"e":false,"o":false,"off":true,"fr":["friction"],
"f":[[0,0.8,"evidence"],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""]]}]}
e = endless (no ending). o = needs a PREMADE GROUP of people you know, not just matchmaking.
off = playable fully offline.`;
  let out=null,salvaged=false;
  try{out=await sample.json(prompt,{modelTier:"complex",signal:ctl&&ctl.signal,cache:false,
    onText:({text})=>{if(onProgress)onProgress((text.match(/"t":/g)||[]).length)}})}
  catch(e){
    if(e&&e.code==="cancelled")throw e;
    const part=e&&e.text?salvageObjects(e.text,"games"):[];
    if(!part.length)throw e;
    out={games:part};salvaged=true}
  const rows=(out&&Array.isArray(out.games)?out.games:[]).filter(g=>g&&(g.t||g.title));
  const used=new Set(),saved=[];
  rows.forEach((g,idx)=>{
    const given=String(g.t||g.title);
    let want=titles.find(t=>!used.has(t)&&norm(t)===norm(given));
    if(!want)want=titles.find((t,i)=>i===idx&&!used.has(t));
    if(!want)want=titles.find(t=>!used.has(t));
    if(!want)return;
    used.add(want);
    const features=cleanFeatures(g.f||g.features);
    saved.push(putGame({id:makeId("est",want),title:want,source:"estimate",at:Date.now(),
      meta:{ident:String(g.d||g.ident||""),theme:String(g.th||g.theme||""),
        endless:g.e===true,needsGroup:g.o===true,offline:g.off!==false,
        frictions:(Array.isArray(g.fr)?g.fr:[]).slice(0,4).map(String)},
      ratings:{features,sourced:false,refs:[],selfConfidence:selfConfidence(features),at:Date.now()}}))});
  return {saved,missed:titles.filter(t=>!used.has(t)),salvaged}}

// Candidate titles. This is NOT catalog search and never claims to be. It may use which
// games he liked by NAME and his stated themes; it is given no feature numbers at all.
async function proposeTitles(n){
  if(!sample)throw{code:"not_granted",message:"no sampling in this view"};
  const {liked,dropped}=buildProfile();
  const bits=[];
  if(liked.length)bits.push("Games he enjoyed: "+liked.map(x=>x.title).join("; "));
  if(dropped.length)bits.push("Games he dropped: "+dropped.map(x=>x.title).join("; "));
  if(state.themesLike)bits.push("Settings he likes: "+state.themesLike);
  if(state.themesAvoid)bits.push("Settings to avoid: "+state.themesAvoid);
  if(platform)bits.push("He plays on: "+platform+". Only suggest things playable there.");
  if(form==="finite")bits.push("Only games with an actual ending.");
  if(form==="endless")bits.push("Only games with no ending.");
  if(company==="alone")bits.push("He plays without a group of friends. Solo games are fine, and so are multiplayer games with matchmaking or a solo queue — but nothing that needs a premade group to work.");
  if(company==="friends")bits.push("He is playing with friends, so co-op and team games are fine.");
  if(offlineOnly)bits.push("It must be playable fully offline.");
  // With "include ones I've rated" on, they must not be excluded here either, or the
  // client-side filter never gets the chance to let them through.
  const skip=(includeRated?[]:state.feedback.map(f=>f.title))
    .concat(state.shown.map(id=>(getGame(id)||{}).title).filter(Boolean));
  const prompt=`Name ${n} varied games worth considering for this person.

${bits.join("\n")||"No preferences recorded yet — give a broad, varied spread."}

RULES
1. Spread them widely. Different genres, budgets, eras and shapes. The app scores and ranks
   them itself, and it can only rank what you name.
2. Do NOT rank them, score them, or pick a favourite. Ordering is discarded.
3. Include several he is unlikely to have thought of.
4. Real, released games only, with their exact common titles.
5. Do not name any of these: ${skip.slice(-80).join("; ")||"none"}.

Reply with only this JSON: {"titles":["",""]}`;
  const out=await sample.json(prompt,{modelTier:"complex",signal:ctl&&ctl.signal,cache:false});
  const list=(out&&Array.isArray(out.titles)?out.titles:[]).map(String).map(t=>t.trim()).filter(Boolean);
  const seen=new Set();return list.filter(t=>{const k=norm(t);
    if(!k||seen.has(k))return false;seen.add(k);return true})}

/* ============================================================================
   5. RESULT CARD
   ========================================================================== */

function provTags(g,m){
  const src=SOURCE[g.source]||SOURCE.estimate;
  const cov=m&&m.ok?Math.round(m.coverage*100):Math.round(knownCount(g.ratings.features)/MATCH_KEYS.length*100);
  const thin=cov<70;
  return`<div class="prov">
    <span class="${src.sourced?"":"est"}">${src.sourced?"sourced ratings":"unverified estimate"}</span>
    <span class="${thin?"thin":""}">${knownCount(g.ratings.features)}/${MATCH_KEYS.length} features rated · ${cov}% of weight</span>
    ${src.sourced?"":`<span>model's own certainty ${Math.round((g.ratings.selfConfidence||0)*100)}%</span>`}
  </div>`}

function gapWord(part,invert){
  const f=FEATURES.find(x=>x.key===part.key)||{lo:"low",hi:"high"};
  const more=invert?part.gap<0:part.gap>0;
  return more?f.hi.toLowerCase():f.lo.toLowerCase()}

function matchLine(part){
  return`${FLABEL[part.key]} — about the same (${part.candidate.toFixed(1)} vs ${part.reference.toFixed(1)})`}

function frictionLine(m){
  if(m.frictionTriggers&&m.frictionTriggers.length){const t=m.frictionTriggers[0];
    return`${FLABEL[t.feature]} is where you dropped something before — that penalty is applied`}
  if(m.mismatches&&m.mismatches.length){const b=m.mismatches[0];
    return`${FLABEL[b.key]} is well off your example: ${b.candidate.toFixed(1)} against ${b.reference.toFixed(1)}`}
  return""}

function resultCard(g,m,opts){
  opts=opts||{};
  if(!m.ok)return`<div class="card"><div class="chead">
    <div><div class="cname">${esc(g.title)}</div>
      ${g.meta&&g.meta.ident?`<div class="cmeta">${esc(g.meta.ident)}</div>`:""}</div>
    <div><div class="cscore" style="font-size:20px;color:var(--dim)">No score</div></div></div>
    <div class="closest">${esc(m.reason)}.</div>
    ${provTags(g,m)}${opts.extra||""}</div>`;
  const fr=frictionLine(m);
  return`<div class="card"><div class="chead">
    <div><div class="cname">${esc(g.title)}</div>
      ${g.meta&&g.meta.ident?`<div class="cmeta">${esc(g.meta.ident)}</div>`:""}</div>
    <div><div class="cscore">${m.score}</div>
      ${m.provisional?`<div class="cprov">Provisional</div>`:""}</div></div>
    <div class="closest">Closest to your enjoyment of <b>${esc(m.matchedGame)}</b>.</div>
    <ul class="bul">
      ${m.matchingFeatures.slice(0,2).map(p=>`<li>${esc(matchLine(p))}</li>`).join("")
        ||`<li>Nothing lines up closely — it matched on the overall shape.</li>`}
      ${fr?`<li class="fr">${esc(fr)}</li>`:""}
    </ul>
    ${provTags(g,m)}
    ${opts.extra||""}
    <details><summary>Working</summary>${workingBlock(g,m)}</details>
  </div>`}

function workingBlock(g,m){
  let h="";
  if(m.ok){
    h+=`<p class="subtle">Base similarity to ${esc(m.matchedGame)} was ${m.baseScore.toFixed(1)}; the friction
      penalty took off ${(m.baseScore-m.score).toFixed(1)}.</p>`;
    if(m.similarExamples.length>1)h+=`<p class="subtle">Other examples it resembles: ${
      m.similarExamples.slice(1).map(x=>esc(x.title)+" ("+Math.round(x.similarity*100)+")").join(", ")}.</p>`;
    if(m.frictionTriggers.length)h+=`<p class="subtle">Reason penalties: ${
      m.frictionTriggers.map(t=>esc(FLABEL[t.feature])+" "+Math.round(t.severity*100)+"%").join(", ")}.</p>`}
  h+=`<div class="tw"><table><thead><tr><th>Feature</th><th>This</th><th>Evidence</th></tr></thead><tbody>`;
  for(const f of FEATURES){const c=g.ratings.features[f.key]||{};const v=featureValue(g.ratings.features,f.key);
    h+=`<tr><td>${esc(f.label)}</td><td class="num">${v===null?"—":v.toFixed(1)}</td>
      <td style="color:var(--dim);font-size:12.5px">${v===null?"no evidence; left out of the score":esc(c.evidence)}</td></tr>`}
  h+=`</tbody></table></div>`;
  if(g.meta&&g.meta.frictions&&g.meta.frictions.length)
    h+=`<p class="subtle">Commonly reported friction: ${g.meta.frictions.map(esc).join(" · ")}</p>`;
  if(g.meta&&g.meta.theme)h+=`<p class="subtle">Setting: ${esc(g.meta.theme)} — kept out of the score.</p>`;
  if(Array.isArray(g.tactics)&&g.tactics.length)
    h+=`<p class="subtle">If you play it: ${g.tactics.map(esc).join(" · ")}</p>`;
  return h}

async function doFind(){
  if(!sample){findErr="This page can't reach Claude from here. Open it from your Claude account.";return render()}
  const pin=document.getElementById("plat");if(pin)platform=(pin.value||"").trim();
  findBusy=true;findErr="";findNotes=[];pickIds=[];findStep="Gathering candidates";render();
  ctl=new AbortController();
  try{
    let titles=[];
    if(catalogConnected()){
      // Routed through the configured provider once one exists.
      titles=await catalogSearch();
    } else {
      titles=await proposeTitles(16);
    }
    const drops={};const why=k=>{drops[k]=(drops[k]||0)+1};
    const ratedIds=new Set(state.feedback.map(f=>f.id));
    const shown=new Set(state.shown);
    const pool=[];
    for(const t of titles){
      const id=makeId("est",t);
      if(!includeRated&&ratedIds.has(id)){why("already rated by you");continue}
      if(shown.has(id)){why("shown before — reshuffle to see them again");continue}
      pool.push(t)}
    if(!pool.length){findErr="Every suggestion was one you've seen. Try Reshuffle.";
      findBusy=false;return render()}

    findStep=`Rating ${pool.length} candidates`;render();
    const need=pool.filter(t=>{const g=getGame(makeId("est",t));return !(g&&g.ratings)});
    let salvaged=false,missed=[];
    if(need.length){const r=await rateTitles(need,n=>{const el=document.getElementById("findprog");
      if(el)el.textContent=`${n} of ${need.length} rated`});
      salvaged=r.salvaged;missed=r.missed}

    const prof=buildProfile();
    const scored=[];
    for(const t of pool){
      const g=getGame(makeId("est",t));
      if(!g||!g.ratings){why("no rating came back");continue}
      const meta=g.meta||{};
      if(form==="finite"&&meta.endless===true){why("no ending");continue}
      if(form==="endless"&&meta.endless===false){why("has an ending");continue}
      if(company==="alone"&&meta.needsGroup===true){why("needs a premade group");continue}
      if(offlineOnly&&meta.offline===false){why("not playable offline");continue}
      const m=scoreGame({id:g.id,features:g.ratings.features},prof);
      if(!m.ok&&prof.liked.length){why("too little comparable data");continue}
      scored.push({g,m})}
    scored.sort((a,b)=>(b.m.ok?b.m.score:-1)-(a.m.ok?a.m.score:-1));
    const top=scored.slice(0,6);
    pickIds=top.map(x=>x.g.id);
    // Shown is a memory of what has been surfaced. It is NOT a dislike and is reversible.
    state.shown=state.shown.concat(pickIds.filter(id=>!state.shown.includes(id))).slice(-400);
    const dropped=Object.entries(drops).map(([k,v])=>`${v} ${k}`);
    findNotes=[];
    if(dropped.length)findNotes.push(`Set aside: ${dropped.join(", ")}.`);
    findNotes.push(`${titles.length} proposed, ${scored.length} scored here against your examples, top ${top.length} shown.`);
    if(salvaged)findNotes.push("The ratings reply was cut short; these are the ones that came through whole.");
    if(missed.length)findNotes.push(`No rating came back for: ${missed.join(", ")}.`);
    if(!top.length)findErr="Nothing came through with enough to score. Try again, or Reshuffle.";
    await saveState()}
  catch(e){if(e&&e.code==="cancelled"){findBusy=false;findStep="";return render()}
    findErr=noteError("find",e)}
  findBusy=false;findStep="";render()}

async function setFeedback(id,key,value){
  const g=getGame(id);if(!g)return;
  const i=state.feedback.findIndex(e=>e.id===id);
  const row=Object.assign({id,title:g.title,reasons:[],at:Date.now()},i>=0?state.feedback[i]:{});
  row[key]=value;row.played=true;row.at=Date.now();
  if(i>=0)state.feedback[i]=row;else state.feedback.push(row);
  saveStatus["fb:"+id]="saving";updateFeedbackUI(id);
  const ok=await saveState();saveStatus["fb:"+id]=ok?"ok":"failed";updateFeedbackUI(id);
  render()}

async function setUnplayed(id){
  const g=getGame(id);if(!g)return;
  const i=state.feedback.findIndex(e=>e.id===id);
  const prev=i>=0?state.feedback[i]:{};
  const row={id,title:g.title,played:false,engage:null,ret:null,enjoy:null,
    reasons:prev.reasons||[],note:prev.note||"",at:Date.now()};
  if(i>=0)state.feedback[i]=row;else state.feedback.push(row);
  saveStatus["fb:"+id]="saving";updateFeedbackUI(id);
  const ok=await saveState();saveStatus["fb:"+id]=ok?"ok":"failed";updateFeedbackUI(id);
  render()}

async function toggleReason(id,r){
  if(!REASON_RULES[r])return;
  const g=getGame(id);if(!g)return;
  const i=state.feedback.findIndex(e=>e.id===id);
  const row=Object.assign({id,title:g.title,reasons:[],at:Date.now()},i>=0?state.feedback[i]:{});
  const set=new Set(row.reasons||[]);
  if(set.has(r))set.delete(r);else set.add(r);
  row.reasons=[...set];row.at=Date.now();
  if(i>=0)state.feedback[i]=row;else state.feedback.push(row);
  saveStatus["fb:"+id]="saving";updateFeedbackUI(id);
  const ok=await saveState();saveStatus["fb:"+id]=ok?"ok":"failed";
  render()}

async function setNote(id,text){
  const g=getGame(id);if(!g)return;
  const i=state.feedback.findIndex(e=>e.id===id);
  const row=Object.assign({id,title:g.title,reasons:[],at:Date.now()},i>=0?state.feedback[i]:{});
  row.note=String(text||"").slice(0,300);
  if(i>=0)state.feedback[i]=row;else state.feedback.push(row);
  // Suggestions only; free text never becomes a penalty until one is tapped.
  suggested[id]=suggestReasons(row.note).filter(k=>!(row.reasons||[]).includes(k));
  await saveState();render()}

async function addGame(){
  if(!sample){return}
  const el=document.getElementById("addg");const name=(el.value||"").trim();
  if(!name)return;
  const have=findGameByTitle(name);
  if(have&&have.ratings){readingId=have.id;readTitle=have.title;tab="read";return render()}
  readTitle=name;tab="read";render();doRead()}

async function savePrefs(){saveStatus.prefs="saving";render();
  const ok=await saveState();saveStatus.prefs=ok?"ok":"failed";render()}

/* ---- plumbing ---- */

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===tab)));
  const m={read:["panel-read",readPanel],find:["panel-find",findPanel],me:["panel-me",mePanel]};
  for(const k of Object.keys(m)){const el=document.getElementById(m[k][0]);
    el.hidden=k!==tab;if(k===tab)el.innerHTML=m[k][1]()}}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act],.tab");if(!t)return;
  if(t.tagName==="A")ev.preventDefault();
  if(t.classList.contains("tab")){tab=t.dataset.tab;return render()}
  const act=t.dataset.act,v=t.dataset.v,id=t.dataset.id;
  if(act==="read")return void doRead();
  if(act==="find")return void doFind();
  if(act==="addgame")return void addGame();
  if(act==="stop"){if(ctl)ctl.abort();return}
  if(act==="form"){form=v;return render()}
  if(act==="company"){company=v;return render()}
  if(act==="offline"){offlineOnly=!offlineOnly;return render()}
  if(act==="incrated"){includeRated=!includeRated;return render()}
  if(act==="reshuffle"){state.shown=[];void saveState();
    if(tab==="find")return void doFind();return render()}
  if(act==="open"){const g=getGame(id);
    if(g){readingId=g.id;readTitle=g.title;tab="read"}return render()}
  if(act==="fb")return void setFeedback(id,t.dataset.k,Number(v));
  if(act==="fbunplayed")return void setUnplayed(id);
  if(act==="reason")return void toggleReason(id,t.dataset.r);
  if(act==="delfb"){state.feedback=state.feedback.filter(e=>e.id!==id);void saveState();return render()}
  if(act==="themes"){state.themesLike=(document.getElementById("thl").value||"").trim();
    state.themesAvoid=(document.getElementById("tha").value||"").trim();return void savePrefs()}
  if(act==="clearerr"){state.lastError=null;void saveState();return render()}
  if(act==="clearunused"){const keep=new Set(state.feedback.map(f=>f.id));
    for(const k of Object.keys(state.games))if(!keep.has(k))delete state.games[k];
    pickIds=pickIds.filter(x=>state.games[x]);void saveState();return render()}
});

// Readouts are patched in place; re-rendering would replace the slider mid-drag.
document.addEventListener("input",ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.pf)return;
  const field=el.dataset.pf,val=Number(el.value);
  if(field==="t"){if(!(val>0))return;state.tolerance=val;
    const ro=document.querySelector('[data-ro="tol"]');if(ro)ro.textContent="±"+val.toFixed(1);return}
  const k=el.dataset.k;state.weights[k]=Math.max(0,val);
  const ro=document.querySelector(`[data-ro="w:${k}"]`);if(ro)ro.textContent=val.toFixed(1);
  const tw=MATCH_KEYS.reduce((s,x)=>s+Math.max(0,state.weights[x]||0),0);
  document.querySelectorAll("[data-wpct]").forEach(n=>{
    n.textContent=(tw>0?(Math.max(0,state.weights[n.dataset.wpct]||0)/tw*100).toFixed(0):"0")+"% of the comparison"})});

document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.pf)return void savePrefs();
  if(el.id==="plat"){platform=(el.value||"").trim();return void saveState()}
  if(el.id==="fbnote")return void setNote(el.dataset.id,el.value)});

document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id==="q")doRead();
  if(ev.key==="Enter"&&ev.target.id==="addg")addGame();
  if(ev.key==="Enter"&&ev.target.id==="plat"){platform=(ev.target.value||"").trim();doFind()}});

window.__engine={MATCH_KEYS,FEATURES,REASON_RULES,REASON_LABELS,featureValue,featureSimilarity,
  reasonPenalty,scoreGame,suggestReasons,buildProfile,labelOf,cleanFeatures,salvageObjects,
  makeId,catalogStatus,state,render,putGame};

render();
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!sample){readErr="This page can't reach Claude from here. Open it from your Claude account.";
    findErr=readErr;render()}
  loadState()})();
</script>
