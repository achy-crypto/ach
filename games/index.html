<div class="wrap">
  <header class="top">
    <h1>Two Hours In</h1>
    <p>Not whether a game is good — whether it holds <em>you</em>. It rates nine things about how a game plays, compares them to a profile built from games that hooked you and games you dropped, and shows its working.</p>
  </header>
  <div class="hr"></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="read" aria-selected="true">Check one</button>
    <button class="tab" data-tab="find" aria-selected="false">Find one</button>
    <button class="tab" data-tab="me" aria-selected="false">Your profile</button>
  </div>
  <section id="panel-read"></section>
  <section id="panel-find" hidden></section>
  <section id="panel-me" hidden></section>
</div>

<script>
"use strict";

/* ============================================================================
   THE MODEL

   Every game is described by nine gameplay features rated 0-10. The user has, per
   feature, a preferred LEVEL p, an importance WEIGHT w and a TOLERANCE t.

     distance = sum( w[i] * (game[i] - p[i])^2 )
     scale    = 2 * sum( w[i] * t[i]^2 )
     match    = 100 * exp( -distance / scale )

   It is a distance to a preferred level, not a "more is better" sum, so a game
   does not score higher merely by being louder or faster. It is a heuristic match
   score — not a probability, and not any kind of clinical assessment.
   ========================================================================== */

const FEATURES = [
  { key:"pace",      label:"Pace",                 hint:"How fast things happen moment to moment",              lo:"Slow",       hi:"Relentless" },
  { key:"feedback",  label:"Feedback speed",       hint:"How fast an action produces a visible result",         lo:"Delayed",    hi:"Instant" },
  { key:"decisions", label:"Meaningful decisions", hint:"How often a choice that actually matters comes up",    lo:"Rare",       hi:"Constant" },
  { key:"variety",   label:"Variety",              hint:"How much the activity changes as you keep playing",    lo:"Repetitive", hi:"Always new" },
  { key:"clarity",   label:"Goal clarity",         hint:"How plainly it tells you what to do next",             lo:"Work it out",hi:"Always obvious" },
  { key:"overhead",  label:"Mental overhead",      hint:"Systems, inventory, map and build you must hold",      lo:"Almost none",hi:"Heavy" },
  { key:"challenge", label:"Challenge",            hint:"How demanding it is to keep up",                       lo:"Forgiving",  hi:"Punishing" },
  { key:"downtime",  label:"Downtime",             hint:"Travel, menus, cutscenes, waiting, loading",           lo:"Almost none",hi:"Constant" },
  { key:"onramp",    label:"Time to the good part",hint:"How long before it is genuinely engaging",             lo:"Minutes",    hi:"Many hours" },
];
const FKEYS = FEATURES.map(f=>f.key);
const NF = FEATURES.length;

const DEF_P = 5, DEF_W = 1, DEF_T = 3;          // neutral, uniform, generous
const MIN_KNOWN = 5;                            // below this, no authoritative score
const MIN_COVER = 0.5;                          // and at least half the weight must be known
const SCHEMA = 3;                               // bump to invalidate cached ratings

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const num=v=>{if(v===null||v===undefined||v==="")return null;
  const n=Number(v);return Number.isFinite(n)?n:null};
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").replace(/[^a-z0-9 ]/g,"").trim();
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* ---- preferences ---- */

function blankPrefs(){const p={},w={},t={};
  for(const k of FKEYS){p[k]=DEF_P;w[k]=DEF_W;t[k]=DEF_T}
  return{p,w,t,pinned:[]}}

// Weights are kept nonnegative and normalised to sum to 1 at the point of use, so the
// user can type raw importances without having to make them add up.
function normW(w){const out={};let s=0;
  for(const k of FKEYS){const v=Math.max(0,num(w&&w[k])??0);out[k]=v;s+=v}
  if(s<=0)return null;
  for(const k of FKEYS)out[k]=out[k]/s;
  return out}

function prefsValid(pr){
  if(!pr)return"no profile";
  if(!normW(pr.w))return"every importance is zero — at least one feature has to matter";
  for(const k of FKEYS){const t=num(pr.t[k]);if(t===null||t<=0)return"tolerances must be above zero";}
  return""}

/* ---- the match score ---- */

// features: {key:{value:0-10|null, confidence:0-1, evidence:""}}
function matchScore(features,pr){
  const bad=prefsValid(pr);
  if(bad)return{ok:false,reason:bad};
  const w=normW(pr.w);
  let distance=0,scale=0,knownW=0,conf=0;
  const parts=[],unknown=[];
  for(const f of FEATURES){
    const cell=features&&features[f.key];
    const v=cell?num(cell.value):null;
    if(v===null){unknown.push(f.key);continue}
    const g=clamp(v,0,10),p=clamp(num(pr.p[f.key])??DEF_P,0,10),t=num(pr.t[f.key]);
    const gap=g-p, cost=w[f.key]*gap*gap;
    distance+=cost; scale+=2*w[f.key]*t*t; knownW+=w[f.key];
    conf+=w[f.key]*clamp(num(cell.confidence)??0.5,0,1);
    parts.push({key:f.key,value:g,pref:p,tol:t,weight:w[f.key],gap,cost,
      evidence:String(cell.evidence||""),confidence:clamp(num(cell.confidence)??0.5,0,1)});
  }
  const cover={known:parts.length,total:NF,weight:knownW,
    confidence:knownW>0?conf/knownW:0,unknown};
  // A missing feature is unknown, never zero: it is left out of both sums, and how much
  // was left out is reported separately rather than folded into the score.
  if(parts.length<MIN_KNOWN||knownW<MIN_COVER||scale<=0)
    return{ok:false,reason:"insufficient data",cover,parts,distance:null};
  const score=100*Math.exp(-distance/scale);
  for(const part of parts)part.share=distance>0?part.cost/distance:0;
  return{ok:true,score,distance,scale,cover,parts}}

// The wording comes from whichever features actually moved the number.
function explain(m){
  if(!m.ok&&!m.parts)return{good:[],bad:[]};
  const parts=m.parts.slice();
  const good=parts.filter(x=>Math.abs(x.gap)<=x.tol)
    .map(x=>Object.assign({},x,{strength:x.weight*(1-Math.abs(x.gap)/x.tol)}))
    .sort((a,b)=>b.strength-a.strength).filter(x=>x.strength>0.02).slice(0,4);
  const bad=parts.filter(x=>Math.abs(x.gap)>x.tol)
    .sort((a,b)=>b.cost-a.cost).slice(0,4);
  return{good,bad}}

function gapWord(part){
  const f=FEATURES.find(x=>x.key===part.key)||{lo:"low",hi:"high"};
  return part.gap>0?`more than you want (${f.hi.toLowerCase()})`:`less than you want (${f.lo.toLowerCase()})`}

/* ---- fitting the profile to feedback ----
   Pairwise ranking: for every (game that hooked you, game you dropped) pair, push the
   liked game's match above the dropped one's. Regularised toward the starting profile so
   six games cannot invent a personality. Weights stay nonnegative and normalised.
   Tolerances are NOT fitted — with feedback this sparse they would only overfit. */

// Data is summed, not averaged, and the prior is worth a fixed number of comparisons —
// so six games barely move the profile and sixty move it a long way.
const FIT = {lr:0.06, epochs:2500, lamP:0.006, lamW:1.1, prior:6};

// Mean ranking loss per comparison, with no regularisation: the honest readout of how
// well the profile separates the games that hooked him from the ones he dropped.
function pairLoss(pairs,pr){
  let L=0,n=0;const w=normW(pr.w);if(!w)return Infinity;
  for(const pair of pairs){
    const keys=pair.keys;
    let scale=0;for(const k of keys)scale+=2*w[k]*pr.t[k]*pr.t[k];
    if(scale<=0)continue;
    let dL=0,dD=0;
    for(const k of keys){const a=pair.like[k]-pr.p[k],b=pair.drop[k]-pr.p[k];
      dL+=w[k]*a*a;dD+=w[k]*b*b}
    const m=(dD-dL)/scale;
    L+=Math.log(1+Math.exp(-m));n++;
  }
  return n?L/n:0}

function fitPreferences(pairs,start){
  const pinned=new Set((start.pinned||[]));
  const pr={p:Object.assign({},start.p),w:Object.assign({},start.w),
            t:Object.assign({},start.t),pinned:start.pinned||[]};
  if(!pairs.length)return pr;
  const p0=Object.assign({},pr.p), w0=Object.assign({},pr.w);
  for(let it=0;it<FIT.epochs;it++){
    const w=normW(pr.w);if(!w)break;
    const gp={},gw={};for(const k of FKEYS){gp[k]=0;gw[k]=0}
    for(const pair of pairs){
      const keys=pair.keys;
      let scale=0;for(const k of keys)scale+=2*w[k]*pr.t[k]*pr.t[k];
      if(scale<=0)continue;
      let N=0;const a={};
      for(const k of keys){const dl=pair.like[k]-pr.p[k],dd=pair.drop[k]-pr.p[k];
        a[k]=dd*dd-dl*dl;N+=w[k]*a[k]}
      const m=N/scale;
      const dL=-1/(1+Math.exp(m));            // d/dm of log(1+e^-m)
      for(const k of keys){
        gp[k]+=dL*(2*w[k]*(pair.like[k]-pair.drop[k])/scale);
        gw[k]+=dL*((a[k]-m*2*pr.t[k]*pr.t[k])/scale);
      }
    }
    const den=pairs.length+FIT.prior;
    for(const k of FKEYS){
      if(pinned.has(k))continue;
      pr.p[k]=clamp(pr.p[k]-FIT.lr*(gp[k]+FIT.prior*2*FIT.lamP*(pr.p[k]-p0[k]))/den,0,10);
      pr.w[k]=Math.max(0,pr.w[k]-FIT.lr*(gw[k]+FIT.prior*2*FIT.lamW*(pr.w[k]-w0[k]))/den);
    }
    let s=0;for(const k of FKEYS)s+=pr.w[k];
    if(s<=0){for(const k of FKEYS)pr.w[k]=DEF_W}
    else{const scaleTo=FKEYS.length*DEF_W/s;for(const k of FKEYS)if(!pinned.has(k))pr.w[k]*=scaleTo}
  }
  return pr}

/* ---- feedback -> labels ----
   Enjoyment is recorded but deliberately does NOT decide the label: a game can be loved
   and still dropped. The label comes from whether it caught you and whether you wanted to
   go back. A game you never played is not a dislike and produces no label at all. */

function labelOf(fb){
  if(!fb||fb.played===false)return"";
  const e=num(fb.engage),r=num(fb.ret);
  if(e===null||r===null)return"";
  const pull=(e+r)/2;
  if(pull>=7)return"liked";
  if(pull<=4)return"dropped";
  return"mixed"}

/* ---- the catalog cache ---- */

function cacheGet(title){const e=state.cache[norm(title)];
  return e&&e.v===SCHEMA?e:null}
function cachePut(title,rec){
  state.cache[norm(title)]=Object.assign({v:SCHEMA,at:Date.now(),title},rec);
  const keys=Object.keys(state.cache);
  if(keys.length>160){keys.sort((a,b)=>(state.cache[a].at||0)-(state.cache[b].at||0));
    for(const k of keys.slice(0,keys.length-160))delete state.cache[k]}}

// Accepts either {pace:{value,evidence,confidence}} or the compact [[v,c,"ev"],...] form
// used where output length is the binding constraint.
function cleanFeatures(raw){const out={};
  let get;
  if(Array.isArray(raw))get=i=>{const a=raw[i];return Array.isArray(a)?{value:a[0],confidence:a[1],evidence:a[2]}:(a||{})};
  else get=i=>(raw&&raw[FKEYS[i]])||{};
  for(let i=0;i<FEATURES.length;i++){const f=FEATURES[i],c=get(i);
    const v=num(c.value);
    const cell={value:v===null?null:clamp(v,0,10),
      confidence:clamp(num(c.confidence)??0,0,1),
      evidence:String(c.evidence||"").slice(0,220)};
    // A number with no evidence and no confidence behind it is a guess, not a rating.
    if(cell.confidence<=0.05||!cell.evidence){cell.value=null;cell.confidence=0}
    out[f.key]=cell;
  }
  return out}

   STATE
   ========================================================================== */

const state={prefs:blankPrefs(),fitted:null,feedback:[],cache:{},seen:[],
  onboarded:false,onboardSkipped:false,themesLike:"",themesAvoid:"",loaded:false};
let db=null,sample=null,tab="read",ctl=null;
let readTitle="",readBusy=false,readErr="",reading=null;
let form="either",company="alone",platform="",findBusy=false,findErr="",picks=[],findNotes=[],findSeen=0;
let obLike=[{t:"",r:""},{t:"",r:""},{t:"",r:""}],obDrop=[{t:"",r:""},{t:"",r:""},{t:"",r:""}];
let obBusy=false,obErr="",obSeen=0,showOnboard=false;
let dbUnavailable=false,dbErr="",lastSave={cloud:null,local:null};
const saveStatus={};
const DOC="games/profile", LS="games:v2";

function payload(){return{v:SCHEMA,prefs:state.prefs,feedback:state.feedback.slice(-400),
  cache:state.cache,seen:state.seen.slice(-300),onboarded:state.onboarded,
  onboardSkipped:state.onboardSkipped,themesLike:state.themesLike,themesAvoid:state.themesAvoid,
  platform,last:reading||null}}

function adopt(d){if(!d)return false;
  if(d.prefs&&d.prefs.p&&d.prefs.w&&d.prefs.t){
    const pr=blankPrefs();
    for(const k of FKEYS){
      if(num(d.prefs.p[k])!==null)pr.p[k]=clamp(num(d.prefs.p[k]),0,10);
      if(num(d.prefs.w[k])!==null)pr.w[k]=Math.max(0,num(d.prefs.w[k]));
      if(num(d.prefs.t[k])!==null&&num(d.prefs.t[k])>0)pr.t[k]=num(d.prefs.t[k]);
    }
    pr.pinned=Array.isArray(d.prefs.pinned)?d.prefs.pinned.filter(k=>FKEYS.includes(k)):[];
    state.prefs=pr}
  if(Array.isArray(d.feedback))state.feedback=d.feedback;
  if(d.cache&&typeof d.cache==="object")state.cache=d.cache;
  if(Array.isArray(d.seen))state.seen=d.seen;
  state.onboarded=!!d.onboarded;state.onboardSkipped=!!d.onboardSkipped;
  if(typeof d.themesLike==="string")state.themesLike=d.themesLike;
  if(typeof d.themesAvoid==="string")state.themesAvoid=d.themesAvoid;
  if(typeof d.platform==="string")platform=d.platform;
  if(d.last&&d.last.name){reading=d.last;readTitle=d.last.name}
  return true}

async function loadState(){let got=false;
  try{db=await claude.use("db");
    if(!db){dbUnavailable=true;dbErr="not available in this view"}
    else{const s=await db.doc(DOC).get();if(s.exists)got=adopt(s.data())}}
  catch(e){db=null;dbUnavailable=true;dbErr=(e&&(e.code||e.message))||"unknown error"}
  try{localStorage.setItem(LS+":probe","1");localStorage.removeItem(LS+":probe");lastSave.local=true}
  catch(e){lastSave.local=false}
  if(!got){try{const raw=localStorage.getItem(LS);if(raw)adopt(JSON.parse(raw))}catch(e){}}
  // Nothing else refits on load, so without this the page shows the pre-load blank profile.
  state.loaded=true;rebuildProfile();render()}

async function saveState(){const body=payload();let local=false,cloud=false;
  try{localStorage.setItem(LS,JSON.stringify(body));local=true}catch(e){}
  if(db){try{await db.doc(DOC).set(body);cloud=true;dbErr=""}catch(e){dbErr=(e&&(e.code||e.message))||"unknown error"}}
  lastSave={cloud,local};return local||cloud}

/* ---- training pairs out of stored feedback ---- */

function featuresFor(title){const c=cacheGet(title);return c?c.features:null}

function trainingPairs(){
  const liked=[],dropped=[];
  for(const fb of state.featureSourceRows||state.feedback){
    const lab=labelOf(fb);if(lab!=="liked"&&lab!=="dropped")continue;
    const f=featuresFor(fb.title);if(!f)continue;
    (lab==="liked"?liked:dropped).push({title:fb.title,f})}
  const pairs=[];
  for(const L of liked)for(const D of dropped){
    const keys=FKEYS.filter(k=>num(L.f[k]&&L.f[k].value)!==null&&num(D.f[k]&&D.f[k].value)!==null);
    if(keys.length<MIN_KNOWN)continue;
    const like={},drop={};
    for(const k of keys){like[k]=L.f[k].value;drop[k]=D.f[k].value}
    pairs.push({keys,like,drop,titles:[L.title,D.title]})}
  return{pairs,liked,dropped}}

function likedMeanPrefs(liked,base){
  const pr={p:Object.assign({},base.p),w:Object.assign({},base.w),
            t:Object.assign({},base.t),pinned:base.pinned||[]};
  const pinned=new Set(pr.pinned);
  for(const k of FKEYS){
    if(pinned.has(k))continue;
    let s=0,n=0;
    for(const L of liked){const c=L.f[k],v=c?num(c.value):null;
      if(v===null)continue;const cf=clamp(num(c.confidence)??0.5,0,1);s+=v*cf;n+=cf}
    if(n>0)pr.p[k]=clamp(s/n,0,10)}
  return pr}

// Recomputed whenever feedback or the cache changes.
function rebuildProfile(){
  const {pairs,liked,dropped}=trainingPairs();
  const manual=state.prefs;
  let start=liked.length?likedMeanPrefs(liked,manual):manual;
  const fitted=pairs.length?fitPreferences(pairs,start):start;
  state.fitted=fitted;
  state.fitInfo={pairs:pairs.length,liked:liked.length,dropped:dropped.length,
    start,loss:pairs.length?pairLoss(pairs,fitted):null,
    baseLoss:pairs.length?pairLoss(pairs,start):null};
  return fitted}

function activePrefs(){return state.fitted||state.prefs}
function provisional(){return !state.feedback.some(f=>f.src==="onboarding")
  ||!state.fitInfo||state.fitInfo.pairs<3}

/* ---- prompt fragments ---- */

const FEATURE_SPEC = FEATURES.map(f=>
  `  ${f.key} (0-10) — ${f.label}: ${f.hint}. 0 = ${f.lo}, 10 = ${f.hi}.`).join("\n");

const RATING_RULES = `RATE THE GAME ITSELF, NOT ITS QUALITY, REPUTATION OR REVIEW SCORE. These are
descriptions of how it plays, and none of them is good or bad on its own — a person can want
low pace and heavy overhead, or the reverse.

Genre is not enough. Two roguelikes, two shooters, two RPGs can sit at opposite ends of most
of these. Rate from how the game actually plays minute to minute: what you do, how often, how
long the gaps are, what the screen gives back.

For EVERY feature return three things:
  value      — 0 to 10, or null if you genuinely do not know this game well enough
  evidence   — the concrete detail that justifies the number, in under 20 words. Name real
               things: the run length, the menu, the travel, the tutorial, the mission type.
  confidence — 0 to 1, how sure you are for THIS feature of THIS game

NEVER fill a gap with a guess dressed as a fact. If you do not know the game, or only know it
by reputation, set value to null and confidence to 0 for the features you cannot support. A
null is more useful here than a plausible invention, because the app reports coverage
separately and will refuse to show a score it cannot stand behind.`;

function profileBlock(){
  const pr=activePrefs(),w=normW(pr.w)||{};
  const rows=FEATURES.map(f=>`  ${f.key}: wants about ${Number(pr.p[f.key]).toFixed(1)}/10, `+
    `importance ${(w[f.key]*100||0).toFixed(0)}%, tolerance +/-${Number(pr.t[f.key]).toFixed(1)}`).join("\n");
  return`HIS PROFILE (the app scores the match itself — this is context for CHOOSING candidates,\nnot for you to score with):\n${rows}`}

function tasteBlock(){
  const rows=[];
  const {liked,dropped}=trainingPairs();
  const reason=t=>{const fb=state.feedback.find(x=>norm(x.title)===norm(t));
    return fb&&fb.reason?` (${fb.reason})`:""};
  if(liked.length)rows.push("HOOKED HIM: "+liked.map(x=>x.title+reason(x.title)).join("; "));
  if(dropped.length)rows.push("HE DROPPED: "+dropped.map(x=>x.title+reason(x.title)).join("; "));
  const th=[];
  if(state.themesLike)th.push("Settings and themes he likes: "+state.themesLike);
  if(state.themesAvoid)th.push("Settings and themes to avoid: "+state.themesAvoid);
  if(th.length)rows.push(th.join("\n")+"\nTheme is a separate filter from the gameplay match. Use it to choose candidates; never let it change a feature rating.");
  return rows.join("\n")}

function platformBlock(){const p=(platform||"").trim();
  return p?`HE PLAYS ON: ${p}. Only suggest things playable there.`:""}

// A reply cut off by the length limit still holds complete objects. Rather than throwing
// the whole call away, walk the array and keep every candidate that closed.
function salvageObjects(text,key){
  const out=[];const s=String(text||"");
  let i=s.indexOf('"'+key+'"');if(i<0)return out;
  i=s.indexOf("[",i);if(i<0)return out;
  let depth=0,start=-1,inStr=false,esc=false;
  for(let j=i+1;j<s.length;j++){const ch=s[j];
    if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue}
    if(ch==='"'){inStr=true;continue}
    if(ch==="{"){if(depth===0)start=j;depth++;continue}
    if(ch==="}"){depth--;
      if(depth===0&&start>=0){try{out.push(JSON.parse(s.slice(start,j+1)))}catch(e){}start=-1}
      continue}
    if(ch==="]"&&depth===0)break}
  return out}

function errCopy(e){const c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled")
    return"This page can't reach Claude. Open it from your Claude account and allow it.";
  if(c==="rate_limited")return"Too many requests, or you've hit your usage limit. Give it a minute.";
  if(c==="session_expired")return"Session expired. Sign in again, then retry.";
  if(c==="invalid_json")return"The reply was cut short or came back malformed. Try again.";
  if(c==="prompt_too_large")return"Too much to send at once — clear some cached ratings under Your profile.";
  if(c==="empty_completion")return"Nothing came back. Try again.";
  if(c==="upstream_error")return"The connection dropped part-way. Try again.";
  if(c==="refused")return"Claude declined that one. Try a different title.";
  return`That didn't go through${c?" ("+c+")":""}. Try again.`}

function saveLine(key,done){const s=saveStatus[key];
  if(s==="saving")return`<div class="status" style="margin-top:9px"><span class="dot"></span>Saving…</div>`;
  if(s==="failed")return`<div class="err" style="margin-top:9px">On screen only — the write to storage failed.</div>`;
  if(s==="ok"||done)return`<div class="saved">${lastSave.cloud?"Saved.":"Saved to this browser."}</div>`;
  return""}

/* ============================================================================
   RENDERING PIECES
   ========================================================================== */

function confBlock(cover){
  const pct=Math.round(cover.confidence*100);
  const lvl=cover.known<MIN_KNOWN?"Thin":cover.confidence>=.7?"Solid":cover.confidence>=.45?"Partial":"Thin";
  const bars=Math.round(cover.confidence*10);
  return`<div class="conf">
    <div class="ln"><span class="lab">Evidence, not agreement</span><span class="v">${lvl}</span></div>
    <div class="bar">${Array.from({length:10},(_,i)=>`<i class="${i<bars?"on":""}"></i>`).join("")}</div>
    <div class="ln" style="margin-top:7px"><span class="v">${cover.known} of ${cover.total} features rated</span>
      <span class="v">mean confidence ${pct}%</span></div>
    ${cover.unknown.length?`<div class="v" style="margin-top:5px">Unknown: ${cover.unknown.map(k=>(FEATURES.find(f=>f.key===k)||{}).label).join(", ")} — left out of the score, not counted as zero.</div>`:""}
  </div>`}

function reasonsBlock(m){
  const {good,bad}=explain(m);
  let h="";
  if(good.length){h+=`<h2 class="sec">Why it matches</h2><div class="reasons">`;
    for(const g of good){const f=FEATURES.find(x=>x.key===g.key);
      h+=`<div class="rz pos"><div class="rzh"><div class="rzt">${esc(f.label)} <em>sits where you want it</em></div>
        <div class="rzv">${g.value.toFixed(1)} vs ${g.pref.toFixed(1)}</div></div>
        ${g.evidence?`<div class="rze">${esc(g.evidence)}</div>`:""}</div>`}
    h+=`</div>`}
  if(bad.length){h+=`<h2 class="sec">Where it'll rub</h2><div class="reasons">`;
    for(const b of bad){const f=FEATURES.find(x=>x.key===b.key);
      h+=`<div class="rz neg"><div class="rzh"><div class="rzt">${esc(f.label)} <em>${esc(gapWord(b))}</em></div>
        <div class="rzv">${b.value.toFixed(1)} vs ${b.pref.toFixed(1)} · ${Math.round(b.share*100)}% of the miss</div></div>
        ${b.evidence?`<div class="rze">${esc(b.evidence)}</div>`:""}</div>`}
    h+=`</div>`}
  if(!good.length&&!bad.length)h+=`<p class="empty">Nothing stood out either way.</p>`;
  return h}

function featureTable(features,pr){
  let h=`<h2 class="sec">Every feature</h2>
    <p class="subtle">The dot is the game. The bar is the range you tolerate around your preferred level.</p>`;
  for(const f of FEATURES){
    const c=features&&features[f.key]||{};const v=num(c.value);
    const p=clamp(num(pr.p[f.key])??DEF_P,0,10),t=num(pr.t[f.key])||DEF_T;
    const l=clamp(p-t,0,10),r=clamp(p+t,0,10);
    h+=`<div class="feat"><div class="frow">
      <div class="flab">${esc(f.label)}<span class="fhint">${esc(f.hint)}</span></div>
      <div class="fval">${v===null?"unknown":v.toFixed(1)+" / you "+p.toFixed(1)}</div></div>
      <div class="scaleline"><div class="track"></div>
        <div class="band" style="left:${l*10}%;width:${(r-l)*10}%"></div>
        <div class="you" style="left:${p*10}%"></div>
        ${v===null?`<div class="unk">no evidence — left out of the score</div>`:`<div class="it" style="left:${v*10}%"></div>`}
      </div>
      ${c.evidence?`<div class="fev">${esc(c.evidence)}${v!==null?` <span class="lab">conf ${Math.round((c.confidence||0)*100)}%</span>`:""}</div>`:""}
    </div>`}
  return h}

const FB_SCALE=[["No",1],["Barely",4],["Some",7],["A lot",10]];

function readPanel(){
  let h=`<div class="row">
    <input type="text" id="q" placeholder="A game" value="${esc(readTitle)}" autocomplete="off">
    <button class="go" data-act="read" ${readBusy?"disabled":""}>${readBusy?"Checking":"Check it"}</button>
  </div>`;

  if(readErr)h+=`<div class="err">${esc(readErr)}</div>`;
  if(provisional())h+=`<div class="caution">
    <span class="lab" style="display:block;margin-bottom:3px">Provisional</span>
    ${state.onboarded?`Only ${state.fitInfo?state.fitInfo.pairs:0} comparisons so far, so the profile is barely fitted.`
      :`Your profile is the neutral default — it isn't you yet.`}
    Scores will move as you rate games.
    <div class="seg"><button class="ghost" data-act="tome">Set up your profile</button></div></div>`;

  const r=reading;

    h+=`<div class="sheet"><div class="verdict"><div class="vtop">

      ${m.ok?`<div><div class="vnum">${Math.round(m.score)}<small>/100</small></div>
        <div class="vband">${esc(bandWord(m.score))}</div></div>`
       :`<div><div class="nodata">Insufficient data</div></div>`}
      </div>`;
    if(!m.ok&&m.reason!=="insufficient data")

    h+=`</div>`;
    if(m.cover)h+=confBlock(m.cover);
    if(m.ok)h+=reasonsBlock(m);
    if(Array.isArray(r.frictions)&&r.frictions.length)
      h+=`<div class="callout"><span class="lab" style="display:block;margin-bottom:3px">Commonly reported friction</span>
        ${r.frictions.map(x=>esc(x)).join(" · ")}</div>`;
    if(r.theme)h+=`<div class="callout" style="border-left-color:var(--rule);background:none">
      <span class="lab" style="display:block;margin-bottom:3px">Setting and theme — kept out of the score</span>${esc(r.theme)}</div>`;

    h+=feedbackBlock(r.name);
    h+=`</div>`}
  if(dbUnavailable)h=`<div class="err" style="margin-top:0;margin-bottom:14px">Cloud storage isn't available here — this browser only.</div>`+h;
  return h}

function bandWord(s){

    const rec={title:name,ident:String(out.ident||""),theme:String(out.theme||""),
      frictions:(Array.isArray(out.frictions)?out.frictions:[]).slice(0,4).map(String),
      tactics:(Array.isArray(out.tactics)?out.tactics:[]).slice(0,5).map(String),
      stopRule:String(out.stopRule||""),features:cleanFeatures(out.features)};
    cachePut(name,rec);
    reading=Object.assign({name},rec);
    rebuildProfile();await saveState()}
  catch(e){if(!(e&&e.code==="cancelled"))readErr=errCopy(e)}
  readBusy=false;render()}

async function doFind(){
  const pin=document.getElementById("plat");if(pin)platform=(pin.value||"").trim();
  const bad=prefsValid(activePrefs());
  if(bad){findErr=bad+". Fix it under Your profile.";return render()}
  findBusy=true;findErr="";findNotes=[];picks=[];findSeen=0;render();ctl=new AbortController();
  const formLine=form==="finite"?"Only games with an actual ending he can reach."
    :form==="endless"?"Only games with no ending — roguelikes, sims, builders, competitive games."
    :"";
  const coLine=company==="alone"?"He is playing alone. Nothing that needs other people online to work."
    :company==="friends"?"He is playing with friends, so multiplayer is fine. Say how many people it really needs.":"";
  const prompt=`Propose 8 candidate games for this person, then rate each one's gameplay features.

${RATING_RULES}

THE NINE FEATURES:
${FEATURE_SPEC}

${profileBlock()}

${tasteBlock()}

${platformBlock()}
${formLine}
${coLine}

HOW TO CHOOSE CANDIDATES
1. Spread them out. Do not send eight games from one genre; the app is going to rank them
   and it can only rank what you send.
2. Include a few he is unlikely to have thought of, and a few obvious ones. Both are useful.
3. Do NOT try to rank them or pick a winner — the app computes the match itself and will
   discard your ordering. Your job is a varied, well-rated shortlist.
4. Rate honestly. A candidate you rate generously to help it win will be scored against his
   preferred levels and may be scored WORSE for it.
5. Skip these, he has already seen them: ${state.seen.slice(-90).join("; ")||"none"}.

KEEP THE REPLY SHORT OR IT WILL BE CUT OFF BEFORE THE LAST CANDIDATE. Evidence strings are
at most TEN words. No prose outside the JSON.

"f" is the nine features IN THE ORDER LISTED ABOVE, each as [value, confidence, "evidence"].
Use null for a value you cannot support: [null,0,""].

Reply with only this JSON:
{"candidates":[{"t":"title","y":2020,"d":"developer, year, what you do in it","th":"setting",
"e":false,"o":false,"fr":["friction"],
"f":[[0,0.8,"evidence"],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""]]}]}`;
  let out=null,salvaged=false;
  try{
    out=await sample.json(prompt,{modelTier:"complex",signal:ctl.signal,cache:false,
      onText:({text})=>{const n=(text.match(/"t":/g)||[]).length;
        if(n!==findSeen){findSeen=n;const el=document.getElementById("findprog");
          if(el)el.textContent=n?`${n} rated so far`:"Thinking"}}});
  }catch(e){
    if(e&&e.code==="cancelled"){findBusy=false;return render()}
    // A truncated reply still holds whole candidates. Use them rather than losing the call.
    const got=e&&e.text?salvageObjects(e.text,"candidates"):[];
    if(got.length){out={candidates:got};salvaged=true}
    else{findErr=errCopy(e);findBusy=false;return render()}}
  try{
    const raw=(out&&Array.isArray(out.candidates)?out.candidates:[])
      .map(c=>c&&({title:c.t||c.title,year:c.y||c.year,ident:c.d||c.ident,theme:c.th||c.theme,
        endless:c.e!==undefined?c.e:c.endless,needsOthers:c.o!==undefined?c.o:c.needsOthers,
        frictions:c.fr||c.frictions,features:c.f||c.features}))
      .filter(c=>c&&c.title);
    const pr=activePrefs();
    const drops={};const seenNow=new Set();const scored=[];
    for(const c of raw){
      const n=norm(c.title);
      const why=(k)=>{drops[k]=(drops[k]||0)+1};
      if(seenNow.has(n)){why("duplicates");continue}
      seenNow.add(n);
      if(state.feedback.some(f=>norm(f.title)===n)){why("already rated by you");continue}
      if(state.seen.some(t=>norm(t)===n)){why("suggested before");continue}
      if(form==="finite"&&c.endless===true){why("no ending");continue}
      if(form==="endless"&&c.endless===false){why("has an ending");continue}
      if(company==="alone"&&c.needsOthers===true){why("needs other people");continue}
      const rec={title:String(c.title),year:c.year,ident:String(c.ident||""),theme:String(c.theme||""),
        frictions:(Array.isArray(c.frictions)?c.frictions:[]).slice(0,4).map(String),
        tactics:[],stopRule:"",features:cleanFeatures(c.features)};
      const m=matchScore(rec.features,pr);
      if(!m.ok){why("too little evidence to score");continue}
      cachePut(rec.title,rec);
      scored.push(Object.assign({},rec,{_m:m}))}
    // The model's ordering is discarded: rank by the computed match.
    scored.sort((a,b)=>b._m.score-a._m.score);
    picks=scored.slice(0,6);
    findNotes=[];
    const dropped=Object.entries(drops).map(([k,v])=>`${v} ${k}`);
    if(dropped.length)findNotes.push(`Dropped before scoring: ${dropped.join(", ")}.`);
    findNotes.push(`${raw.length} proposed, ${scored.length} scored, top ${picks.length} shown — ranked here, not by Claude.`);
    if(salvaged)findNotes.push("The reply was cut short; these are the candidates that came through whole.");
    if(!picks.length)findErr="Nothing came back with enough evidence to score. Try again.";
    else{state.seen=state.seen.concat(picks.map(p=>p.title)).slice(-300);await saveState()}}
  catch(e){findErr=errCopy(e)}
  findBusy=false;render()}

async function doOnboard(){
  const likes=obLike.filter(r=>r.t.trim()),drops=obDrop.filter(r=>r.t.trim());
  if(likes.length<2||drops.length<2){obErr="Give at least two on each side — the fit works by separating them.";return render()}
  obBusy=true;obErr="";obSeen=0;render();ctl=new AbortController();
  const list=likes.map(r=>r.t.trim()).concat(drops.map(r=>r.t.trim()));
  const prompt=`Rate how each of these games plays, feature by feature.

GAMES, in this order: ${list.map((t,i)=>`${i+1}. "${t}"`).join("  ")}

${RATING_RULES}

THE NINE FEATURES:
${FEATURE_SPEC}

Rate every game on the list, in the order given, keeping its exact title.

KEEP THE REPLY SHORT OR IT WILL BE CUT OFF BEFORE THE LAST GAME. Evidence strings are at
most TEN words. No prose outside the JSON.

"f" is the nine features IN THE ORDER LISTED ABOVE, each as [value, confidence, "evidence"].
Use [null,0,""] for a feature you cannot support.

Reply with only this JSON:
{"games":[{"t":"exact title as given","d":"developer, year, what you do in it","th":"setting",
"f":[[0,0.8,"evidence"],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""],[0,0.8,""]]}]}`;
  let out=null,salvaged=false;
  try{
    out=await sample.json(prompt,{modelTier:"complex",signal:ctl.signal,cache:false,
      onText:({text})=>{const n=(text.match(/"t":/g)||[]).length;
        if(n!==obSeen){obSeen=n;const el=document.getElementById("obprog");
          if(el)el.textContent=n?`${n} of ${list.length} rated`:"Thinking"}}});
  }catch(e){
    if(e&&e.code==="cancelled"){obBusy=false;return render()}
    // A reply cut off by length still holds whole games — keep those rather than lose the lot.
    const part=e&&e.text?salvageObjects(e.text,"games"):[];
    if(part.length){out={games:part};salvaged=true}
    else{obErr=errCopy(e);obBusy=false;return render()}}
  try{
    const got=(out&&Array.isArray(out.games)?out.games:[])
      .map(g=>g&&({title:g.t||g.title,ident:g.d||g.ident,theme:g.th||g.theme,
        features:g.f||g.features}))
      .filter(g=>g&&g.title);
    if(!got.length)throw{code:"invalid_json"};
    // Cache under the title HE typed, not the model's spelling of it, or the lookup that
    // builds the training pairs will miss ("Crusader Kings 3" against "Crusader Kings III").
    const used=new Set();
    got.forEach((g,idx)=>{
      let want=list.find(t=>!used.has(t)&&norm(t)===norm(g.title));
      if(!want)want=list.find((t,i)=>i===idx&&!used.has(t));
      if(!want)want=list.find(t=>!used.has(t));
      if(!want)return;
      used.add(want);
      cachePut(want,{title:want,ident:String(g.ident||""),theme:String(g.theme||""),
        frictions:[],tactics:[],stopRule:"",features:cleanFeatures(g.features)})});
    const put=(rows,engage,ret)=>{for(const r of rows){const t=r.t.trim();
      const i=state.feedback.findIndex(x=>norm(x.title)===norm(t));
      const row={title:t,engage,ret,enjoy:null,played:true,reason:r.r.trim(),at:Date.now(),src:"onboarding"};
      if(i>=0)state.feedback[i]=Object.assign(state.feedback[i],row);else state.feedback.push(row)}};
    put(likes,10,10);put(drops,1,1);
    state.onboarded=true;state.onboardSkipped=false;showOnboard=false;
    rebuildProfile();
    saveStatus.prefs="saving";
    const ok=await saveState();saveStatus.prefs=ok?"ok":"failed";
    const {pairs}=trainingPairs();
    const missed=list.filter(t=>!used.has(t));
    if(!pairs.length){showOnboard=true;
      obErr="Those came back, but without enough confident ratings to compare them. Try more widely known titles.";}
    else if(missed.length)obErr=`Built from ${used.size} of ${list.length} — ${missed.join(", ")} didn't come back. Add ${missed.length===1?"it":"them"} again under Check one if you want ${missed.length===1?"it":"them"} counted.`;
    else if(salvaged)obErr=`The reply was cut short, but all ${used.size} games came through.`;
  }
  catch(e){obErr=errCopy(e)}
  obBusy=false;render()}

async function setFeedback(title,key,value){
  const i=state.feedback.findIndex(e=>norm(e.title)===norm(title));
  const row=Object.assign({title,at:Date.now()},i>=0?state.feedback[i]:{});
  row[key]=value;row.played=true;row.at=Date.now();
  if(i>=0)state.feedback[i]=row;else state.feedback.push(row);
  rebuildProfile();
  saveStatus["fb:"+title]="saving";updateFeedbackUI(title);
  const ok=await saveState();saveStatus["fb:"+title]=ok?"ok":"failed";updateFeedbackUI(title)}

async function setUnplayed(title){

  const row={title,played:false,engage:null,ret:null,enjoy:null,at:Date.now(),
    reason:i>=0?state.feedback[i].reason:""};
  if(i>=0)state.feedback[i]=row;else state.feedback.push(row);
  rebuildProfile();
  saveStatus["fb:"+title]="saving";updateFeedbackUI(title);
  const ok=await saveState();saveStatus["fb:"+title]=ok?"ok":"failed";updateFeedbackUI(title)}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===tab)));
  const m={read:["panel-read",readPanel],find:["panel-find",findPanel],me:["panel-me",mePanel]};
  for(const k of Object.keys(m)){const el=document.getElementById(m[k][0]);
    el.hidden=k!==tab;if(k===tab)el.innerHTML=m[k][1]()}}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act],.tab");if(!t)return;
  if(t.classList.contains("tab")){tab=t.dataset.tab;return render()}
  const act=t.dataset.act,v=t.dataset.v;
  if(act==="read")return void doRead();
  if(act==="find")return void doFind();
  if(act==="stopfind"||act==="stopob"){if(ctl)ctl.abort();return}
  if(act==="tome"){tab="me";showOnboard=true;return render()}
  if(act==="form"){form=v;return render()}
  if(act==="company"){company=v;return render()}
  if(act==="onboard")return void doOnboard();
  if(act==="skipob"){state.onboardSkipped=true;showOnboard=false;void saveState();return render()}
  if(act==="openob"){showOnboard=true;return render()}
  if(act==="open"){const rec=cacheGet(t.dataset.t);
    if(rec){reading=Object.assign({name:rec.title},rec);readTitle=rec.title;tab="read"}
    return render()}
  if(act==="fb")return void setFeedback(t.dataset.t,t.dataset.k,Number(v));
  if(act==="fbunplayed")return void setUnplayed(t.dataset.t);
  if(act==="delfb"){state.feedback=state.feedback.filter(e=>e.title!==t.dataset.t);
    rebuildProfile();void saveState();return render()}
  if(act==="unpin"){state.prefs.pinned=(state.prefs.pinned||[]).filter(k=>k!==t.dataset.k);
    rebuildProfile();void savePrefs();return}
  if(act==="themes"){state.themesLike=(document.getElementById("thl").value||"").trim();
    state.themesAvoid=(document.getElementById("tha").value||"").trim();
    return void savePrefs()}
  if(act==="clearcache"){state.cache={};rebuildProfile();void saveState();return render()}
});

// A hand-set preference is pinned: the fit is not allowed to move it back.
// Note this updates the readouts in place. Re-rendering the panel on every input event
// would replace the slider mid-drag, which loses the thumb and swallows the change event.
document.addEventListener("input",ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.pf)return;
  const k=el.dataset.k,field=el.dataset.pf,val=Number(el.value);
  if(field==="t"&&!(val>0))return;
  state.prefs[field][k]=val;
  if(!(state.prefs.pinned||[]).includes(k))state.prefs.pinned=(state.prefs.pinned||[]).concat([k]);
  if(state.fitted){state.fitted[field][k]=val;state.fitted.pinned=state.prefs.pinned.slice()}
  const ro=document.querySelector(`[data-ro="${field}:${k}"]`);
  if(ro)ro.textContent=val.toFixed(field==="w"?2:1);
  const w=normW(state.prefs.w);
  document.querySelectorAll("[data-wpct]").forEach(n=>{
    n.textContent=((w?w[n.dataset.wpct]:0)*100).toFixed(0)+"% of the score"})});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.pf){rebuildProfile();return void savePrefs()}
  if(el.id==="plat"){platform=(el.value||"").trim();return void saveState()}
  if(el.dataset&&el.dataset.ob){const list=el.dataset.ob==="like"?obLike:obDrop;
    list[Number(el.dataset.i)][el.dataset.f]=el.value}});

document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id==="q")doRead();
  if(ev.key==="Enter"&&ev.target.id==="plat"){platform=(ev.target.value||"").trim();doFind()}});

// Exposed so the model can be exercised directly rather than only through the page.
window.rebuildProfile=rebuildProfile;
window.__engine={FEATURES,matchScore,salvageObjects,fitPreferences,normW,prefsValid,explain,labelOf,
  blankPrefs,trainingPairs,pairLoss,cleanFeatures,state};

rebuildProfile();render();
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!sample){readErr="This page can't reach Claude from here. Open it from your Claude account.";findErr=readErr;render()}
  loadState()})();
</script>
