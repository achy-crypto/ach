<title>Assay</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --ground:#e4e5e1;--panel:#f4f4f1;--panel-2:#eaeae6;
  --ink:#14171b;--dim:#6c727b;--rule:#cbccc7;--hair:#dcddd8;
  --signal:#b0500c;--signal-w:#b0500c14;--go:#0e6a56;--go-w:#0e6a5614;
  --warn:#8a2f22;--warn-w:#8a2f2214;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#15181d;--panel:#1c2027;--panel-2:#232830;
  --ink:#e6e7e3;--dim:#868c95;--rule:#333844;--hair:#262b33;
  --signal:#f0a057;--signal-w:#f0a0571f;--go:#56c4a6;--go-w:#56c4a61f;
  --warn:#e08573;--warn-w:#e085731f}}
:root[data-theme="dark"]{
  --ground:#15181d;--panel:#1c2027;--panel-2:#232830;
  --ink:#e6e7e3;--dim:#868c95;--rule:#333844;--hair:#262b33;
  --signal:#f0a057;--signal-w:#f0a0571f;--go:#56c4a6;--go-w:#56c4a61f;
  --warn:#e08573;--warn-w:#e085731f}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;font-size:15.5px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:24px 18px 70px}
@media (max-width:420px){.wrap{padding:18px 15px 60px}}

h1,h2,h3{font-family:"Bricolage Grotesque",Arial,sans-serif;font-variation-settings:"wdth" 92;
  letter-spacing:-.02em;margin:0}
.top{border-bottom:2px solid var(--ink);padding-bottom:11px}
.top h1{font-size:clamp(28px,7vw,38px);font-weight:700;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;background:var(--signal);border-radius:50%;flex:none}
.top p{margin:6px 0 0;color:var(--dim);font-size:13.5px;max-width:56ch}
.lab{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim)}

.tabs{display:flex;border-bottom:1px solid var(--rule);margin:18px 0 20px;gap:2px}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:inherit;
  font-size:13.5px;font-weight:600;color:var(--dim);padding:11px 13px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}

.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--rule);color:var(--ink);
  font:inherit;font-size:max(1rem,16px);padding:12px 13px;border-radius:0}
input[type=text]:focus{outline:none;border-color:var(--signal)}
.btn{background:var(--panel);border:1px solid var(--rule);color:var(--ink);font:inherit;font-weight:500;
  padding:12px 17px;cursor:pointer;border-radius:0;min-height:46px}
.btn:hover{border-color:var(--ink)}
.btn.prime{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.seg button{background:none;border:1px solid var(--rule);color:var(--dim);font-family:"JetBrains Mono",monospace;
  font-size:11px;padding:10px 12px;cursor:pointer;border-radius:0;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

.status{margin-top:14px;color:var(--dim);font-size:13.5px;display:flex;align-items:center;gap:9px}
.status .p{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:pl 1.1s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.status .p{animation:none}}
.err{margin-top:14px;border-left:2px solid var(--warn);padding:8px 0 8px 12px;font-size:13.5px}
.sub{color:var(--dim);font-size:13.5px;line-height:1.5}
.note{border:1px solid var(--rule);border-left:3px solid var(--signal);background:var(--panel);
  padding:12px 14px;font-size:13.5px;line-height:1.5;margin:14px 0 0}
.note b{font-weight:600}

/* the headline */
.card{margin-top:22px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:16px 0 18px}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cname{font-size:20px;font-weight:600;line-height:1.24;overflow-wrap:anywhere}
.cwho{color:var(--dim);font-size:13px;margin-top:3px;max-width:44ch}
.cnum{font-family:"Bricolage Grotesque",Arial,sans-serif;font-variation-settings:"wdth" 88;
  font-size:66px;font-weight:700;line-height:.82;color:var(--signal);text-align:right;
  font-variant-numeric:tabular-nums}
.cband{text-align:right;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-top:7px;max-width:19ch;margin-left:auto;text-wrap:balance}
.flag{display:inline-block;border:1px solid var(--warn);color:var(--warn);font-family:"JetBrains Mono",monospace;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;margin-top:11px}

/* where it stands */
.stands{margin-top:15px;border:1px solid var(--rule);background:var(--panel);padding:13px 14px}
.track{display:flex;gap:3px;margin:10px 0 8px}
.track i{flex:1;height:7px;background:var(--rule)}
.track i.on{background:var(--signal)}
.ends{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

/* axes */
.ax{padding:13px 0;border-bottom:1px solid var(--hair)}
.axtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.axname{font-size:15px;font-weight:600}
.axhint{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:1px;line-height:1.35}
.axval{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);flex:none}
.bars{display:flex;gap:2px;margin:8px 0 7px}
.bars i{flex:1;height:6px;background:var(--rule)}
.bars i.on{background:var(--signal)}
.bars.cool i.on{background:var(--go)}
.axnote{color:var(--dim);font-size:13.5px;line-height:1.45}

.wbox{border:1px solid var(--rule);background:var(--panel);padding:13px 14px;margin-bottom:9px}
.wtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wname{font-size:15px;font-weight:600}
.wnum{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--signal)}
input[type=range]{width:100%;margin:9px 0 0;accent-color:var(--signal)}

.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);font-weight:400;border-bottom:1px solid var(--ink);
  padding:0 10px 6px 0;white-space:nowrap}
td{border-bottom:1px solid var(--hair);padding:9px 10px 9px 0;vertical-align:top}
td.n{font-family:"JetBrains Mono",monospace;white-space:nowrap}
.del{background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;font-size:17px;padding:3px 6px}
.del:hover{color:var(--warn)}
.empty{color:var(--dim);font-size:13.5px;font-style:italic;margin-top:12px}
h2.sec{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:19px;font-weight:700;margin:28px 0 0}

.foot{border-top:1px solid var(--rule);margin-top:32px;padding-top:12px;display:flex;gap:14px;flex-wrap:wrap}
.back{background:none;border:0;color:var(--dim);cursor:pointer;font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:8px 0}
.back:hover{color:var(--ink)}
.errbar{border:1px solid var(--warn);border-left:3px solid var(--warn);background:var(--panel-2);
  padding:11px 13px;margin-bottom:14px;font-size:13.5px;overflow-wrap:anywhere}
.errbar b{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--warn);display:block;margin-bottom:4px;font-weight:500}
</style>

<div class="wrap">
  <div class="errbar" id="err-bar" hidden></div>
  <header class="top">
    <h1><span class="dot"></span>Assay</h1>
    <p>What's actually in a channel &mdash; measured on separate axes, weighted the way you want them, so the number that comes out is yours.</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" data-tab="rate" aria-selected="true">Rate one</button>
    <button class="tab" data-tab="weights" aria-selected="false">Your weights</button>
    <button class="tab" data-tab="log" aria-selected="false">Log</button>
  </div>

  <section id="panel-rate"></section>
  <section id="panel-weights" hidden></section>
  <section id="panel-log" hidden></section>

  <div class="foot">
    <span class="lab" id="save-state">saved on this device</span>
    <button class="back" id="reset-all">Start over</button>
  </div>
</div>

<script>
"use strict";
/* ===================== Assay =====================
   The ask was one number where further from the mainstream means more
   legitimate. I wouldn't build that, because collapsing "unusual" and
   "true" into a single score means the number lies to you in both
   directions — it can't tell a channel that's independent and right from
   one that's independent and wrong, and those are the two you most need
   to tell apart.

   So it's a matrix instead, which is the word that was used anyway. Each
   axis is scored on its own terms. How far off the map something sits is
   one of them, and you can weight it as hard as you like — the default
   preset weights it hardest, which is what produces a 9 for the fringe
   end and a 2 for the polished science end. What it won't do is quietly
   rename that "true".
   ================================================= */

const $ = (id) => document.getElementById(id);

const errSeen = [];
function showError(msg) {
  if (!msg || errSeen.indexOf(msg) > -1) return;
  errSeen.push(msg);
  const bar = $("err-bar");
  if (!bar) return;
  bar.hidden = false;
  bar.innerHTML = "<b>something broke</b>That's on me, not you. If you can, say what it reads: " +
    errSeen.map((m) => "<code>" + m.replace(/[<&]/g, (c) => (c === "<" ? "&lt;" : "&amp;")) + "</code>").join(" &middot; ");
}
addEventListener("error", (e) => showError((e.message || "error") + (e.lineno ? " @" + e.lineno : "")));
addEventListener("unhandledrejection", (e) => showError("promise: " + String((e.reason && e.reason.message) || e.reason || "?")));
function guard(fn) { return function (ev) { try { fn(ev); } catch (err) { showError(String((err && err.message) || err)); } }; }

/* ---------- the matrix ---------- */

const AXES = [
  { key: "density",  name: "Density",
    hint: "How much you actually get per minute, against padding, recap and retention tricks." },
  { key: "indep",    name: "Independence",
    hint: "Who pays for it, what it therefore can't say, and how far it's shaped to please the algorithm." },
  { key: "primary",  name: "Goes to the source",
    hint: "Reads the paper, the document, the record itself — rather than summarising other people's videos." },
  { key: "specific", name: "Specific enough to be wrong",
    hint: "Names, numbers, dates, mechanisms you could go and check. The opposite of gesturing." },
  { key: "holds",    name: "Holds up when checked", cool: true,
    hint: "When the claims that can be checked get checked, how do they do." },
  { key: "fresh",    name: "Tells you something new",
    hint: "Something you couldn't have got off the first page of a search." },
  { key: "offmap",   name: "Off the map", derived: true,
    hint: "How far from the consensus account it sits. Derived from where it stands, below." },
];

const STANDS = [
  { id: "textbook",   label: "Textbook",       v: 0,   note: "Restates the settled account." },
  { id: "mainstream", label: "Mainstream",     v: 2.5, note: "Inside the consensus, popularising it." },
  { id: "heterodox",  label: "Heterodox",      v: 5,   note: "Argues with the consensus from inside its rules." },
  { id: "fringe",     label: "Fringe",         v: 7.5, note: "Outside it, and knows it." },
  { id: "rejects",    label: "Rejects it all", v: 10,  note: "Throws out the whole frame, not a claim within it." },
];

const PRESETS = {
  offmap: { name: "Off the map", d: "What you said you wanted. Weighted hardest toward independence, novelty and distance from the consensus.",
            w: { density: 1, indep: 3, primary: 0.5, specific: 0.5, holds: 0.5, fresh: 3, offmap: 4 } },
  straight: { name: "Straight", d: "Every axis counts the same.",
            w: { density: 1, indep: 1, primary: 1, specific: 1, holds: 1, fresh: 1, offmap: 1 } },
  checks: { name: "Does it check out", d: "The other end. Weighted toward sources, specifics and whether it survives being checked.",
            w: { density: 1, indep: 1, primary: 2, specific: 2, holds: 3, fresh: 1, offmap: 0 } },
};

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ax10 = (v) => clamp(Number(v) || 0, 0, 10);
const norm = (s) => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function band(v) {
  if (v >= 9) return "Exactly your kind of thing";
  if (v >= 7.5) return "Strong on what you weight";
  if (v >= 6) return "Worth your time";
  if (v >= 4.5) return "Middling, for you";
  if (v >= 3) return "Not really your thing";
  return "Nothing here for you";
}

/* The blend of seven axes piles up in the middle whatever you feed it,
   so it gets stretched to use the ends of the scale. Without this, the
   most and least of something both come out somewhere around six. */
function blend(scores, weights, stand) {
  const s = Object.assign({}, scores);
  const st = STANDS.find((x) => x.id === stand);
  s.offmap = st ? st.v : 5;
  let tot = 0, wsum = 0;
  for (const a of AXES) {
    const w = Number(weights[a.key]);
    if (!Number.isFinite(w) || w <= 0) continue;
    tot += ax10(s[a.key]) * w;
    wsum += w;
  }
  if (!wsum) return 5;
  return clamp(5 + (tot / wsum - 5) * 1.6, 0, 10);
}

/* ---------- state ---------- */

const LS = "assay:v1", DOC = "assay/state";
const state = { weights: Object.assign({}, PRESETS.offmap.w), preset: "offmap", log: [], last: null, loaded: false };
let db = null, sample = null, tab = "rate";
let query = "", busy = false, err = "", reading = null, dbNote = "";

function payload() { return { weights: state.weights, preset: state.preset, log: state.log.slice(-200), last: state.last }; }
function adopt(d) {
  if (!d) return false;
  if (d.weights && typeof d.weights === "object") Object.assign(state.weights, d.weights);
  if (typeof d.preset === "string") state.preset = d.preset;
  if (Array.isArray(d.log)) state.log = d.log;
  if (d.last && d.last.name) { state.last = d.last; reading = d.last; query = d.last.name; }
  return true;
}
async function load() {
  try {
    db = await (typeof claude !== "undefined" && claude.use ? claude.use("db") : Promise.resolve(null));
    if (db) { const s = await db.doc(DOC).get(); if (s.exists) adopt(s.data()); }
    else dbNote = "not available in this view";
  } catch (e) { db = null; dbNote = (e && (e.code || e.message)) || "unknown"; }
  try { const raw = localStorage.getItem(LS); if (raw && !state.last) adopt(JSON.parse(raw)); } catch (e) {}
  state.loaded = true;
  render();
}
async function save() {
  if (!state.loaded) return;
  let ok = false;
  try { localStorage.setItem(LS, JSON.stringify(payload())); ok = true; } catch (e) {}
  if (db) { try { await db.doc(DOC).set(payload()); ok = true; } catch (e) {} }
  const el = $("save-state");
  if (el) el.textContent = ok ? (db ? "saved" : "saved on this device") : "can't save here — nothing is being kept";
}

/* ---------- what Claude is asked ---------- */

const RUBRIC = `You are scoring a YouTube channel on seven independent axes. Score each one ON ITS
OWN TERMS. Do not let your view of whether the channel is right, respectable, or worth watching
bleed between axes — that separation is the entire point of this tool.

  density   0-10  Information per minute. High = dense, gets to it, assumes you are not stupid.
                  Low = padding, long recaps, restating the thumbnail, retention tricks, three
                  minutes of preamble. This is about delivery, not truth.

  indep     0-10  Freedom from what pays for it. LOW for heavy sponsor loads, selling its own
                  supplements/courses/merch as the business model, institutional or party line it
                  cannot cross, or content visibly shaped to the algorithm. HIGH for no obvious
                  commercial pressure and a willingness to say things that cost it audience or
                  money. Being anti-establishment does NOT make a channel independent: a fringe
                  channel selling its own products is captured, just by a different buyer. This
                  axis is about incentives and nothing else.

  primary   0-10  Does it go to the actual paper, document, court record, dataset, original
                  footage — or is it a summary of somebody else's summary. High for showing you
                  the source. Low for a pile of secondhand claims with no way back to an origin.

  specific  0-10  Is it specific enough that it could be shown wrong. Names, dates, numbers,
                  mechanisms, testable predictions. Low for vagueness, hedging into meaninglessness,
                  or claims built so that nothing could ever count against them.

  holds     0-10  When the checkable claims are checked, how do they do. Score this HONESTLY
                  regardless of the channel's position or your opinion of its subject. A mainstream
                  channel that oversimplifies to the point of error does not get a free pass; a
                  fringe channel whose specific factual claims turn out to be accurate does not get
                  marked down for being fringe. If almost nothing it says is checkable at all, score
                  low and say so in the note — unfalsifiable is not the same as correct.

  fresh     0-10  Does it tell you something you could not have got from the first page of a search.
                  High for genuine reporting, original analysis, uncommon expertise, primary work.
                  Low for recycled topics and content that exists because the topic performs.
                  Unusual is not the same as new: repeating a well-worn fringe talking point scores
                  LOW here, exactly as repeating a well-worn mainstream one does.

WHERE IT STANDS: one of textbook, mainstream, heterodox, fringe, rejects. This is a DESCRIPTION of
position relative to the consensus account of its subject, not a judgement. "rejects" means it
throws out the whole framework rather than disputing claims inside it.

FAMILIARITY 0-3: 3 = you know this channel's actual output well. 2 = you know it reasonably.
1 = you know of it by reputation only. 0 = you do not know it. BE HONEST AND BE HARSH HERE. Small
channels, recent channels, and anything you are reconstructing from the name alone are 0 or 1. A
wrong confident answer is far worse than an admitted guess.

WHO: creator, roughly what years, and what the channel actually does, in one line, so a wrong match
gets caught immediately.

NOTES: one sentence per axis, concrete and about this channel specifically. Name the sponsor
pattern, the actual format, the kind of claim. No general commentary about media or attention.`;

function correctionBlock() {
  const rows = state.log.filter((e) => Number.isFinite(Number(e.actual))).slice(-25);
  if (!rows.length) return "";
  return "HIS OWN SCORES — where he has corrected this tool, these outrank it. Treat them as " +
    "calibration for taste and for how he reads these axes:\n" +
    rows.map((e) => "  " + e.name + ": tool said " + Number(e.score).toFixed(1) + "; he says " + Number(e.actual).toFixed(1)).join("\n");
}

async function rate() {
  const name = ($("q") ? $("q").value : "").trim();
  query = name;
  if (!name) { err = "Type a channel name first."; return render(); }
  if (!sample) { err = "This page can't reach Claude from here. Open it from your Claude account."; return render(); }
  busy = true; err = ""; render();

  const prompt = "Assay the YouTube channel: \"" + name + "\"\n\n" + RUBRIC + "\n\n" + correctionBlock() +
    "\n\nReply with only this JSON:\n" +
    '{"who":"","stands":"textbook|mainstream|heterodox|fringe|rejects","familiarity":3,' +
    '"scores":{"density":0,"indep":0,"primary":0,"specific":0,"holds":0,"fresh":0},' +
    '"notes":{"density":"","indep":"","primary":"","specific":"","holds":"","fresh":""},' +
    '"watchfor":"one sentence: the thing most worth knowing before you trust this channel, whatever direction that cuts"}';

  try {
    const out = await sample.json(prompt, { modelTier: "complex", cache: false });
    reading = Object.assign({ name: name }, out);
    state.last = reading;
    save();
  } catch (e) {
    err = (e && e.code === "not_granted") || (e && e.code === "sampling_disabled")
      ? "This page can't reach Claude. Open it from your Claude account and allow it."
      : "That didn't go through. Try again.";
  }
  busy = false; render();
}

/* ---------- panels ---------- */

function ratePanel() {
  let h = '<div class="row">' +
    '<input type="text" id="q" placeholder="A channel name" value="' + esc(query) + '" autocomplete="off">' +
    '<button class="btn prime" data-act="rate"' + (busy ? " disabled" : "") + '>' + (busy ? "Reading" : "Assay it") + "</button></div>";
  if (busy) h += '<div class="status"><span class="p"></span>Taking it apart.</div>';
  if (err) h += '<div class="err">' + esc(err) + "</div>";

  if (!reading) {
    h += '<div class="note"><b>What this does.</b> Seven axes, scored separately, then blended with ' +
      "whatever weights you set. The default preset weights independence, novelty and distance from " +
      "the consensus hardest &mdash; so the fringe end scores high and the polished science end scores " +
      "low, which is what you asked for. The one thing it won't do is fold <i>holds up when checked</i> " +
      "into that. It stays its own line, so you can see a channel that's independent and right apart " +
      "from one that's independent and wrong. Weight it at zero if you want. It'll still be shown.</div>";
    return h;
  }

  const r = reading, sc = blend(r.scores || {}, state.weights, r.stands);
  const st = STANDS.find((x) => x.id === r.stands) || STANDS[1];
  const logged = state.log.find((e) => norm(e.name) === norm(r.name));

  h += '<div class="card"><div class="ctop">' +
    '<div><div class="cname">' + esc(r.name) + "</div>" +
    (r.who ? '<div class="cwho">' + esc(r.who) + "</div>" : "") + "</div>" +
    '<div><div class="cnum">' + sc.toFixed(1) + '</div><div class="cband">' + band(sc) + "</div></div></div>" +
    (Number(r.familiarity) <= 1
      ? '<span class="flag">' + (Number(r.familiarity) === 0 ? "Claude does not know this channel" : "reputation only — treat as a guess") + "</span>"
      : "") + "</div>";

  h += '<div class="stands"><span class="lab">Where it stands</span>' +
    '<div class="track">' + STANDS.map((x) => '<i class="' + (x.id === st.id ? "on" : "") + '"></i>').join("") + "</div>" +
    '<div class="ends"><span>Textbook</span><span>Rejects it all</span></div>' +
    '<p style="margin:9px 0 0;font-size:14.5px"><b>' + st.label + "</b> &mdash; " + st.note + "</p></div>";

  if (r.watchfor) h += '<div class="note"><b>Worth knowing first.</b> ' + esc(r.watchfor) + "</div>";

  for (const a of AXES) {
    if (a.derived) continue;
    const v = ax10((r.scores || {})[a.key]);
    const w = Number(state.weights[a.key]) || 0;
    h += '<div class="ax"><div class="axtop">' +
      '<div class="axname">' + a.name + '<span class="axhint">' + a.hint + "</span></div>" +
      '<div class="axval">' + v + "/10" + (w ? "" : " &middot; off") + "</div></div>" +
      '<div class="bars' + (a.cool ? " cool" : "") + '">' +
      Array.from({ length: 10 }, (_, i) => '<i class="' + (i < v ? "on" : "") + '"></i>').join("") + "</div>" +
      '<div class="axnote">' + esc(((r.notes || {})[a.key]) || "") + "</div></div>";
  }

  h += '<div style="margin-top:20px"><span class="lab">Your number</span>' +
    '<p class="sub" style="margin:5px 0 0">If this one is wrong, put yours in. It is kept, and it is fed back in as ' +
    "calibration next time.</p>" +
    '<div class="row" style="margin-top:9px">' +
    '<input type="text" id="mine" inputmode="decimal" placeholder="0 to 10" value="' +
    (logged && Number.isFinite(Number(logged.actual)) ? Number(logged.actual).toFixed(1) : "") + '">' +
    '<button class="btn" data-act="correct">Save it</button></div></div>';
  return h;
}

function weightsPanel() {
  let h = '<p class="sub">The seven axes, and how hard each one counts toward the number. Set one to zero and it ' +
    "stops counting &mdash; it is still measured and still shown.</p>" +
    '<div class="seg">' + Object.keys(PRESETS).map((k) =>
      '<button data-act="preset" data-v="' + k + '" aria-pressed="' + (state.preset === k) + '">' + PRESETS[k].name + "</button>").join("") + "</div>" +
    '<p class="sub" style="margin-top:10px">' + esc(PRESETS[state.preset] ? PRESETS[state.preset].d : "Your own mix.") + "</p>" +
    '<h2 class="sec">The axes</h2>';
  for (const a of AXES) {
    const w = Number(state.weights[a.key]) || 0;
    h += '<div class="wbox"><div class="wtop"><div class="wname">' + a.name + "</div>" +
      '<div class="wnum">' + (w ? "×" + w : "off") + "</div></div>" +
      '<div class="axhint">' + a.hint + "</div>" +
      '<input type="range" min="0" max="4" step="0.5" value="' + w + '" data-w="' + a.key + '"></div>';
  }
  h += '<div class="note">Distance from the consensus is an axis here like any other, and on the default preset ' +
    "it is the heaviest one. That is a statement about what you want to watch, which is a perfectly good thing " +
    "for a number to be about. It is not a statement about what is true, and the app will not pretend otherwise " +
    "&mdash; that is why <i>holds up when checked</i> is always drawn, whatever you set it to.</div>";
  return h;
}

function logPanel() {
  if (!state.log.length) return '<p class="empty">Nothing yet. Assay a channel, then put your own number on it.</p>';
  return '<p class="sub">Every channel you have put a number on. These are fed back in as calibration.</p>' +
    '<div class="tw"><table><thead><tr><th>Channel</th><th>Tool</th><th>You</th><th>Stands</th><th></th></tr></thead><tbody>' +
    state.log.slice().reverse().map((e) =>
      "<tr><td>" + esc(e.name) + "</td><td class=\"n\">" + Number(e.score).toFixed(1) + "</td>" +
      '<td class="n">' + (Number.isFinite(Number(e.actual)) ? Number(e.actual).toFixed(1) : "—") + "</td>" +
      "<td>" + esc((STANDS.find((x) => x.id === e.stands) || {}).label || "—") + "</td>" +
      '<td class="n"><button class="del" data-act="dellog" data-v="' + esc(e.name) + '" aria-label="Remove">&times;</button></td></tr>').join("") +
    "</tbody></table></div>";
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  const map = { rate: ["panel-rate", ratePanel], weights: ["panel-weights", weightsPanel], log: ["panel-log", logPanel] };
  for (const k of Object.keys(map)) {
    const el = $(map[k][0]);
    el.hidden = k !== tab;
    if (k === tab) el.innerHTML = map[k][1]();
  }
}

/* ---------- everything that can be clicked, from one place ---------- */

document.addEventListener("click", guard((ev) => {
  const t = ev.target.closest("[data-act],.tab");
  if (!t) return;
  if (t.classList.contains("tab")) { tab = t.dataset.tab; return render(); }
  const act = t.dataset.act, v = t.dataset.v;

  if (act === "rate") return void rate();
  if (act === "preset") {
    state.preset = v;
    state.weights = Object.assign({}, PRESETS[v].w);
    save(); return render();
  }
  if (act === "correct" && reading) {
    const raw = ($("mine") ? $("mine").value : "").trim();
    if (!raw || !Number.isFinite(Number(raw))) { err = "Give it a number from 0 to 10."; return render(); }
    err = "";
    const row = {
      name: reading.name, score: blend(reading.scores || {}, state.weights, reading.stands),
      actual: clamp(Number(raw), 0, 10), stands: reading.stands, at: Date.now(),
    };
    const i = state.log.findIndex((e) => norm(e.name) === norm(row.name));
    if (i >= 0) state.log[i] = row; else state.log.push(row);
    save(); return render();
  }
  if (act === "dellog") {
    state.log = state.log.filter((e) => norm(e.name) !== norm(v));
    save(); return render();
  }
}));

document.addEventListener("input", guard((ev) => {
  const k = ev.target.dataset && ev.target.dataset.w;
  if (!k) return;
  state.weights[k] = Number(ev.target.value);
  state.preset = "";
  const box = ev.target.closest(".wbox");
  if (box) box.querySelector(".wnum").textContent = state.weights[k] ? "×" + state.weights[k] : "off";
  document.querySelectorAll('[data-act="preset"]').forEach((b) => b.setAttribute("aria-pressed", "false"));
  save();
}));

document.addEventListener("keydown", guard((ev) => {
  if (ev.key === "Enter" && ev.target.id === "q") rate();
  if (ev.key === "Enter" && ev.target.id === "mine") {
    const b = document.querySelector('[data-act="correct"]');
    if (b) b.click();
  }
}));

$("reset-all").addEventListener("click", guard(() => {
  const b = $("reset-all");
  if (b.dataset.sure !== "1") {
    b.dataset.sure = "1"; b.textContent = "Sure? Clears everything";
    setTimeout(() => { b.dataset.sure = "0"; b.textContent = "Start over"; }, 5000);
    return;
  }
  try { localStorage.removeItem(LS); } catch (e) {}
  location.reload();
}));

render();
(async () => {
  try { sample = await (typeof claude !== "undefined" && claude.use ? claude.use("sample") : Promise.resolve(null)); }
  catch (e) { sample = null; }
  if (!sample) { err = "This page can't reach Claude from here. Open it from your Claude account."; render(); }
  load();
})();
</script>
