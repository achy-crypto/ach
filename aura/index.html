<title>Aura Marking Sheet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<style>
:root{
  --paper:#e7e6df;--sheet:#f4f3ee;--ink:#15171c;--dim:#6a6e77;
  --rule:#cbc9c0;--rule-soft:#dbd9d1;--pen:#a82b1e;--pen-soft:#a82b1e26;--ok:#3d6b4a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111317;--sheet:#191c21;--ink:#e7e5de;--dim:#8c9099;--rule:#2b2f36;--rule-soft:#22262c;--pen:#e0705d;--pen-soft:#e0705d24;--ok:#6fae82}}
:root[data-theme="dark"]{--paper:#111317;--sheet:#191c21;--ink:#e7e5de;--dim:#8c9099;--rule:#2b2f36;--rule-soft:#22262c;--pen:#e0705d;--pen-soft:#e0705d24;--ok:#6fae82}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:650px;margin:0 auto;padding:30px 20px 80px}
.prose{font-family:"Newsreader",Georgia,serif;font-size:15.5px;line-height:1.6}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:2px}.head h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}.head h1 .rev{font-size:10.5px;font-weight:400;letter-spacing:.14em;color:var(--dim);font-family:"IBM Plex Mono",monospace}.head p{margin:6px 0 0;color:var(--dim);font-size:13.5px;max-width:56ch}.headrule{height:0;border-bottom:1px solid var(--ink);margin-bottom:20px}
.tabs{display:flex;border-bottom:1px solid var(--rule);margin-bottom:22px}.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--dim);padding:9px 14px 8px;cursor:pointer;margin-bottom:-1px}.tab:hover{color:var(--ink)}.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
.row{display:flex;gap:8px;align-items:stretch}.row.wraprow{flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;background:var(--sheet);border:1px solid var(--rule);color:var(--ink);font-family:inherit;font-size:15px;padding:10px 12px;border-radius:2px}input[type=text]::placeholder{color:var(--dim)}input[type=text]:focus{outline:none;border-color:var(--ink)}
button.go{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:2px;cursor:pointer}button.go:hover{background:transparent;color:var(--ink)}button.go[disabled]{opacity:.45;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.seg button,.chip{appearance:none;background:none;border:1px solid var(--rule);color:var(--dim);font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:6px 10px;border-radius:2px;cursor:pointer}.seg button:hover,.chip:hover{color:var(--ink);border-color:var(--dim)}.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fieldlab{margin:18px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.status{margin-top:16px;font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:10px}.status .dot{width:6px;height:6px;border-radius:50%;background:var(--pen);animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}.err{margin-top:16px;border-left:2px solid var(--pen);padding:8px 0 8px 12px;font-size:13.5px}.saved{color:var(--ok);font-size:13px;margin-top:9px}
.sheet{margin-top:26px}.sheetflag{display:inline-block;border:1px solid var(--rule);color:var(--dim);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;margin-bottom:12px}.verdict{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:16px 0 18px}.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.vname{font-size:19px;font-weight:600}.vident{color:var(--dim);font-size:13px;margin-top:3px;max-width:44ch}.vnum{font-size:60px;font-weight:700;line-height:.86;letter-spacing:-.05em;color:var(--pen);font-variant-numeric:tabular-nums;text-align:right}.vband{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:7px}.dock{margin-top:14px;border-left:2px solid var(--pen);background:var(--pen-soft);padding:8px 12px;font-size:13px}.warnflag{margin-top:14px;border-left:2px solid var(--rule);padding:8px 12px;font-size:13px;color:var(--dim)}
.axis{padding:14px 0;border-bottom:1px solid var(--rule-soft)}.arow{display:flex;justify-content:space-between;align-items:baseline;gap:14px}.alab{font-size:14px;font-weight:600}.aval{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}.ticks{display:flex;gap:3px;margin:8px 0 7px}.ticks i{height:6px;flex:1;background:var(--rule);border-radius:1px}.ticks i.on{background:var(--pen)}.anote{color:var(--dim);font-size:14px}.ahint{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:1px}
.callout{margin-top:16px;display:grid;gap:10px}.callout div{border-left:2px solid var(--rule);padding:6px 0 6px 12px;font-size:14px}.callout div.peak{border-left-color:var(--ink)}.callout .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
.after{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
/* Tap targets. These were ~30px tall with 6px gaps; the stored log showed zero
   verdicts ever recorded while every other control saved fine, which is what a
   too-small target looks like on a phone. */
.chip{font-family:inherit;font-size:14px;color:var(--ink);background:var(--sheet);padding:12px 16px;min-height:46px;flex:1 1 auto;min-width:132px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip:active{background:var(--ink);color:var(--paper)}
.pick{border-top:1px solid var(--rule);padding:16px 0}.pick:first-of-type{border-top:1px solid var(--ink)}.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.pname{font-size:16px;font-weight:600}.pname span{color:var(--dim);font-weight:400}.pnum{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;color:var(--pen)}.pident{color:var(--dim);font-size:12.5px;margin-top:3px}.pwhy{margin-top:9px}.pmeta{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;border:1px solid var(--rule);color:var(--dim);padding:2px 7px}.tag.warn{border-color:var(--pen);color:var(--pen)}
.tablewrap{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:13.5px}th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:400;border-bottom:1px solid var(--ink);padding:0 10px 6px 0;white-space:nowrap}td{border-bottom:1px solid var(--rule-soft);padding:8px 10px 8px 0;vertical-align:top}td.num{font-family:"IBM Plex Mono",monospace;white-space:nowrap}.del{appearance:none;background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;font-size:16px;line-height:1;padding:0 2px}.del:hover{color:var(--pen)}.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.addrow input[type=text]{flex:2;min-width:150px}.addrow input.sc{flex:0 0 74px;min-width:74px;text-align:center}.justadded td{background:var(--pen-soft)}.empty{color:var(--dim);font-size:13.5px;margin-top:12px;font-style:italic}.readout{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}.readout div{background:var(--sheet);padding:11px 12px}.readout .n{font-family:"IBM Plex Mono",monospace;font-size:21px}.note{color:var(--dim);font-size:13px;margin-top:14px;max-width:58ch}h2.sec{font-size:15px;font-weight:600;margin:30px 0 0}.subtle{color:var(--dim);font-size:13px;margin:4px 0 0;max-width:60ch}[hidden]{display:none!important}
</style>

<div class="wrap">
  <header class="head">
    <h1>Aura<span class="rev">Anchor scale</span></h1>
    <p>Your scale is the ruler. The axes explain why a movie lands there; they do not overrule your anchors.</p>
  </header>
  <div class="headrule"></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="read" aria-selected="true">Read one</button>
    <button class="tab" data-tab="find" aria-selected="false">Find aura</button>
    <button class="tab" data-tab="cal" aria-selected="false">Calibration</button>
  </div>
  <section id="panel-read"></section>
  <section id="panel-find" hidden></section>
  <section id="panel-cal" hidden></section>
</div>

<script>
"use strict";

const AXES=[
  {key:"control",label:"Total control",hint:"Knows exactly what it is doing; every choice deliberate"},
  {key:"writing",label:"Sharp writing",hint:"Not functional, not just moving plot"},
  {key:"under",label:"More underneath",hint:"Surface undersells what is really there"},
  {key:"commit",label:"Commits fully",hint:"No hedging, no winking, never softens itself"},
  {key:"nochase",label:"Doesn't chase you",hint:"Not asking to be liked, cool, deep, or prestigious"},
  {key:"withhold",label:"Withholds",hint:"Doesn't explain itself; leaves things unsaid"}
];
const VERDICTS=[
  {key:"loved",label:"Loved it"},{key:"liked",label:"Liked it"},
  {key:"nothing",label:"Nothing there"},{key:"bounced",label:"Bounced off"}
];
const BASE_ANCHORS=[
  {title:"Arizona (2018)",score:9,note:"Key anchor. Looks corny and flat but carries huge aura anyway: sharp writing, total commitment, no prestige crutch."},
  {title:"Goodfellas",score:9,note:""},{title:"Taxi Driver",score:9,note:""},{title:"Severance",score:9,note:""},{title:"Drive",score:9,note:""},
  {title:"Casino",score:8.5,note:""},{title:"Sicario",score:8.5,note:""},{title:"Nightcrawler",score:8.5,note:""},{title:"Fargo (season 1)",score:8.5,note:""},
  {title:"Parasite",score:8,note:""},{title:"Zodiac",score:8,note:""},{title:"Whiplash",score:8,note:""},{title:"Obsession (2026)",score:8,note:""},
  {title:"Get Shorty",score:7.5,note:""},{title:"Eastbound & Down",score:7.5,note:""},{title:"A Prophet",score:7.5,note:""},{title:"The Wrestler",score:7.5,note:""},{title:"Mr Inbetween",score:7.5,note:""},
  {title:"The Truman Show",score:6,note:""},{title:"Ozark",score:5,note:""},{title:"The Shield",score:4,note:"Trying too hard is anti-aura."},
  {title:"Justified",score:3,note:"Functional dialogue, reveal spent early, nobody with weight, nothing underneath."}
];
const DOCTRINE=`AURA is conviction and control. The work knows exactly what it is doing and does it without hedging. Sharp writing. Something underneath the surface. It does not announce itself or ask to be admired.

Aura is NOT cinematography, lighting, color grading, a moody score, production value, popularity, obscurity, foreignness, age, subtitles, prestige, or whether the user personally enjoyed it. A cheap flat-looking movie in total command can have more aura than beautiful prestige television.

ANTI-AURA: functional dialogue that only moves plot; explaining the story out loud; reveal spent early; hedging; winking; visibly trying to seem cool or serious; everyone softened into likability; nothing withheld.

Coded fandom is evidence only when the WORK itself chases identity or admiration. Do not dock a work merely because a recognizable fanbase exists. Score the work, not the people who post about it.`;
const PLACEMENT_NOTE=`THE USER'S ANCHOR SCALE IS THE FINAL AUTHORITY.
For every title, choose exactly ONE calibration anchor that is closest in AURA — not plot, genre, country, decade, cinematography, popularity, or expected enjoyment. Copy that anchor title EXACTLY. Then give delta from -1.5 to +1.5 aura points. 0 means essentially equal aura; +0.5 clearly more; -0.5 clearly less. Usually stay within +/-0.75. The app computes final score = anchor score + delta. The six axes explain the placement but never overrule the anchor scale.`;
const SHAPE_NOTE=`FAMILIARITY 0-3: 3 thoroughly; 2 well enough; 1 mostly reputation; 0 unknown. Be honest. IDENT: director/creator, year, premise so a wrong title match is caught.`;
const FORM={film:{noun:"feature films",rule:"Every pick must be a feature film, not a series."},show:{noun:"television series",rule:"Every pick must be a television series or miniseries, not a feature film."}};
const LANES=[
  ["any","Any",""],
  ["cheap","Cheap but total","Lean toward work that looks cheap, flat, corny, or unfashionable but is in complete command — the Arizona test."],
  ["figure","A figure","Lean toward work built around one person with real weight."],
  ["strange","Strange","Lean toward structurally odd work with real layers underneath."],
  ["nasty","Nasty","Lean toward hard, unsentimental work with no interest in being liked."]
];

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const ax05=v=>clamp(Number(v)||0,0,5);
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
function band(v){if(v>=9)return"Untouchable";if(v>=8)return"Heavy aura";if(v>=7)return"Real presence";if(v>=5.5)return"Some, not much";if(v>=4)return"Thin";return"No aura"}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

const state={anchors:BASE_ANCHORS.map(x=>({...x})),log:[],seen:[],loaded:false};
let db=null,sample=null,tab="read",ctl=null;
let reading={name:"Justified",example:true,ident:"Graham Yost, 2010-2015. US Marshal returns to eastern Kentucky.",placement:{anchor:"Justified",delta:0},scores:{control:2,writing:1,under:1,commit:2,nochase:2,withhold:1},notes:{control:"Competent, not commanding.",writing:"Dialogue mostly moves plot and performs cool.",under:"Very little beneath what is stated.",commit:"Hard turns get softened.",nochase:"It often performs its own cool.",withhold:"It explains and spends information early."},familiarity:3,peak:"The pilot has the clearest weight.",kill:"Functional dialogue and performed cool."};
let readTitle="",readBusy=false,readErr="";
let kind="film",lane="any",floor=8,findBusy=false,findErr="",picks=[];
let justAdded=null,addErr="",dbUnavailable=false,dbErr="",lastSave={cloud:null,local:null};
const saveStatus={};
const DOC="aura/state";
const LS_KEY="aura:state:v2";

function payload(){return{anchors:state.anchors,log:state.log.slice(-300),seen:state.seen.slice(-300),last:reading&&!reading.example?reading:null,lastPicks:picks.slice(0,8)}}
function adopt(d){if(!d)return false;if(Array.isArray(d.anchors))state.anchors=d.anchors;if(Array.isArray(d.log))state.log=d.log;if(Array.isArray(d.seen))state.seen=d.seen;if(d.last&&d.last.name){reading=d.last;readTitle=d.last.name}if(Array.isArray(d.lastPicks))picks=d.lastPicks;return true}
async function loadState(){let got=false;try{db=await claude.use("db");if(!db){dbUnavailable=true;dbErr="not available in this view"}else{const snap=await db.doc(DOC).get();if(snap.exists)got=adopt(snap.data())}}catch(e){db=null;dbUnavailable=true;dbErr=(e&&(e.code||e.message))||"unknown error"}try{localStorage.setItem(LS_KEY+":probe","1");localStorage.removeItem(LS_KEY+":probe");lastSave.local=true}catch(e){lastSave.local=false}if(!got){try{const raw=localStorage.getItem(LS_KEY)||localStorage.getItem("aura:state:v1");if(raw)adopt(JSON.parse(raw))}catch(e){}}state.loaded=true;render()}
async function saveState(){const body=payload();let local=false,cloud=false;try{localStorage.setItem(LS_KEY,JSON.stringify(body));local=true}catch(e){}if(db){try{await db.doc(DOC).set(body);cloud=true;dbErr=""}catch(e){dbErr=(e&&(e.code||e.message))||"unknown error"}}lastSave={cloud,local};return local||cloud}

function anchorBlock(){return"HIS CALIBRATION ANCHORS (1-10; his numbers are ground truth):\n"+state.anchors.slice().sort((a,b)=>b.score-a.score).map(a=>`  ${a.title} = ${a.score}${a.note?" — "+a.note:""}`).join("\n")}
function correctionBlock(){const rows=state.log.filter(e=>Number.isFinite(Number(e.actual))).slice(-30);if(!rows.length)return"";return`USER AURA CORRECTIONS — these outrank every previous prediction:\n${rows.map(e=>`  ${e.title}: predicted ${Number(e.score).toFixed(1)}; user says ${Number(e.actual).toFixed(1)}`).join("\n")}\nTreat each correction exactly like a calibration anchor.`}
function reactionBlock(){const rows=state.log.filter(e=>e.verdict).slice(-24);if(!rows.length)return"";return`WATCH REACTIONS — preference data only. They may break ties when choosing what to recommend, but they MUST NEVER raise or lower an aura score:\n${rows.map(e=>`  ${e.title} — ${({loved:"loved",liked:"liked",nothing:"found nothing there",bounced:"bounced off"})[e.verdict]}`).join("\n")}`}
function fallbackComposite(scores){let sum=0;for(const a of AXES)sum+=ax05(scores&&scores[a.key]);return clamp(1+9*(sum/(AXES.length*5)),1,10)}
function placedScore(r){if(!r)return 1;const p=r.placement;if(p&&p.anchor){const a=state.anchors.find(x=>norm(x.title)===norm(p.anchor));const d=Number(p.delta);if(a&&Number.isFinite(d))return clamp(Number(a.score)+clamp(d,-1.5,1.5),1,10)}const direct=Number(r.scaleScore);if(Number.isFinite(direct))return clamp(direct,1,10);return fallbackComposite(r.scores)}
function errCopy(e){const c=e&&e.code;if(c==="rate_limited")return"Too many requests, or you've hit your usage limit. Try again later.";if(c==="session_expired")return"Your session expired. Sign in again, then retry.";if(c==="invalid_json")return"The reply came back malformed. Try again.";if(c==="refused")return"Claude declined that one. Try a different title.";return"That didn't go through. Try again."}

function saveLine(title,fallbackDone){const s=saveStatus[title];if(s==="saving")return`<div class="status" style="margin-top:9px"><span class="dot"></span>Saving…</div>`;if(s==="failed")return`<div class="err" style="margin-top:9px">Saved on screen only; storage write failed.</div>`;if(s==="ok"||fallbackDone)return`<div class="saved">${lastSave.cloud?"Saved.":"Saved to this browser."}</div>`;return""}

function readPanel(){const r=reading;let h=`<div class="row"><input type="text" id="q" placeholder="Film, show, anything" value="${esc(readTitle)}" autocomplete="off"><button class="go" data-act="read" ${readBusy?"disabled":""}>${readBusy?"Reading":"Read it"}</button></div>`;if(readBusy)h+=`<div class="status"><span class="dot"></span>Placing it on your anchor scale.</div>`;if(readErr)h+=`<div class="err">${esc(readErr)}</div>`;if(r){const score=placedScore(r);h+=`<div class="sheet">${r.example?`<span class="sheetflag">Example reading</span>`:""}<div class="verdict"><div class="vtop"><div><div class="vname">${esc(r.name)}</div>${r.ident?`<div class="vident">${esc(r.ident)}</div>`:""}</div><div><div class="vnum">${score.toFixed(1)}</div><div class="vband">${band(score)}</div></div></div>${r.placement&&r.placement.anchor?`<div class="dock"><b>Placed against ${esc(r.placement.anchor)}</b>${Number(r.placement.delta)?` (${Number(r.placement.delta)>0?"+":""}${Number(r.placement.delta).toFixed(1)})`:""}. ${esc(r.near||"")}</div>`:""}${Number(r.familiarity)<=1?`<div class="warnflag">Low familiarity — treat this read as a guess.</div>`:""}</div>`;for(const a of AXES){const v=ax05(r.scores&&r.scores[a.key]);h+=`<div class="axis"><div class="arow"><div class="alab">${a.label}<span class="ahint">${a.hint}</span></div><div class="aval">${v}/5</div></div><div class="ticks">${[0,1,2,3,4].map(i=>`<i class="${i<v?"on":""}"></i>`).join("")}</div><div class="anote prose">${esc((r.notes&&r.notes[a.key])||"")}</div></div>`}h+=`<div class="callout">${r.peak?`<div class="peak"><span class="k">Carrying it</span><span class="prose">${esc(r.peak)}</span></div>`:""}${r.kill?`<div><span class="k">Draining it</span><span class="prose">${esc(r.kill)}</span></div>`:""}</div>`;if(!r.example){const done=state.log.find(e=>e.title===r.name);h+=`<div class="after"><div class="eyebrow">Calibrate the number</div><p class="subtle">If the score is wrong, give your score. Your number becomes a real anchor and outranks the app next time.</p><div class="row" style="margin-top:9px"><input type="text" id="actual-aura" inputmode="decimal" placeholder="Your score, e.g. 7.5" value="${done&&Number.isFinite(Number(done.actual))?Number(done.actual).toFixed(1):""}"><button class="go" data-act="correct">Save score</button></div><div class="eyebrow" style="margin-top:18px">Did you enjoy it? <span style="text-transform:none;letter-spacing:0">separate from aura</span></div><div class="chips">${VERDICTS.map(v=>`<button class="chip" data-act="verdict" data-v="${v.key}" aria-pressed="${done&&done.verdict===v.key}">${v.label}</button>`).join("")}</div>${saveLine(r.name,!!done)}</div>`}h+=`</div>`}if(dbUnavailable)h=`<div class="warnflag" style="margin-bottom:14px">Cloud storage isn't available in this view; changes use browser storage here.</div>`+h;return h}

async function doRead(){const name=(document.getElementById("q").value||"").trim();readTitle=name;if(!name){readErr="Type a title first.";render();return}readBusy=true;readErr="";render();ctl=new AbortController();const rubric=AXES.map(a=>`  ${a.key} — ${a.label}: ${a.hint}`).join("\n");const prompt=`Score the aura of "${name}" on this user's personal scale.\n\n${DOCTRINE}\n\n${anchorBlock()}\n\n${correctionBlock()}\n\n${reactionBlock()}\n\n${PLACEMENT_NOTE}\n\nScore each axis 0-5 as supporting evidence:\n${rubric}\n\n${SHAPE_NOTE}\n\nJudge the work itself, not its reputation or how much you think the user would like it. Notes must be specific to the work. No hedging.\n\nReply with only this JSON:\n{"ident":"","placement":{"anchor":"EXACT title from calibration anchors","delta":0},"scaleScore":0,"near":"why this anchor is the closest aura comparison","scores":{"control":0,"writing":0,"under":0,"commit":0,"nochase":0,"withhold":0},"notes":{"control":"","writing":"","under":"","commit":"","nochase":"","withhold":""},"familiarity":3,"peak":"","kill":""}`;try{const out=await sample.json(prompt,{modelTier:"complex",signal:ctl.signal,cache:false});reading=Object.assign({name},out,{example:false})}catch(e){if(!(e&&e.code==="cancelled"))readErr=errCopy(e)}readBusy=false;render()}

function findPanel(){let h=`<div class="fieldlab"><span class="eyebrow">Form</span></div><div class="seg">${["film","show"].map(k=>`<button data-act="kind" data-v="${k}" aria-pressed="${kind===k}">${k==="film"?"Films":"Shows"}</button>`).join("")}</div><div class="fieldlab"><span class="eyebrow">Register</span></div><div class="seg">${LANES.map(l=>`<button data-act="lane" data-v="${l[0]}" aria-pressed="${lane===l[0]}">${l[1]}</button>`).join("")}</div><div class="fieldlab"><span class="eyebrow">Floor</span><span class="aval">${band(floor)}</span></div><div class="seg">${[7.5,8,8.5].map(f=>`<button data-act="floor" data-v="${f}" aria-pressed="${floor===f}">${f.toFixed(1)}+</button>`).join("")}</div><div class="seg" style="margin-top:16px"><button class="go" data-act="find" ${findBusy?"disabled":""}>${findBusy?"Looking":"Find aura"}</button></div>`;if(findBusy)h+=`<div class="status"><span class="dot"></span>Building a candidate pool, then placing the strongest on your scale.</div>`;if(findErr)h+=`<div class="err">${esc(findErr)}</div>`;if(picks.length){h+=`<div class="sheet">`;picks.forEach((p,i)=>{const s=placedScore(p),logged=state.log.find(e=>e.title===p.title);h+=`<div class="pick"><div class="ptop"><div><div class="pname">${esc(p.title)} ${p.year?`<span>${esc(String(p.year))}</span>`:""}</div>${p.ident?`<div class="pident">${esc(p.ident)}</div>`:""}</div><div class="pnum">${s.toFixed(1)}</div></div><div class="pwhy prose">${esc(p.why||"")}</div>${p.placement&&p.placement.anchor?`<div class="pident" style="margin-top:8px"><span class="eyebrow">Nearest yours</span> ${esc(p.placement.anchor)} ${Number(p.placement.delta)?`(${Number(p.placement.delta)>0?"+":""}${Number(p.placement.delta).toFixed(1)})`:""} — ${esc(p.near||"")}</div>`:""}<div class="pmeta">${AXES.map(a=>`<span class="tag">${a.key} ${ax05(p.scores&&p.scores[a.key])}</span>`).join("")}${Number(p.familiarity)<=1?`<span class="tag warn">low confidence</span>`:""}</div>${p.warn?`<div class="warnflag">Watch for: ${esc(p.warn)}</div>`:""}<div class="chips">${VERDICTS.map(v=>`<button class="chip" data-act="pverdict" data-i="${i}" data-v="${v.key}" aria-pressed="${logged&&logged.verdict===v.key}">${v.label}</button>`).join("")}</div>${saveLine(p.title,!!logged)}</div>`});h+=`</div>`}return h}

async function doFind(){findBusy=true;findErr="";picks=[];render();ctl=new AbortController();const laneTxt=(LANES.find(l=>l[0]===lane)||[])[2]||"";const rubric=AXES.map(a=>`  ${a.key} — ${a.label}: ${a.hint}`).join("\n");const prompt=`Recommend up to 6 ${FORM[kind].noun} with genuinely high aura on this user's personal scale.\n\n${FORM[kind].rule}\n\n${DOCTRINE}\n\n${anchorBlock()}\n\n${correctionBlock()}\n\n${reactionBlock()}\n\n${laneTxt}\n\n${PLACEMENT_NOTE}\n\nScore each candidate on the axes as evidence:\n${rubric}\n\n${SHAPE_NOTE}\n\nHOW TO CHOOSE\n1. Internally build a pool of at least 15 plausible candidates. Search for the doctrine itself — conviction, control, writing, underneath, commitment, non-chasing, withholding — not merely titles from the user's favorite genres.\n2. Place each serious candidate on the user's anchor scale, then keep the strongest. Do not choose first and inflate afterward.\n3. Watch reactions may break ties between similarly high-aura candidates but MUST NEVER alter either aura score.\n4. Diversity is a tie-breaker only. Do not sacrifice stronger aura to vary country, decade, language, obscurity, or genre.\n5. Famous, old, new, foreign, English-language, ugly-looking, and prestigious works all compete on the same scale. None gets a bonus or penalty for those traits.\n6. Skip titles already in the anchor list or already shown: ${state.seen.slice(-120).join("; ")||"none"}.\n7. Only return a title if its anchor-placed score is at least ${floor}. Returning fewer than six is fine.\n\nReply with only this JSON:\n{"picks":[{"title":"","year":0,"form":"${kind}","lang":"","ident":"","placement":{"anchor":"EXACT title from calibration anchors","delta":0},"scaleScore":0,"near":"why this anchor is the closest aura comparison","scores":{"control":0,"writing":0,"under":0,"commit":0,"nochase":0,"withhold":0},"familiarity":3,"why":"specific evidence from the work that earns its placement","warn":"anything that may drain aura, or empty string"}]}`;try{const out=await sample.json(prompt,{modelTier:"complex",signal:ctl.signal,cache:false});const raw=(out&&Array.isArray(out.picks)?out.picks:[]).filter(p=>p&&p.title);const form=raw.filter(p=>!p.form||String(p.form).toLowerCase().includes(kind));picks=form.filter(p=>placedScore(p)>=floor).sort((a,b)=>placedScore(b)-placedScore(a)).slice(0,6);const notes=[];if(raw.length-form.length)notes.push(`${raw.length-form.length} wrong-form pick${raw.length-form.length===1?" was":"s were"} dropped.`);if(form.length-picks.length)notes.push(`${form.length-picks.length} fell below your ${floor.toFixed(1)} floor.`);if(!picks.length)notes.push("Nothing survived the scale. Try a lower floor or another batch.");else{state.seen=state.seen.concat(picks.map(p=>p.title)).slice(-300);saveState()}findErr=notes.join(" ")}catch(e){if(!(e&&e.code==="cancelled"))findErr=errCopy(e)}findBusy=false;render()}

async function logVerdict(title,score,verdict){const i=state.log.findIndex(e=>e.title===title);const row=Object.assign({},i>=0?state.log[i]:{},{title,score:Number(score),verdict,at:Date.now()});if(i>=0)state.log[i]=row;else state.log.push(row);saveStatus[title]="saving";render();const ok=await saveState();saveStatus[title]=ok?"ok":"failed";render()}
async function logCorrection(title,predicted,actual){const n=Number(actual);if(!Number.isFinite(n))return false;const userScore=clamp(n,1,10);const i=state.log.findIndex(e=>e.title===title);const row=Object.assign({},i>=0?state.log[i]:{},{title,score:Number(predicted),actual:userScore,at:Date.now()});if(i>=0)state.log[i]=row;else state.log.push(row);const existing=state.anchors.find(a=>norm(a.title)===norm(title));if(existing)existing.score=userScore;else state.anchors.push({title,score:userScore,note:`User-corrected after app predicted ${Number(predicted).toFixed(1)}.`});saveStatus[title]="saving";render();const ok=await saveState();saveStatus[title]=ok?"ok":"failed";render();return ok}
async function mutateAnchors(fn){fn();saveStatus.anchors="saving";render();const ok=await saveState();saveStatus.anchors=ok?"ok":"failed";render()}

function calPanel(){const corrected=state.log.filter(e=>Number.isFinite(Number(e.actual)));const mae=corrected.length?corrected.reduce((s,e)=>s+Math.abs(Number(e.score)-Number(e.actual)),0)/corrected.length:null;let h=`<h2 class="sec">Scale accuracy</h2><p class="subtle">This measures predicted aura against the numbers you personally corrected — not whether you enjoyed the movie.</p><div class="readout"><div><div class="n">${corrected.length}</div><div class="eyebrow" style="margin-top:4px">Corrections</div></div><div><div class="n">${mae===null?"—":mae.toFixed(2)}</div><div class="eyebrow" style="margin-top:4px">Avg miss</div></div></div>`;h+=`<h2 class="sec">Correction log</h2>`;if(!state.log.length)h+=`<p class="empty">Nothing logged yet.</p>`;else h+=`<div class="tablewrap"><table><thead><tr><th>Title</th><th>Predicted</th><th>Your aura</th><th>Enjoyed?</th><th></th></tr></thead><tbody>${state.log.slice().reverse().map(e=>`<tr><td>${esc(e.title)}</td><td class="num">${Number(e.score).toFixed(1)}</td><td class="num">${Number.isFinite(Number(e.actual))?Number(e.actual).toFixed(1):"—"}</td><td>${(VERDICTS.find(v=>v.key===e.verdict)||{}).label||"—"}</td><td><button class="del" data-act="dellog" data-t="${esc(e.title)}">&times;</button></td></tr>`).join("")}</tbody></table></div>`;h+=`<h2 class="sec">Anchors</h2><p class="subtle">These numbers are the actual ruler used by every read and recommendation.</p><div class="tablewrap"><table><thead><tr><th>Title</th><th>Score</th><th>Note</th><th></th></tr></thead><tbody>${state.anchors.slice().sort((a,b)=>b.score-a.score).map(a=>`<tr${a.title===justAdded?` class="justadded"`:""}><td>${esc(a.title)}</td><td class="num"><input type="text" class="anchsc" data-t="${esc(a.title)}" value="${a.score}" style="width:58px;padding:4px 6px" inputmode="decimal"></td><td class="prose" style="font-size:13.5px;color:var(--dim)">${esc(a.note||"")}</td><td><button class="del" data-act="delanch" data-t="${esc(a.title)}">&times;</button></td></tr>`).join("")}</tbody></table></div><div class="addrow"><input type="text" id="na" placeholder="Title"><input type="text" id="ns" class="sc" placeholder="8.5" inputmode="decimal"><button class="go" data-act="addanch">Add</button></div>${addErr?`<div class="err">${esc(addErr)}</div>`:""}${saveStatus.anchors==="ok"?`<div class="saved">Anchors saved.</div>`:""}${storageLine()}`;return h}
function storageLine(){const cloud=db?(dbErr?`failing (${esc(dbErr)})`:"working"):`unavailable${dbErr?` (${esc(dbErr)})`:""}`;const local=lastSave.local===true?"working":lastSave.local===false?"blocked":"untested";return`<h2 class="sec">Storage</h2><p class="subtle">Cloud: <b>${cloud}</b><br>This browser: <b>${local}</b></p>`}

function render(){document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===tab)));const map={read:["panel-read",readPanel],find:["panel-find",findPanel],cal:["panel-cal",calPanel]};for(const k of Object.keys(map)){const el=document.getElementById(map[k][0]);el.hidden=k!==tab;if(k===tab)el.innerHTML=map[k][1]()}}

document.addEventListener("click",ev=>{const t=ev.target.closest("[data-act],.tab");if(!t)return;if(t.classList.contains("tab")){tab=t.dataset.tab;render();return}const act=t.dataset.act;if(act==="read")return void doRead();if(act==="find")return void doFind();if(act==="kind"){kind=t.dataset.v;return render()}if(act==="lane"){lane=t.dataset.v;return render()}if(act==="floor"){floor=Number(t.dataset.v);return render()}if(act==="correct"&&reading&&!reading.example){const el=document.getElementById("actual-aura"),raw=(el&&el.value||"").trim();if(!raw||!Number.isFinite(Number(raw))){readErr="Give your aura score from 1 to 10.";return render()}readErr="";return void logCorrection(reading.name,placedScore(reading),Number(raw))}if(act==="verdict"&&reading&&!reading.example)return void logVerdict(reading.name,placedScore(reading),t.dataset.v);if(act==="pverdict"){const p=picks[Number(t.dataset.i)];if(p)void logVerdict(p.title,placedScore(p),t.dataset.v);return}if(act==="dellog"){state.log=state.log.filter(e=>e.title!==t.dataset.t);saveState();return render()}if(act==="delanch")return void mutateAnchors(()=>{state.anchors=state.anchors.filter(a=>a.title!==t.dataset.t)});if(act==="addanch"){const ti=document.getElementById("na"),sc=document.getElementById("ns"),title=(ti.value||"").trim(),raw=(sc.value||"").trim();if(!title){addErr="Type a title first.";return render()}if(!raw||!Number.isFinite(Number(raw))){addErr="Give it a score out of 10.";return render()}addErr="";const score=clamp(Number(raw),1,10);justAdded=title;return void mutateAnchors(()=>{state.anchors=state.anchors.filter(a=>norm(a.title)!==norm(title));state.anchors.push({title,score,note:""})})}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="q")doRead();if(ev.key==="Enter"&&(ev.target.id==="na"||ev.target.id==="ns")){const b=document.querySelector('[data-act="addanch"]');if(b)b.click()}});
document.addEventListener("change",ev=>{if(!ev.target.classList.contains("anchsc"))return;const v=Number(ev.target.value),a=state.anchors.find(x=>x.title===ev.target.dataset.t);if(a&&Number.isFinite(v))void mutateAnchors(()=>{a.score=clamp(v,1,10)})});

render();
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}if(!sample){readErr="This page can't reach Claude from here. Open it from your Claude account.";findErr=readErr;render()}loadState()})();
</script>
