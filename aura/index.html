<title>Aura Marking Sheet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<style>
:root{
  --paper:#e7e6df;
  --sheet:#f4f3ee;
  --ink:#15171c;
  --dim:#6a6e77;
  --rule:#cbc9c0;
  --rule-soft:#dbd9d1;
  --pen:#a82b1e;
  --pen-soft:#a82b1e26;
  --ok:#3d6b4a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111317;
    --sheet:#191c21;
    --ink:#e7e5de;
    --dim:#8c9099;
    --rule:#2b2f36;
    --rule-soft:#22262c;
    --pen:#e0705d;
    --pen-soft:#e0705d24;
    --ok:#6fae82;
  }
}
:root[data-theme="dark"]{
  --paper:#111317;
  --sheet:#191c21;
  --ink:#e7e5de;
  --dim:#8c9099;
  --rule:#2b2f36;
  --rule-soft:#22262c;
  --pen:#e0705d;
  --pen-soft:#e0705d24;
  --ok:#6fae82;
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:30px 20px 80px}

.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.prose{font-family:"Newsreader",Georgia,serif;font-size:15.5px;line-height:1.6}

.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}

/* masthead */
.head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:2px}
.head h1{
  font-size:30px;font-weight:700;letter-spacing:-.025em;margin:0;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.head h1 .rev{font-size:10.5px;font-weight:400;letter-spacing:.14em;color:var(--dim);font-family:"IBM Plex Mono",monospace}
.head p{margin:6px 0 0;color:var(--dim);font-size:13.5px;max-width:52ch}
.headrule{height:0;border-bottom:1px solid var(--ink);margin-bottom:20px}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:22px}
.tab{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;
  color:var(--dim);padding:9px 14px 8px;cursor:pointer;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
.tab:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}

/* controls */
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{
  flex:1;min-width:0;background:var(--sheet);border:1px solid var(--rule);
  color:var(--ink);font-family:inherit;font-size:15px;padding:10px 12px;border-radius:2px;
}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{outline:none;border-color:var(--ink)}
button.go{
  appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-family:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:2px;cursor:pointer;
}
button.go:hover{background:transparent;color:var(--ink)}
button.go[disabled]{opacity:.45;cursor:default}
button.go:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{
  appearance:none;background:none;border:1px solid var(--rule);color:var(--dim);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.04em;
  padding:6px 10px;border-radius:2px;cursor:pointer;
}
.seg button:hover{color:var(--ink);border-color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.fieldlab{margin:18px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* status */
.status{margin-top:16px;font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:10px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--pen);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.status .dot{animation:none;opacity:.7}}
.err{margin-top:16px;border-left:2px solid var(--pen);padding:8px 0 8px 12px;font-size:13.5px}
.linkish{background:none;border:0;color:var(--pen);font:inherit;font-size:13.5px;text-decoration:underline;cursor:pointer;padding:0}

/* marking sheet */
.sheet{margin-top:26px}
.sheetflag{
  display:inline-block;border:1px solid var(--rule);color:var(--dim);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;padding:2px 7px;margin-bottom:12px;
}
.verdict{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:16px 0 18px}
.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.vname{font-size:19px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.vident{color:var(--dim);font-size:13px;margin-top:3px;max-width:42ch}
.vnum{
  font-size:60px;font-weight:700;line-height:.86;letter-spacing:-.05em;color:var(--pen);
  font-variant-numeric:tabular-nums;text-align:right;
}
.vband{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:7px}

.dock{
  margin-top:14px;border-left:2px solid var(--pen);background:var(--pen-soft);
  padding:8px 12px;font-size:13px;
}
.dock b{font-weight:600}
.warnflag{
  margin-top:14px;border-left:2px solid var(--rule);padding:8px 12px;font-size:13px;color:var(--dim);
}

/* axis rows */
.axis{padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.axis:last-of-type{border-bottom:1px solid var(--rule)}
.arow{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.alab{font-size:14px;font-weight:600}
.aval{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.ticks{display:flex;gap:3px;margin:8px 0 7px}
.ticks i{height:6px;flex:1;background:var(--rule);border-radius:1px}
.ticks i.on{background:var(--pen)}
.anote{color:var(--dim);font-size:14px}
.ahint{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:1px}

.callout{margin-top:16px;display:grid;gap:10px}
.callout div{border-left:2px solid var(--rule);padding:6px 0 6px 12px;font-size:14px}
.callout div.peak{border-left-color:var(--ink)}
.callout .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}

/* verdict capture */
.after{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  appearance:none;background:var(--sheet);border:1px solid var(--rule);color:var(--ink);
  font-family:inherit;font-size:13px;padding:6px 12px;border-radius:2px;cursor:pointer;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.saved{color:var(--ok);font-size:13px;margin-top:9px}

/* picks */
.pick{border-top:1px solid var(--rule);padding:16px 0}
.pick:first-of-type{border-top:1px solid var(--ink)}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.pname{font-size:16px;font-weight:600;letter-spacing:-.01em}
.pname span{color:var(--dim);font-weight:400}
.pnum{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;color:var(--pen);font-variant-numeric:tabular-nums}
.pident{color:var(--dim);font-size:12.5px;margin-top:3px}
.pwhy{margin-top:9px}
.pmeta{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  border:1px solid var(--rule);color:var(--dim);padding:2px 7px;
}
.tag.warn{border-color:var(--pen);color:var(--pen)}

/* calibrate */
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{
  text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);font-weight:400;
  border-bottom:1px solid var(--ink);padding:0 10px 6px 0;white-space:nowrap;
}
td{border-bottom:1px solid var(--rule-soft);padding:8px 10px 8px 0;vertical-align:top}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.del{appearance:none;background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;font-size:16px;line-height:1;padding:0 2px}
.del:hover{color:var(--pen)}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input[type=text]{flex:2;min-width:150px}
.addrow input.sc{flex:0 0 74px;min-width:74px;text-align:center}
.empty{color:var(--dim);font-size:13.5px;margin-top:12px;font-style:italic}
.readout{
  margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);
}
.readout div{background:var(--sheet);padding:11px 12px}
.readout .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.1}
.note{color:var(--dim);font-size:13px;margin-top:14px;max-width:58ch}
h2.sec{font-size:15px;font-weight:600;margin:30px 0 0;letter-spacing:-.01em}
h2.sec:first-child{margin-top:0}
.subtle{color:var(--dim);font-size:13px;margin:4px 0 0;max-width:58ch}
[hidden]{display:none !important}
</style>

<div class="wrap">
  <header class="head">
    <h1>Aura<span class="rev">Marking sheet</span></h1>
    <p>Conviction and control, not the look. Arizona is shot flat and carries more than most prestige television.</p>
  </header>
  <div class="headrule"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-read" aria-selected="true" data-tab="read">Read one</button>
    <button class="tab" role="tab" id="tab-find" aria-selected="false" data-tab="find">Find aura</button>
    <button class="tab" role="tab" id="tab-cal" aria-selected="false" data-tab="cal">Calibration</button>
  </div>

  <section id="panel-read" role="tabpanel" aria-labelledby="tab-read"></section>
  <section id="panel-find" role="tabpanel" aria-labelledby="tab-find" hidden></section>
  <section id="panel-cal" role="tabpanel" aria-labelledby="tab-cal" hidden></section>
</div>

<script>
"use strict";

/* ---------- rubric ---------- */

const AXES = [
  { key:"control",  label:"Total control",     hint:"Knows exactly what it is doing; every choice deliberate", w:3   },
  { key:"writing",  label:"Sharp writing",     hint:"Not functional, not there to move the plot along",        w:2.5 },
  { key:"under",    label:"More underneath",   hint:"Surface undersells it: looks like one thing, is another", w:2.5 },
  { key:"commit",   label:"Commits fully",     hint:"No hedging, no winking, never softens itself",            w:2   },
  { key:"nochase",  label:"Doesn't chase you", hint:"Not performing, not asking to be liked or seem deep",     w:2   },
  { key:"withhold", label:"Withholds",         hint:"Doesn't explain itself; leaves things unsaid",            w:1.5 },
];
const WSUM = AXES.reduce((a, x) => a + x.w, 0);

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ax05 = v => clamp(Number(v) || 0, 0, 5);

// Fitted so the axis profiles of his own anchors reproduce his own numbers:
// Arizona 9.3 · Parasite 8.0 · Truman 5.9 · Justified 2.8.
// A flat linear map (the original) put straight 4s at 8.2, above Parasite. This does not.
function composite(scores, fandom) {
  let s = 0;
  for (const a of AXES) s += ax05(scores && scores[a.key]) * a.w;
  const base = 1 + 9 * Math.pow(s / (5 * WSUM), 1.35);
  return clamp(base - clamp(Number(fandom) || 0, 0, 3) * 0.9, 1, 10);
}

function band(v) {
  if (v >= 9)   return "Untouchable";
  if (v >= 8)   return "Heavy aura";
  if (v >= 7)   return "Real presence";
  if (v >= 5.5) return "Some, not much";
  if (v >= 4)   return "Thin";
  return "No aura";
}

const VERDICTS = [
  { key:"loved",   label:"Loved it"      },
  { key:"liked",   label:"Liked it"      },
  { key:"nothing", label:"Nothing there" },
  { key:"bounced", label:"Bounced off"   },
];

/* ---------- base anchors (editable in Calibration) ---------- */

const BASE_ANCHORS = [
  { title:"Arizona (2018)",   score:9,   note:"Key anchor. Looks corny, shot flat, no visual ambition, packed with aura anyway: sharp writing, spoofs several registers and lands every one, never tips into goofy." },
  { title:"Goodfellas",       score:9,   note:"" },
  { title:"Taxi Driver",      score:9,   note:"" },
  { title:"Severance",        score:9,   note:"" },
  { title:"Drive",            score:9,   note:"" },
  { title:"Casino",           score:8.5, note:"" },
  { title:"Sicario",          score:8.5, note:"" },
  { title:"Nightcrawler",     score:8.5, note:"" },
  { title:"Fargo (season 1)", score:8.5, note:"" },
  { title:"Parasite",         score:8,   note:"" },
  { title:"Zodiac",           score:8,   note:"" },
  { title:"Whiplash",         score:8,   note:"" },
  { title:"Obsession (2026)", score:8,   note:"" },
  { title:"Get Shorty",       score:7.5, note:"" },
  { title:"Eastbound & Down", score:7.5, note:"" },
  { title:"A Prophet",        score:7.5, note:"" },
  { title:"The Wrestler",     score:7.5, note:"" },
  { title:"Mr Inbetween",     score:7.5, note:"" },
  { title:"The Truman Show",  score:6,   note:"" },
  { title:"Ozark",            score:5,   note:"" },
  { title:"The Shield",       score:4,   note:"Trying too hard is anti-aura, not aura." },
  { title:"Justified",        score:3,   note:"Daytime television: functional dialogue that only moves the plot, the big reveal spent in the first five minutes, nobody with weight, nothing underneath." },
];

const DOCTRINE =
`AURA — what is being measured.
Aura is conviction and control. The work knows exactly what it is doing and does it
without hedging. Sharp writing. Something underneath the surface. It does not announce
itself or ask to be admired.

Aura is NOT cinematography, lighting, colour grading, a moody score, or prestige
production values. Style laid over thin writing scores LOW. A cheap, flat-looking thing
in total command scores HIGH. Do not reward the look — this is the most common way to
get this wrong.

ANTI-AURA: functional dialogue that only moves the plot; explaining the story out loud;
the reveal spent early; hedging; winking at the audience; visibly trying hard to seem
cool or serious; everyone likeable; nothing withheld.

CODED FANDOM is scored SEPARATELY (0-3) and drains the result, overriding how well made
the thing is. If liking it is a personality signal for a recognisable online type — if
people put it in their bio, if it is earnest, wholesome, twee, or asks to be found
meaningful — aura collapses no matter the craft. Aura requires that nobody is wearing it.
0 = nobody wears it. 1 = a mild scene. 2 = a fanbase you can picture instantly.
3 = liking it IS the personality.

WORKED AXIS PROFILES (these reproduce his own numbers on the shared scale):
  Arizona (2018) = 9   → control 5, writing 5, under 4, commit 5, nochase 5, withhold 4; fandom 0
  Parasite       = 8   → control 5, writing 4, under 5, commit 4, nochase 3, withhold 3; fandom 0
  The Truman Show= 6   → control 4, writing 3, under 4, commit 3, nochase 2, withhold 2; fandom 0
  Justified      = 3   → control 2, writing 1, under 1, commit 2, nochase 2, withhold 1; fandom 0
Match that severity. Most television sits at 1-2 on most axes. A 5 is rare and must be earned.`;

/* ---------- state ---------- */

const state = { anchors: BASE_ANCHORS.slice(), log: [], seen: [], loaded: false };
let db = null, sample = null;
let tab = "read";

const DOC = "aura/state";

async function loadState() {
  try {
    db = await claude.use("db");
    if (!db) return;
    const snap = await db.doc(DOC).get();
    if (snap.exists) {
      const d = snap.data() || {};
      if (Array.isArray(d.anchors)) state.anchors = d.anchors;
      if (Array.isArray(d.log))     state.log     = d.log;
      if (Array.isArray(d.seen))    state.seen    = d.seen;
    }
  } catch (e) { db = null; }
  state.loaded = true;
  render();
}

async function saveState() {
  if (!db) return;
  try {
    await db.doc(DOC).set({
      anchors: state.anchors,
      log: state.log.slice(-300),
      seen: state.seen.slice(-300),
    });
  } catch (e) { /* keep working from memory */ }
}

/* ---------- prompt assembly ---------- */

function anchorBlock() {
  const rows = state.anchors
    .slice()
    .sort((a, b) => b.score - a.score)
    .map(a => `  ${a.title} = ${a.score}${a.note ? " — " + a.note : ""}`)
    .join("\n");
  return "HIS CALIBRATION ANCHORS (1-10, his scale, his word is final):\n" + rows;
}

function tasteBlock() {
  if (!state.log.length) return "";
  const rows = state.log.slice(-24).map(e =>
    `  ${e.title} — predicted ${Number(e.score).toFixed(1)} — he ${
      { loved:"loved it", liked:"liked it", nothing:"found nothing there", bounced:"bounced off it" }[e.verdict]
    }`).join("\n");
  return `
HIS ACTUAL REACTIONS so far (the ground truth this scale exists to predict — where a
prediction missed, correct toward the reaction, and say so if it changes your read):
${rows}`;
}

const SHAPE_NOTE =
`FAMILIARITY (0-3): how well do you actually know this work? 3 = thoroughly.
2 = well enough. 1 = only by reputation, you are partly guessing. 0 = you do not know it.
Be honest — a confident score on something you half-remember is worse than a flagged guess.
IDENT: one line naming director/creator, year, and premise, so a wrong match is caught.`;

/* ---------- sampling ---------- */

let ctl = null;

function errCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled")
    return "This page can't reach Claude. Open it from your Claude account and allow it when asked.";
  if (c === "rate_limited")    return "Too many requests, or you've hit your usage limit. Give it a minute.";
  if (c === "session_expired") return "Your session expired. Sign in again, then retry.";
  if (c === "invalid_json")    return "The reply came back malformed. Try again.";
  if (c === "refused")         return "Claude declined to answer that one. Try a different title.";
  if (c === "prompt_too_large")return "Your calibration list has grown too long. Trim some anchors.";
  if (c === "empty_completion")return "Nothing came back. Try again.";
  return "That didn't go through. Try again.";
}

/* ---------- READ ---------- */

const EXAMPLE = {
  name: "Justified",
  example: true,
  ident: "Graham Yost, 2010-2015. US Marshal returns to eastern Kentucky and shoots people politely.",
  scores: { control:2, writing:1, under:1, commit:2, nochase:2, withhold:1 },
  notes: {
    control:  "Competent, never deliberate — decisions land on procedural habit rather than intent.",
    writing:  "Dialogue exists to move the plot and flatter the lead. Everyone talks in the same drawl.",
    under:    "Nothing beneath the surface. What you are told is what there is.",
    commit:   "Softens every hard turn within an episode and resets by the next one.",
    nochase:  "Constantly performs its own cool — the hat is doing the work.",
    withhold: "Spends the big reveal in the first five minutes and explains the rest aloud.",
  },
  fandom: 0, fandomWhy: "", familiarity: 3,
  peak: "None. The pilot's diner scene is the high point and it's spent immediately.",
  kill: "Functional dialogue. Nobody in it carries any weight.",
};

let reading = EXAMPLE, readBusy = false, readErr = "", readTitle = "";

function readPanel() {
  const r = reading;
  let h = `
    <div class="row">
      <input type="text" id="q" placeholder="Film, show, anything" value="${esc(readTitle)}" autocomplete="off" spellcheck="false">
      <button class="go" data-act="read" ${readBusy ? "disabled" : ""}>${readBusy ? "Reading" : "Read it"}</button>
    </div>
    <div class="seg">
      <button data-act="stop" ${readBusy ? "" : "hidden"}>Stop</button>
    </div>`;

  if (readBusy) h += `<div class="status"><span class="dot"></span>Working through the rubric — up to a minute.</div>`;
  if (readErr)  h += `<div class="err">${esc(readErr)}</div>`;

  if (r) {
    const score = composite(r.scores, r.fandom);
    const pen = clamp(Number(r.fandom) || 0, 0, 3) * 0.9;
    h += `<div class="sheet">`;
    if (r.example) h += `<span class="sheetflag">Example reading</span>`;

    h += `
      <div class="verdict">
        <div class="vtop">
          <div>
            <div class="vname">${esc(r.name)}</div>
            ${r.ident ? `<div class="vident">${esc(r.ident)}</div>` : ""}
          </div>
          <div>
            <div class="vnum">${score.toFixed(1)}</div>
            <div class="vband">${band(score)}</div>
          </div>
        </div>
        ${pen > 0 ? `<div class="dock"><b>Docked ${pen.toFixed(1)} for coded fandom.</b> ${esc(r.fandomWhy || "Liking it reads as a personality signal.")}</div>` : ""}
        ${Number(r.familiarity) <= 1 ? `<div class="warnflag">Claude only knows this by reputation — treat the read as a guess, not a measurement.</div>` : ""}
      </div>`;

    for (const a of AXES) {
      const v = ax05(r.scores && r.scores[a.key]);
      h += `
        <div class="axis">
          <div class="arow">
            <div class="alab">${a.label}<span class="ahint">${a.hint}</span></div>
            <div class="aval">${v}/5</div>
          </div>
          <div class="ticks">${[0,1,2,3,4].map(i => `<i class="${i < v ? "on" : ""}"></i>`).join("")}</div>
          <div class="anote prose">${esc((r.notes && r.notes[a.key]) || "")}</div>
        </div>`;
    }

    h += `<div class="callout">
      ${r.peak ? `<div class="peak"><span class="k">Carrying it</span><span class="prose">${esc(r.peak)}</span></div>` : ""}
      ${r.kill ? `<div><span class="k">Draining it</span><span class="prose">${esc(r.kill)}</span></div>` : ""}
    </div>`;

    if (!r.example) {
      const done = state.log.find(e => e.title === r.name);
      h += `<div class="after">
        <div class="eyebrow">Seen it? Tell it what actually happened</div>
        <p class="subtle">Every verdict you log is fed into the next reading. This is the only thing that makes it more accurate about you specifically.</p>
        <div class="chips">
          ${VERDICTS.map(v => `<button class="chip" data-act="verdict" data-v="${v.key}" aria-pressed="${done && done.verdict === v.key ? "true" : "false"}">${v.label}</button>`).join("")}
        </div>
        ${done ? `<div class="saved">Logged. It'll weigh on what comes next.</div>` : ""}
      </div>`;
    }
    h += `</div>`;
  }
  return h;
}

async function doRead() {
  const name = (document.getElementById("q").value || "").trim();
  readTitle = name;
  if (!name) { readErr = "Type a title first."; render(); return; }

  readBusy = true; readErr = ""; render();
  ctl = new AbortController();

  const rubric = AXES.map(a => `  ${a.key} — ${a.label}: ${a.hint}`).join("\n");
  const prompt =
`Score the aura of "${name}". Its opposite is daytime television: functional, explained,
weightless.

${DOCTRINE}

${anchorBlock()}
${tasteBlock()}

Score each axis 0-5:
${rubric}

${SHAPE_NOTE}

Judge the work itself, not its reputation. Be willing to score a beloved thing low and an
unfashionable thing high. Notes are one sentence each, specific to this work — name the
scene, the line, the choice. No hedging, no "arguably".

Reply with only this JSON:
{"ident":"","scores":{"control":0,"writing":0,"under":0,"commit":0,"nochase":0,"withhold":0},
"notes":{"control":"","writing":"","under":"","commit":"","nochase":"","withhold":""},
"fandom":0,"fandomWhy":"","familiarity":3,"peak":"","kill":""}`;

  try {
    const out = await sample.json(prompt, { modelTier:"complex", signal: ctl.signal, cache:{ gcTime: 900000 } });
    reading = Object.assign({ name }, out, { example:false });
  } catch (e) {
    if (e && e.code === "cancelled") { readBusy = false; render(); return; }
    readErr = errCopy(e);
  }
  readBusy = false;
  render();
}

/* ---------- FIND ---------- */

const LANES = [
  ["any",     "Any",             ""],
  ["cheap",   "Cheap but total", "Lean towards work that looks cheap, flat or unfashionable but is in complete command — the Arizona case."],
  ["figure",  "A figure",        "Lean towards work built around one person with real weight, written well enough to carry it."],
  ["strange", "Strange",         "Lean towards work that is structurally odd or unlike anything else, with layers under it."],
  ["nasty",   "Nasty",           "Lean towards work with no interest in being liked — hard, unsentimental, unsoftened."],
];

// Kept separate per form. A shared list meant asking for shows while demanding
// "under 100 minutes" or "a first or second feature", which dragged the answer
// back to films every time.
const SPICE = {
  film: [
    "made before 1995","not in English","made outside the US, UK and Canada",
    "released in the last four years","from the 2000s","under 100 minutes",
    "a first or second feature","from Australia, Ireland or Scandinavia",
    "that never got a wide release","from the 1970s or 80s",
  ],
  show: [
    "made before 2000","not in English","made outside the US, UK and Canada",
    "that ran for a single season","first aired in the last four years",
    "from the 2000s","with episodes under 30 minutes",
    "that was cancelled before it finished its story",
    "from Australia, Ireland or Scandinavia",
    "that aired somewhere nobody was looking",
  ],
};

const FORM = {
  film: { noun:"feature films", rule:"Every pick must be a FEATURE FILM. No television series, no miniseries, no documentaries series." },
  show: { noun:"television series", rule:"Every pick must be a TELEVISION SERIES — episodic or a limited/mini series. NO FEATURE FILMS. If a title you are considering is a film, discard it and find a series instead." },
};

let kind = "film", lane = "any", floor = 8, findBusy = false, findErr = "", picks = [];

function findPanel() {
  let h = `
    <div class="fieldlab"><span class="eyebrow">Form</span></div>
    <div class="seg">
      ${["film","show"].map(k => `<button data-act="kind" data-v="${k}" aria-pressed="${kind===k}">${k === "film" ? "Films" : "Shows"}</button>`).join("")}
    </div>
    <div class="fieldlab"><span class="eyebrow">Register</span></div>
    <div class="seg">
      ${LANES.map(l => `<button data-act="lane" data-v="${l[0]}" aria-pressed="${lane===l[0]}">${l[1]}</button>`).join("")}
    </div>
    <div class="fieldlab"><span class="eyebrow">Floor</span><span class="aval">${band(floor)}</span></div>
    <div class="seg">
      ${[7.5,8,8.5].map(f => `<button data-act="floor" data-v="${f}" aria-pressed="${floor===f}">${f.toFixed(1)}+</button>`).join("")}
    </div>
    <div class="seg" style="margin-top:16px">
      <button class="go" data-act="find" ${findBusy ? "disabled" : ""}>${findBusy ? "Looking" : "Find aura"}</button>
      <button data-act="stopfind" ${findBusy ? "" : "hidden"}>Stop</button>
    </div>`;

  if (findBusy) h += `<div class="status"><span class="dot"></span>Six candidates, each scored on the full rubric. This takes a minute.</div>`;
  if (findErr)  h += `<div class="err">${esc(findErr)}</div>`;

  if (picks.length) {
    h += `<div class="sheet">`;
    picks.forEach((p, i) => {
      const s = composite(p.scores, p.fandom);
      const pen = clamp(Number(p.fandom) || 0, 0, 3) * 0.9;
      const logged = state.log.find(e => e.title === p.title);
      h += `
        <div class="pick">
          <div class="ptop">
            <div>
              <div class="pname">${esc(p.title)} ${p.year ? `<span>${esc(String(p.year))}</span>` : ""}</div>
              ${p.ident ? `<div class="pident">${esc(p.ident)}</div>` : ""}
            </div>
            <div class="pnum">${s.toFixed(1)}</div>
          </div>
          <div class="pwhy prose">${esc(p.why || "")}</div>
          <div class="pmeta">
            ${AXES.map(a => `<span class="tag">${a.key} ${ax05(p.scores && p.scores[a.key])}</span>`).join("")}
            ${pen > 0 ? `<span class="tag warn">docked ${pen.toFixed(1)} — fandom</span>` : ""}
            ${Number(p.familiarity) <= 1 ? `<span class="tag warn">low confidence</span>` : ""}
          </div>
          ${p.warn ? `<div class="warnflag">Watch for: ${esc(p.warn)}</div>` : ""}
          <div class="chips">
            ${VERDICTS.map(v => `<button class="chip" data-act="pverdict" data-i="${i}" data-v="${v.key}" aria-pressed="${logged && logged.verdict === v.key ? "true" : "false"}">${v.label}</button>`).join("")}
          </div>
        </div>`;
    });
    h += `</div>`;
  }
  return h;
}

async function doFind() {
  findBusy = true; findErr = ""; picks = []; render();
  ctl = new AbortController();

  const pool = SPICE[kind];
  const spice = pool[Math.floor(Math.random() * pool.length)];
  const laneTxt = (LANES.find(l => l[0] === lane) || [])[2] || "";
  const rubric = AXES.map(a => `  ${a.key} — ${a.label}: ${a.hint}`).join("\n");

  const prompt =
`Recommend 6 ${FORM[kind].noun} with heavy aura.

${FORM[kind].rule}
This is not negotiable and overrides every other preference below. Tag each pick with
"form":"${kind}" to confirm it. Anything of the wrong form will be thrown away.

${DOCTRINE}

${anchorBlock()}
${tasteBlock()}

${laneTxt}
Score every pick on the same axes, 0-5:
${rubric}

${SHAPE_NOTE}

HARD RULES
- ${FORM[kind].rule}
- Only include a pick whose axis scores genuinely put it at ${floor} or above on his scale.
  Returning four honest picks is better than six padded ones.
- Strongly prefer things he is unlikely to have heard of. Skip the canon and skip anything
  already on his anchor list.
- At least three of the six must be ${spice}. Vary era, country and register.
- Do not reward prestige cinematography or a moody score. A cheap-looking thing in total
  command beats a beautiful thing with thin writing.
- Nothing already shown: ${state.seen.slice(-120).join("; ") || "none"}

Reply with only this JSON:
{"picks":[{"title":"","year":0,"form":"${kind}","ident":"","scores":{"control":0,"writing":0,"under":0,"commit":0,"nochase":0,"withhold":0},"fandom":0,"fandomWhy":"","familiarity":3,"why":"what specifically gives it aura — the writing, the command, what it withholds","warn":"anything in it that might read as trying too hard, or empty string"}]}`;

  try {
    const out = await sample.json(prompt, { modelTier:"complex", signal: ctl.signal, cache:false });
    const raw  = (out && Array.isArray(out.picks) ? out.picks : []).filter(p => p && p.title);
    // Trust but verify: a pick that doesn't claim the form you asked for is dropped.
    const form = raw.filter(p => !p.form || String(p.form).toLowerCase().indexOf(kind) >= 0);
    const got  = form.filter(p => composite(p.scores, p.fandom) >= floor);
    picks = got;

    const wrongForm = raw.length - form.length;
    const belowBar  = form.length - got.length;
    const notes = [];
    if (wrongForm) notes.push(`${wrongForm} came back as the wrong form and ${wrongForm === 1 ? "was" : "were"} dropped.`);
    if (belowBar)  notes.push(`${belowBar} fell below your floor once scored.`);

    if (!got.length) {
      notes.push(raw.length
        ? "Nothing survived. Try a lower floor or a different register."
        : "Nothing came back. Try again.");
    } else {
      state.seen = state.seen.concat(got.map(p => p.title)).slice(-300);
      saveState();
    }
    findErr = notes.join(" ");
  } catch (e) {
    if (e && e.code === "cancelled") { findBusy = false; render(); return; }
    findErr = errCopy(e);
  }
  findBusy = false;
  render();
}

/* ---------- CALIBRATION ---------- */

function calPanel() {
  const log = state.log.slice().reverse();

  const stats = VERDICTS.map(v => {
    const rows = state.log.filter(e => e.verdict === v.key);
    const avg = rows.length ? rows.reduce((a, e) => a + Number(e.score), 0) / rows.length : null;
    return { label: v.label, n: rows.length, avg };
  });

  let h = `
    <h2 class="sec">How well it reads you</h2>
    <p class="subtle">The scale works if what it scores high is what you end up liking. These are its predictions against your verdicts.</p>
    <div class="readout">
      ${stats.map(s => `
        <div>
          <div class="n">${s.avg === null ? "—" : s.avg.toFixed(1)}</div>
          <div class="eyebrow" style="margin-top:4px">${s.label}</div>
          <div class="aval" style="margin-top:2px">${s.n} logged</div>
        </div>`).join("")}
    </div>
    <p class="note">Healthy calibration: the average beside <em>Loved it</em> sits well above the one beside <em>Bounced off</em>. If they converge, the rubric isn't tracking your taste — adjust the anchors below.</p>`;

  h += `<h2 class="sec">Verdict log</h2>`;
  if (!log.length) {
    h += `<p class="empty">Nothing logged yet. Read something, watch it, then say what happened.</p>`;
  } else {
    h += `<div class="tablewrap"><table>
      <thead><tr><th>Title</th><th>Predicted</th><th>You</th><th></th></tr></thead><tbody>
      ${log.map(e => `<tr>
        <td>${esc(e.title)}</td>
        <td class="num">${Number(e.score).toFixed(1)}</td>
        <td>${(VERDICTS.find(v => v.key === e.verdict) || {}).label || ""}</td>
        <td class="num"><button class="del" data-act="dellog" data-t="${esc(e.title)}" aria-label="Remove ${esc(e.title)}">&times;</button></td>
      </tr>`).join("")}
      </tbody></table></div>`;
  }

  h += `
    <h2 class="sec">Anchors</h2>
    <p class="subtle">Your scale, sent with every request. Change a number you disagree with, or add one — that is the fastest way to move its judgement.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Title</th><th>Score</th><th>Note</th><th></th></tr></thead><tbody>
      ${state.anchors.slice().sort((a,b) => b.score - a.score).map(a => `<tr>
        <td>${esc(a.title)}</td>
        <td class="num"><input type="text" class="sc anchsc" data-t="${esc(a.title)}" value="${a.score}" style="width:56px;padding:4px 6px;font-size:13px" inputmode="decimal"></td>
        <td class="prose" style="font-size:13.5px;color:var(--dim)">${esc(a.note || "")}</td>
        <td class="num"><button class="del" data-act="delanch" data-t="${esc(a.title)}" aria-label="Remove ${esc(a.title)}">&times;</button></td>
      </tr>`).join("")}
      </tbody></table></div>
    <div class="addrow">
      <input type="text" id="na" placeholder="Title" autocomplete="off">
      <input type="text" id="ns" class="sc" placeholder="8.5" inputmode="decimal">
      <button class="go" data-act="addanch">Add</button>
    </div>
    <p class="note">${db ? "Saved to this artifact — it survives reloads and follows the link." : "Storage is unavailable in this view, so changes last only until you reload."}</p>`;

  return h;
}

/* ---------- verdict capture ---------- */

function logVerdict(title, score, verdict) {
  const i = state.log.findIndex(e => e.title === title);
  const row = { title, score: Number(score), verdict, at: Date.now() };
  if (i >= 0) state.log[i] = row; else state.log.push(row);
  saveState();
  render();
}

/* ---------- plumbing ---------- */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  const map = { read:["panel-read", readPanel], find:["panel-find", findPanel], cal:["panel-cal", calPanel] };
  for (const k of Object.keys(map)) {
    const el = document.getElementById(map[k][0]);
    el.hidden = k !== tab;
    if (k === tab) el.innerHTML = map[k][1]();
  }
  if (tab === "read") {
    const q = document.getElementById("q");
    if (q && document.activeElement !== q && readTitle) q.value = readTitle;
  }
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act], .tab");
  if (!t) return;

  if (t.classList.contains("tab")) { tab = t.dataset.tab; render(); return; }

  const act = t.dataset.act;
  if (act === "read")      return void doRead();
  if (act === "find")      return void doFind();
  if (act === "stop" || act === "stopfind") { if (ctl) ctl.abort(); return; }
  if (act === "kind")  { kind = t.dataset.v; return render(); }
  if (act === "lane")  { lane = t.dataset.v; return render(); }
  if (act === "floor") { floor = Number(t.dataset.v); return render(); }

  if (act === "verdict" && reading && !reading.example)
    return logVerdict(reading.name, composite(reading.scores, reading.fandom), t.dataset.v);

  if (act === "pverdict") {
    const p = picks[Number(t.dataset.i)];
    if (p) logVerdict(p.title, composite(p.scores, p.fandom), t.dataset.v);
    return;
  }
  if (act === "dellog")  { state.log = state.log.filter(e => e.title !== t.dataset.t); saveState(); return render(); }
  if (act === "delanch") { state.anchors = state.anchors.filter(a => a.title !== t.dataset.t); saveState(); return render(); }
  if (act === "addanch") {
    const ti = document.getElementById("na"), sc = document.getElementById("ns");
    const title = (ti.value || "").trim(), score = Number(sc.value);
    if (!title || !isFinite(score)) return;
    state.anchors = state.anchors.filter(a => a.title.toLowerCase() !== title.toLowerCase());
    state.anchors.push({ title, score: clamp(score, 1, 10), note: "" });
    saveState(); render();
  }
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "q") doRead();
  if (ev.key === "Enter" && (ev.target.id === "na" || ev.target.id === "ns"))
    document.querySelector('[data-act="addanch"]').click();
});

document.addEventListener("change", ev => {
  if (!ev.target.classList.contains("anchsc")) return;
  const v = Number(ev.target.value);
  const a = state.anchors.find(x => x.title === ev.target.dataset.t);
  if (a && isFinite(v)) { a.score = clamp(v, 1, 10); saveState(); }
});

render();

(async () => {
  try { sample = await claude.use("sample"); } catch (e) { sample = null; }
  if (!sample) {
    readErr = "This page can't reach Claude from here. Open it from your Claude account.";
    findErr = readErr;
    render();
  }
  loadState();
})();
</script>
