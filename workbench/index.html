<title>Blue Pencil</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root{
  --paper:#eeece7;
  --leaf:#fbfaf7;
  --ink:#1a1c21;
  --dim:#6d717a;
  --rule:#d3d0c8;
  --hair:#e2dfd8;
  --pencil:#35618f;
  --pencil-wash:#35618f14;
  --good:#3f6b4d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131419;
    --leaf:#1b1d23;
    --ink:#e8e6e1;
    --dim:#8b8f99;
    --rule:#2e313a;
    --hair:#24272e;
    --pencil:#86b0da;
    --pencil-wash:#86b0da1f;
    --good:#74b087;
  }
}
:root[data-theme="dark"]{
  --paper:#131419;
  --leaf:#1b1d23;
  --ink:#e8e6e1;
  --dim:#8b8f99;
  --rule:#2e313a;
  --hair:#24272e;
  --pencil:#86b0da;
  --pencil-wash:#86b0da1f;
  --good:#74b087;
}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Public Sans",-apple-system,Segoe UI,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 90px}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  border-bottom:1px solid var(--ink);padding-bottom:10px}
header.top h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em}
header.top .sub{color:var(--dim);font-size:12.5px;text-align:right;max-width:30ch}

.tabs{display:flex;border-bottom:1px solid var(--rule);margin:0 0 20px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--dim);padding:10px 15px 9px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pencil)}
.tab:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}

label.fld{display:block;margin:16px 0 6px}
textarea,input[type=text]{
  width:100%;background:var(--leaf);border:1px solid var(--rule);border-radius:2px;
  color:var(--ink);font-family:inherit;font-size:14.5px;padding:10px 12px;resize:vertical;
}
textarea::placeholder,input::placeholder{color:var(--dim)}
textarea:focus,input:focus{outline:none;border-color:var(--pencil)}
textarea.brief{min-height:84px}
textarea.big{min-height:160px;font-family:"Literata",Georgia,serif;font-size:15px;line-height:1.6}

.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}
button.go{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-family:inherit;font-weight:600;font-size:13.5px;padding:9px 17px;border-radius:2px;cursor:pointer}
button.go:hover{background:transparent;color:var(--ink)}
button.go.blue{background:var(--pencil);border-color:var(--pencil);color:#fff}
button.go.blue:hover{background:transparent;color:var(--pencil)}
button.go[disabled]{opacity:.45;cursor:default}
button.ghost{appearance:none;background:none;border:1px solid var(--rule);color:var(--dim);
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.04em;padding:7px 11px;border-radius:2px;cursor:pointer}
button.ghost:hover{color:var(--ink);border-color:var(--dim)}
button.ghost[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.status{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:13px;margin-top:14px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--pencil);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.status .dot{animation:none;opacity:.7}}
.err{margin-top:14px;border-left:2px solid var(--pencil);padding:8px 0 8px 12px;font-size:13px}
.note{color:var(--dim);font-size:12.5px;margin-top:12px;max-width:60ch}
.saved{color:var(--good);font-size:12.5px;margin-top:10px}

/* the page of prose */
.leaf{background:var(--leaf);border:1px solid var(--hair);border-radius:2px;
  padding:26px 30px;margin-top:20px}
.leafhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--hair);padding-bottom:9px;margin-bottom:16px}
.prose{font-family:"Literata",Georgia,serif;font-size:16.5px;line-height:1.72;max-width:62ch}
.prose p{margin:0 0 1.05em}
.prose p:last-child{margin-bottom:0}
.flag{display:inline-block;border:1px solid var(--rule);color:var(--dim);
  font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:2px 7px}

/* scorecard */
.card{border-top:1px solid var(--ink);margin-top:26px;padding-top:14px}
.tally{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.total{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:.9;color:var(--pencil);
  font-variant-numeric:tabular-nums}
.band{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-top:6px}
.axes{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--hair);
  border:1px solid var(--hair);margin-top:16px}
.ax{background:var(--leaf);padding:9px 8px 10px;text-align:center}
.ax .k{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);display:block}
.ax .v{font-family:"JetBrains Mono",monospace;font-size:16px;margin-top:3px;font-variant-numeric:tabular-nums}
.ax .m{height:3px;background:var(--rule);margin-top:6px;border-radius:2px;overflow:hidden}
.ax .m i{display:block;height:100%;background:var(--pencil)}
.ax.low .v{color:var(--pencil)}

/* marks */
.mark{border-left:2px solid var(--pencil);background:var(--pencil-wash);
  padding:11px 14px;margin-top:10px}
.mark .q{font-family:"Literata",Georgia,serif;font-style:italic;font-size:15px;line-height:1.55}
.mark .why{font-size:13px;margin-top:7px}
.mark .fixline{font-size:13px;margin-top:5px;color:var(--dim)}
.mark .tag{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--pencil);display:block;margin-bottom:6px}
.mark.good{border-left-color:var(--good);background:transparent;
  border-bottom:1px solid var(--hair);padding-bottom:12px}
.mark.good .tag{color:var(--good)}
.worst{border-left:2px solid var(--ink);padding:10px 14px;margin-top:16px;font-size:13.5px}

/* cards tab */
.cardrow{display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-bottom:1px solid var(--hair);padding:11px 0}
.cardrow:last-of-type{border-bottom:1px solid var(--rule)}
.cardname{font-weight:600;font-size:14.5px}
.cardmeta{color:var(--dim);font-size:12px;margin-top:2px}
.del{appearance:none;background:none;border:0;color:var(--dim);font-size:17px;cursor:pointer;padding:0 3px;line-height:1}
.del:hover{color:var(--pencil)}
h2.sec{font-size:14.5px;font-weight:700;margin:30px 0 2px;letter-spacing:-.01em}
h2.sec:first-child{margin-top:0}
.sub{color:var(--dim);font-size:12.5px;margin:3px 0 0;max-width:62ch}
ul.rules{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65}
ul.rules li{margin-bottom:3px}
/* the anchor add row — markup was carried over from the marking sheet without
   these, so the score and note fields stacked full-width instead of sitting
   in a row with a narrow score box. */
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.addrow input[type=text]{flex:2;min-width:150px;width:auto}
.addrow input.sc{flex:0 0 76px;min-width:76px;text-align:center}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <header class="top">
    <h1>Blue Pencil</h1>
    <div class="sub">Writes it, marks it up against your rubric, then fixes what it marked.</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="write" aria-selected="true">Write</button>
    <button class="tab" role="tab" data-tab="cards" aria-selected="false">Voice</button>
    <button class="tab" role="tab" data-tab="pattern" aria-selected="false">Pattern</button>
  </div>

  <section id="panel-write" role="tabpanel"></section>
  <section id="panel-cards" role="tabpanel" hidden></section>
  <section id="panel-pattern" role="tabpanel" hidden></section>
</div>

<script>
"use strict";

/* ---------- the rubric ---------- */
// Same axes and the same fitted curve as the Aura marking sheet, turned on prose.

const AXES = [
  { key:"control",  ab:"Control",  label:"Total control",     hint:"Every sentence deliberate. Nothing on autopilot.",              w:3   },
  { key:"writing",  ab:"Writing",  label:"Sharp writing",     hint:"Sentences that earn their place, not connective tissue.",       w:2.5 },
  { key:"under",    ab:"Under",    label:"More underneath",   hint:"Subtext. What goes unsaid carries the scene.",                  w:2.5 },
  { key:"commit",   ab:"Commit",   label:"Commits fully",     hint:"Doesn't soften the hard turn or reassure the reader.",          w:2   },
  { key:"nochase",  ab:"No chase", label:"Doesn't chase you", hint:"Not performing prettiness. Not asking to be admired.",          w:2   },
  { key:"withhold", ab:"Withhold", label:"Withholds",         hint:"Doesn't explain. Doesn't resolve. Ends a beat early.",          w:1.5 },
];
const WSUM = AXES.reduce((a, x) => a + x.w, 0);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ax05 = v => clamp(Number(v) || 0, 0, 5);

function composite(scores) {
  let s = 0;
  for (const a of AXES) s += ax05(scores && scores[a.key]) * a.w;
  return clamp(1 + 9 * Math.pow(s / (5 * WSUM), 1.35), 1, 10);
}
function band(v) {
  if (v >= 9)   return "Untouchable";
  if (v >= 8)   return "Heavy aura";
  if (v >= 7)   return "Real presence";
  if (v >= 5.5) return "Some, not much";
  if (v >= 4)   return "Thin";
  return "No aura";
}

/* ---------- house rules ---------- */
// Applied under every voice card. These are the failures a language model
// commits at fiction by default; the voice card handles everything else.

const HOUSE = [
  "End one beat early. Whatever the natural final paragraph is, do not write it.",
  "Never state an emotion. No \"felt\", \"realised\", \"understood\", \"knew\". Put it in behaviour.",
  "Speech tags: \"said\" only, and few of those. No adverbs on tags.",
  "No character explains their own motivation aloud.",
  "No thematic summary. Nothing that tells the reader what this means.",
  "Every metaphor does work. No decorative weather, no sky that mirrors the mood.",
  "The important thing goes unsaid. Dialogue is evasive; people talk past each other.",
  "Vary the pacing. Compress what doesn't matter, slow down for what does.",
  "Nobody has to be likeable.",
  "Not every sentence is doing work. Let some go plain, so the ones that land have something to land against.",
  "Take one risk that might not come off.",
];

const DEFAULT_CARD = {
  id: "plain",
  name: "Plain and hard",
  samples: "",
  rules: [
    "Short declarative sentences. Let a long one land only when it is doing something.",
    "Concrete nouns. Almost no adjectives, fewer adverbs.",
    "Open in the middle of the action, no scene-setting paragraph.",
    "Dialogue in short exchanges, unattributed where it stays clear.",
    "No semicolons.",
    "Paragraphs of one to four sentences.",
  ],
};

// A fixed vocabulary so the same failure gets the same label across drafts.
// Without it every audit invents its own wording and nothing can be counted.
const FAULT_KINDS = [
  "stated-emotion", "thematic-summary", "one-beat-too-many", "over-explained",
  "resolved-too-neatly", "motivation-announced", "on-the-nose-dialogue",
  "decorative-detail", "weak-verb", "filter-word", "adverb-tag",
  "uniform-pacing", "everyone-likeable", "autopilot-sentence",
];

const LENGTHS = [
  ["flash", "Flash",  "about 250 words"],
  ["short", "Short",  "about 700 words"],
  ["scene", "Scene",  "about 1400 words"],
];

/* ---------- state ---------- */

const state = { cards: [DEFAULT_CARD], active: "plain", history: [], anchors: [], loaded: false };
let db = null, sample = null;
let tab = "write";
let dbUnavailable = false, lastSave = { cloud:null, local:null }, saveMsg = "";
const DOC = "workbench/state";
const LS = "bluepencil:v1";

function payload() {
  return { cards: state.cards, active: state.active,
           history: state.history.slice(-60), anchors: state.anchors };
}
function adopt(d) {
  if (!d) return false;
  if (Array.isArray(d.cards) && d.cards.length) state.cards = d.cards;
  if (typeof d.active === "string") state.active = d.active;
  if (Array.isArray(d.history)) state.history = d.history;
  if (Array.isArray(d.anchors)) state.anchors = d.anchors;
  return true;
}

// Passages you scored yourself, sent with every pass. Without these the scale
// floats against the model's own idea of good writing, which is exactly where
// its own output already sits — so it marks itself well.
function anchorBlock() {
  if (!state.anchors.length) return "";
  const rows = state.anchors.slice().sort((a, b) => b.score - a.score).map(a =>
    `[${Number(a.score).toFixed(1)}]${a.note ? " " + a.note : ""}\n"${String(a.text).slice(0, 700).trim()}"`
  ).join("\n\n");
  return `
THE SCALE, FIXED BY THE READER YOU ARE MARKING FOR. These are passages he has
scored himself. His numbers are final and they define what each score means here.
Place this passage against them. If it is not as good as what he called an 8, it
is not an 8, however clean it is.

${rows}
`;
}

/* ---------- what it keeps getting wrong ---------- */

function historyFor(cardId) {
  return state.history.filter(h => h.card === cardId);
}

// Per-axis means and a tally of repeated failure kinds for one voice.
function pattern(cardId) {
  const hs = historyFor(cardId);
  if (!hs.length) return null;
  const means = {};
  for (const a of AXES) {
    const vals = hs.map(h => ax05(h.scores && h.scores[a.key]));
    means[a.key] = vals.reduce((x, y) => x + y, 0) / vals.length;
  }
  const tally = {};
  for (const h of hs) for (const f of (h.faults || [])) {
    if (!f.kind) continue;
    (tally[f.kind] = tally[f.kind] || { kind: f.kind, n: 0, examples: [] }).n++;
    if (f.problem && tally[f.kind].examples.length < 3) tally[f.kind].examples.push(f.problem);
  }
  const worstAxis = AXES.slice().sort((a, b) => means[a.key] - means[b.key])[0];
  return {
    n: hs.length, means, worstAxis,
    repeats: Object.values(tally).sort((a, b) => b.n - a.n),
    recent: hs.slice(-6).map(h => h.score),
  };
}

// Injected into the write prompt once there is enough history to mean anything.
function learningBlock(cardId) {
  const p = pattern(cardId);
  if (!p || p.n < 3) return "";
  const repeats = p.repeats.filter(r => r.n >= 2).slice(0, 4);
  let s = `\nWHAT THIS WRITER KEEPS GETTING MARKED FOR — across the last ${p.n} drafts in\nthis voice. These are measured failures, not general advice. Do not repeat them:\n`;
  s += `- Weakest axis: ${p.worstAxis.label.toLowerCase()}, averaging ${p.means[p.worstAxis.key].toFixed(1)} out of 5. ${p.worstAxis.hint}\n`;
  for (const r of repeats) {
    s += `- Marked ${r.n} times for ${r.kind.replace(/-/g, " ")}${r.examples[0] ? `: ${r.examples[0]}` : ""}\n`;
  }
  s += `Write this one so those marks cannot be made again.`;
  return s;
}

function recordAudit(cardId, out) {
  const faults = (out.violations || []).map(v => ({
    kind: String(v.kind || "unlabelled"),
    problem: String(v.problem || "").slice(0, 160),
  }));
  state.history.push({
    card: cardId, at: Date.now(),
    score: Number(composite(out.scores).toFixed(2)),
    scores: out.scores || {}, faults,
  });
  state.history = state.history.slice(-60);
  saveState();
}

async function loadState() {
  let got = false;
  try {
    db = await claude.use("db");
    if (!db) dbUnavailable = true;
    else {
      const s = await db.doc(DOC).get();
      if (s.exists) got = adopt(s.data());
    }
  } catch (e) { db = null; dbUnavailable = true; }
  try {
    localStorage.setItem(LS + ":probe", "1"); localStorage.removeItem(LS + ":probe");
    lastSave.local = true;
  } catch (e) { lastSave.local = false; }
  if (!got) {
    try { const raw = localStorage.getItem(LS); if (raw) adopt(JSON.parse(raw)); } catch (e) {}
  }
  if (!state.cards.some(c => c.id === state.active)) state.active = state.cards[0].id;
  state.loaded = true;
  render();
}

async function saveState() {
  const body = payload();
  let local = false;
  try { localStorage.setItem(LS, JSON.stringify(body)); local = true; } catch (e) {}
  let cloud = false;
  if (db) { try { await db.doc(DOC).set(body); cloud = true; } catch (e) {} }
  lastSave = { cloud, local };
  return local || cloud;
}

const activeCard = () => state.cards.find(c => c.id === state.active) || state.cards[0];

/* ---------- prompts ---------- */

function voiceBlock(card) {
  let s = "VOICE — write in this voice.\n";
  if (card.samples && card.samples.trim()) {
    s += "\nPassages in the voice. Match their rhythm, diction and sentence length:\n---\n"
       + card.samples.trim().slice(0, 6000) + "\n---\n";
  }
  if (card.rules && card.rules.length) {
    s += "\nRules of this voice:\n" + card.rules.map(r => "- " + r).join("\n") + "\n";
  }
  s += "\nHOUSE RULES — these hold under every voice:\n" + HOUSE.map(r => "- " + r).join("\n");
  return s;
}

const rubricBlock = () =>
  AXES.map(a => `  ${a.key} — ${a.label}: ${a.hint}`).join("\n");

/* ---------- sampling plumbing ---------- */

let ctl = null;
function errCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled")
    return "This page can't reach Claude. Open it from your Claude account and allow it when asked.";
  if (c === "rate_limited")     return "Too many requests, or you've hit your usage limit. Give it a minute.";
  if (c === "session_expired")  return "Your session expired. Sign in again, then retry.";
  if (c === "invalid_json")     return "The mark-up came back malformed. Run the pass again.";
  if (c === "refused")          return "Claude declined this one. Change the brief.";
  if (c === "prompt_too_large") return "Too much text. Shorten the samples on the voice card.";
  if (c === "empty_completion") return "Nothing came back. Try again.";
  return "That didn't go through. Try again.";
}

/* ---------- example state (replaced on first real run) ---------- */

const EXAMPLE = {
  example: true,
  brief: "A man watches someone leave for the last time.",
  draft: "Marcus felt a pang of regret as he watched her go. He had always known this moment would come, and yet now that it was here, he realised he wasn't ready for it. The rain fell softly against the window, as if the sky itself were mourning what had been lost between them.\n\n\"I never meant to hurt you,\" he said quietly, though she was already gone.\n\nIn that moment, he understood that some things cannot be undone.",
  audit: {
    scores: { control:2, writing:1, under:1, commit:2, nochase:1, withhold:1 },
    violations: [
      { quote:"Marcus felt a pang of regret", axis:"under",
        problem:"States the emotion outright, so the scene never has to earn it.",
        fix:"Cut it. Give him something to do with his hands instead." },
      { quote:"as if the sky itself were mourning what had been lost between them", axis:"nochase",
        problem:"Decorative weather doing no work. The prose is performing sadness at the reader.",
        fix:"Let the rain be rain, or cut the clause." },
      { quote:"\"I never meant to hurt you,\"", axis:"writing",
        problem:"He announces his own motivation, which is the one thing a character in this position would not say plainly.",
        fix:"Give him a line about something else entirely." },
      { quote:"In that moment, he understood that some things cannot be undone.", axis:"withhold",
        problem:"Thematic summary. Tells the reader what the scene meant, one beat after the scene already said it.",
        fix:"Delete the paragraph. End on the line before." },
    ],
    worst: "It explains itself three separate times. Nothing is left for the reader to do.",
  },
  revision: "",
};

let work = EXAMPLE;
let brief = EXAMPLE.brief, length = "short";
let busy = "", err = "", streamed = "";
let mode = "write", pasted = "";

/* ---------- WRITE panel ---------- */

function writePanel() {
  const w = work;
  const card = activeCard();

  let h = `
    <div class="bar" style="margin-top:0">
      <button class="ghost" data-act="mode" data-v="write" aria-pressed="${mode === "write"}">Write one</button>
      <button class="ghost" data-act="mode" data-v="mark" aria-pressed="${mode === "mark"}">Mark up something</button>
    </div>`;

  if (mode === "write") {
    h += `
      <div class="bar">
        <span class="eyebrow" style="margin-right:2px">Voice</span>
        ${state.cards.map(c => `<button class="ghost" data-act="pick" data-v="${esc(c.id)}" aria-pressed="${c.id === state.active}">${esc(c.name)}</button>`).join("")}
      </div>
      <label class="fld eyebrow" for="brief">Brief</label>
      <textarea id="brief" class="brief" placeholder="What happens, who's in it, where it sits. A sentence is enough.">${esc(brief)}</textarea>
      <div class="bar">
        <span class="eyebrow" style="margin-right:2px">Length</span>
        ${LENGTHS.map(l => `<button class="ghost" data-act="len" data-v="${l[0]}" aria-pressed="${length === l[0]}">${l[1]}</button>`).join("")}
      </div>
      <div class="bar">
        <button class="go" data-act="write" ${busy ? "disabled" : ""}>${w.draft && !w.example ? "Write again" : "Write it"}</button>
        ${busy ? `<button class="ghost" data-act="stop">Stop</button>` : ""}
      </div>`;
  } else {
    h += `
      <label class="fld eyebrow" for="paste">Somebody's prose</label>
      <textarea id="paste" class="big" placeholder="Paste an excerpt — yours, or someone else's.">${esc(pasted)}</textarea>
      <p class="sub">Judged on the rubric alone. Your voice card isn't applied — it's not their job to write like you.</p>
      <div class="bar">
        <button class="go blue" data-act="markup" ${busy ? "disabled" : ""}>Read it</button>
        ${busy ? `<button class="ghost" data-act="stop">Stop</button>` : ""}
      </div>`;
  }

  if (busy === "write")  h += `<div class="status"><span class="dot"></span>Writing.</div>`;
  if (busy === "audit")  h += `<div class="status"><span class="dot"></span>Marking it up against the rubric.</div>`;
  if (busy === "revise") h += `<div class="status"><span class="dot"></span>Fixing what was marked.</div>`;
  if (err) h += `<div class="err">${esc(err)}</div>`;

  const shown = busy === "write" ? streamed : w.draft;
  if (shown) {
    h += `
      <div class="leaf">
        <div class="leafhead">
          <span class="eyebrow">Draft · ${esc(card.name)}</span>
          ${w.example ? `<span class="flag">Example</span>` : `<button class="ghost" data-act="copy" data-which="draft">Copy</button>`}
        </div>
        <div class="prose" id="draftbody">${paras(shown)}</div>
      </div>`;

    if (!busy && !w.audit) {
      h += `<div class="bar"><button class="go blue" data-act="audit">Run the pass</button></div>
            <p class="note">Scores it on your six axes and marks the exact lines that fail.</p>`;
    }
  }

  if (w.audit) h += auditBlock(w);

  if (w.revision) {
    h += `
      <div class="leaf" style="border-color:var(--pencil)">
        <div class="leafhead">
          <span class="eyebrow" style="color:var(--pencil)">Revised</span>
          ${w.example ? "" : `<button class="ghost" data-act="copy" data-which="revision">Copy</button>`}
        </div>
        <div class="prose" id="revbody">${paras(w.revision)}</div>
      </div>
      ${w.reaudit ? scoreStrip(w.reaudit.scores, "After the fixes") : `
        <div class="bar"><button class="go blue" data-act="reaudit">Score the revision</button></div>`}`;
  }

  if (dbUnavailable) h = `<div class="err" style="margin-top:0;margin-bottom:14px">Cloud storage is unavailable here — voice cards save to this browser only.</div>` + h;
  return h;
}

function auditBlock(w) {
  const a = w.audit;
  const total = composite(a.scores);
  let h = `<div class="card">
    <div class="tally">
      <div>
        <span class="eyebrow">Marked up</span>
        <div class="total">${total.toFixed(1)}</div>
        <div class="band">${band(total)}</div>
      </div>
      <div style="flex:1;min-width:180px">
        ${a.worst ? `<div class="worst">${esc(a.worst)}</div>` : ""}
      </div>
    </div>
    <div class="axes">
      ${AXES.map(x => {
        const v = ax05(a.scores && a.scores[x.key]);
        return `<div class="ax ${v <= 2 ? "low" : ""}">
          <span class="k">${x.ab}</span>
          <div class="v">${v}</div>
          <div class="m"><i style="width:${v / 5 * 100}%"></i></div>
        </div>`;
      }).join("")}
    </div>`;

  const ss = Array.isArray(a.strengths) ? a.strengths : [];
  if (ss.length) {
    h += `<p class="note" style="margin-top:16px">What it's doing.</p>`;
    for (const s of ss) {
      h += `<div class="mark good">
        <span class="tag">${esc(s.axis || "")}</span>
        <div class="q">${esc(s.quote || "")}</div>
        <div class="why">${esc(s.move || "")}</div>
      </div>`;
    }
  }

  const vs = Array.isArray(a.violations) ? a.violations : [];
  if (vs.length) {
    h += `<p class="note" style="margin-top:16px">${w.foreign ? `Where it slips.` : `${vs.length} mark${vs.length === 1 ? "" : "s"} on the draft.`}</p>`;
    for (const v of vs) {
      h += `<div class="mark">
        <span class="tag">${esc(v.axis || "")}</span>
        <div class="q">${esc(v.quote || "")}</div>
        <div class="why">${esc(v.problem || "")}</div>
        ${v.fix ? `<div class="fixline">${esc(v.fix)}</div>` : ""}
      </div>`;
    }
    if (!w.revision && !busy && !w.example && !w.foreign)
      h += `<div class="bar"><button class="go blue" data-act="revise">Apply the fixes</button></div>
            <p class="note">Fixes exactly these lines. Same story, same length — it doesn't get to rewrite it.</p>`;
    if (w.example)
      h += `<p class="note">This is a worked example on a deliberately bad paragraph. Write something to replace it.</p>`;
  }

  if (w.foreign && !busy) {
    h += `<div class="bar" style="margin-top:18px">
        <button class="go" data-act="cardfrom">Make a voice card from this</button>
      </div>
      <p class="note">Derives the rules from this passage and opens the card, so you can write in it.</p>`;
  }
  return h + `</div>`;
}

function scoreStrip(scores, label) {
  const t = composite(scores);
  return `<div class="card" style="border-top-color:var(--pencil)">
    <div class="tally">
      <div><span class="eyebrow">${esc(label)}</span>
        <div class="total">${t.toFixed(1)}</div>
        <div class="band">${band(t)}</div></div>
    </div>
    <div class="axes">
      ${AXES.map(x => { const v = ax05(scores && scores[x.key]);
        return `<div class="ax ${v <= 2 ? "low" : ""}"><span class="k">${x.ab}</span>
          <div class="v">${v}</div><div class="m"><i style="width:${v / 5 * 100}%"></i></div></div>`;
      }).join("")}
    </div></div>`;
}

/* ---------- actions ---------- */

async function doWrite() {
  const b = (document.getElementById("brief").value || "").trim();
  brief = b;
  if (!b) { err = "Give it a brief first."; render(); return; }
  err = ""; busy = "write"; streamed = ""; work = { brief: b, draft: "", audit: null, revision: "" };
  render();
  ctl = new AbortController();

  const len = LENGTHS.find(l => l[0] === length) || LENGTHS[1];
  const prompt =
`Write ${len[2]} of fiction from this brief.

BRIEF: ${b}

${voiceBlock(activeCard())}
${learningBlock(state.active)}

Output the prose only. No title, no preamble, no notes, no commentary afterwards.`;

  try {
    const r = await sample(prompt, {
      modelTier:"complex", signal: ctl.signal, cache:false,
      onText: ({ text }) => {
        streamed = text;
        const el = document.getElementById("draftbody");
        if (el) el.innerHTML = paras(text); else render();
      },
    });
    work.draft = r.text.trim();
  } catch (e) {
    if (e && e.code === "cancelled") { if (streamed) work.draft = streamed.trim(); }
    else { err = errCopy(e); if (e && e.text) work.draft = e.text.trim(); }
  }
  busy = ""; streamed = "";
  render();
}

async function doAudit(which) {
  const text = which === "revision" ? work.revision : work.draft;
  if (!text) return;
  const foreign = !!work.foreign;
  err = ""; busy = "audit"; render();
  ctl = new AbortController();

  // ONE prompt, whatever the text is. The marker is never told whether the
  // passage was generated here or pasted in, and is never shown the rules the
  // draft was written to. Both were leniency channels: knowing a draft was
  // written to a checklist turns the pass into a compliance check, and clearing
  // a floor then reads as excellence.
  const prompt =
`Read this passage closely and judge it against a fixed rubric.

THE RUBRIC — score each 0-5:
${rubricBlock()}
${anchorBlock()}
CALIBRATION. Be severe. A 4 is rare and a 5 is almost never given.

Judge the prose in front of you, not whether it obeys any rule. Following the
conventions of good writing is not the same as being good: prose can avoid every
known fault — never name a feeling, never summarise, never over-explain — and still
be lifeless, even, and authorless, with no sentence that risks anything and no
sentence a particular person would have written. That prose scores 2, not 4.
Compliance is a floor. Ask what the writing DOES, not what it avoids.

Marks of the real thing, and what actually earns a 4 or 5: unevenness — flat
sentences that let the good ones land; a rhythm that is somebody's; a risk that
might not have come off; an obsession the writer cannot leave alone; something
withheld that costs the reader.

Name BOTH:
- What it is doing right — the specific moves that earn the score. What is
  withheld, what the rhythm is doing, where the subtext sits. Return none if there
  is genuinely nothing.
- Where it fails the rubric. Return none if it is genuinely clean.

Quote EXACTLY as the text appears — every quote must be a verbatim substring.
At most 5 of each, best and worst first.

Tag each fault with a "kind" — the FAILURE TYPE, so repeats can be counted across
passages. Use one of these wherever it fits, spelled exactly:
${FAULT_KINDS.join(", ")}
Only invent a new kebab-case slug if none of those describe it.

PASSAGE:
---
${text.slice(0, 24000)}
---

Reply with only this JSON:
{"scores":{"control":0,"writing":0,"under":0,"commit":0,"nochase":0,"withhold":0},
"strengths":[{"quote":"","axis":"one of the six keys","move":"what this is doing, in one sentence"}],
"violations":[{"quote":"","axis":"one of the six keys","kind":"","problem":"","fix":""}],
"worst":"one sentence naming what most defines this passage, good or bad"}`;

  try {
    const out = await sample.json(prompt, { modelTier:"complex", signal: ctl.signal, cache:false });
    if (which === "revision") work.reaudit = out;
    else {
      work.audit = out; work.example = false;
      // Only your own drafts count as evidence about your writing.
      if (!foreign) recordAudit(state.active, out);
    }
  } catch (e) {
    if (!(e && e.code === "cancelled")) err = errCopy(e);
  }
  busy = ""; render();
}

function doMarkup() {
  const t = (document.getElementById("paste").value || "").trim();
  pasted = t;
  if (!t) { err = "Paste something first."; return render(); }
  err = "";
  work = { draft: t, foreign: true, audit: null, revision: "", brief: "" };
  doAudit("draft");
}

async function cardFromPassage() {
  if (!work.draft) return;
  err = ""; busy = "audit"; render();
  try {
    const rules = await deriveRules(work.draft);
    const id = "c" + Date.now().toString(36);
    state.cards.push({ id, name: "From a passage", samples: work.draft.slice(0, 6000), rules });
    state.active = id;
    await saveState();
    busy = ""; mode = "write"; tab = "cards"; editing = id;
    render();
    return;
  } catch (e) { err = errCopy(e); }
  busy = ""; render();
}

async function doRevise() {
  if (!work.draft || !work.audit) return;
  err = ""; busy = "revise"; work.revision = ""; work.reaudit = null; render();
  ctl = new AbortController();

  const vs = (work.audit.violations || [])
    .map((v, i) => `${i + 1}. ${v.quote}\n   Problem: ${v.problem}\n   Fix: ${v.fix || "cut it"}`).join("\n");

  const prompt =
`Revise this draft by fixing exactly the problems listed. Nothing else.

Do NOT rewrite the story. Same events, same characters, same order, same rough
length. You are cutting and replacing specific lines, not writing a new draft.
Where a fix says to cut something, cut it and do not replace it with a different
version of the same move. Leave everything unmarked exactly as it is.

${voiceBlock(activeCard())}

MARKS TO FIX:
${vs}

DRAFT:
---
${work.draft}
---

Output the revised prose only. No notes, no list of what you changed.`;

  try {
    const r = await sample(prompt, {
      modelTier:"complex", signal: ctl.signal, cache:false,
      onText: ({ text }) => {
        work.revision = text;
        const el = document.getElementById("revbody");
        if (el) el.innerHTML = paras(text); else render();
      },
    });
    work.revision = r.text.trim();
  } catch (e) {
    if (e && e.code === "cancelled") { /* keep partial */ }
    else { err = errCopy(e); if (e && e.text) work.revision = e.text.trim(); }
  }
  busy = ""; render();
}

        <p class="sub" style="margin:0 0 10px">Paste this into a custom Style, a Project's instructions, or the top of a chat. It carries the samples, this card's rules, and the house rules together — the samples matter most, so keep them in.</p>
        <textarea id="takeoutbox" style="min-height:220px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5">${esc(voiceBlock(c))}</textarea>

let editing = null, takeout = null, ruleBusy = "";

function patternPanel() {
  const card = activeCard();
  const p = pattern(state.active);

  let h = `<h2 class="sec">${esc(card.name)}</h2>
    <p class="sub">Every pass on a draft in this voice is kept. Once there are three, what you keep getting marked for is sent with the next brief, so it writes against your actual failures instead of generic advice.</p>`;

  if (!p) {
    // Anchors are independent of history — they must be settable before the
    // first draft, since they are what the first score gets measured against.
    return h + `<p class="note" style="margin-top:18px">Nothing marked in this voice yet. Write something and run the pass.</p>`
             + anchorsSection();
  }

  h += `<div class="axes" style="margin-top:18px">
    ${AXES.map(x => {
      const m = p.means[x.key];
      const worst = x.key === p.worstAxis.key;
      return `<div class="ax ${m <= 2.5 ? "low" : ""}">
        <span class="k">${x.ab}</span>
        <div class="v">${m.toFixed(1)}</div>
        <div class="m"><i style="width:${m / 5 * 100}%"></i></div>
        ${worst ? `<span class="k" style="color:var(--pencil);margin-top:5px">weakest</span>` : ""}
      </div>`;
    }).join("")}
  </div>
  <p class="note">Mean of ${p.n} draft${p.n === 1 ? "" : "s"}. Recent scores: <span class="mono">${p.recent.map(s => s.toFixed(1)).join("  ")}</span></p>`;

  const rep = p.repeats.filter(r => r.n >= 2);
  h += `<h2 class="sec">What it keeps doing</h2>`;
  if (!rep.length) {
    h += `<p class="note">No fault has come up twice yet.</p>`;
  } else {
    h += `<p class="sub">A fault marked three times or more is a habit, not an accident. Promote it and it becomes a standing rule on this card — carried into every draft and into the block you paste in chat.</p>`;
    for (const r of rep) {
      const already = (card.rules || []).some(x => x.toLowerCase().includes("[" + r.kind + "]"));
      h += `<div class="cardrow">
        <div>
          <div class="cardname">${esc(r.kind.replace(/-/g, " "))} <span class="mono" style="color:var(--dim);font-size:12px">×${r.n}</span></div>
          <div class="cardmeta">${esc(r.examples[0] || "")}</div>
        </div>
        <div class="bar" style="margin-top:0">
          ${already
            ? `<span class="eyebrow" style="color:var(--good)">rule added</span>`
            : `<button class="ghost" data-act="promote" data-v="${esc(r.kind)}" ${ruleBusy ? "disabled" : ""}>${ruleBusy === r.kind ? "Writing…" : "Make it a rule"}</button>`}
        </div>
      </div>`;
    }
  }

  h += `<div class="bar" style="margin-top:20px">
      <button class="ghost" data-act="clearhist">Clear this voice's history</button>
    </div>`;
  return h + anchorsSection();
}

function anchorsSection() {
  let h = `<h2 class="sec">Your scale</h2>
    <p class="sub">Without these, "good" means whatever the model thinks good is — which is where its own writing already sits, so it marks itself well. Paste passages and score them yourself. They ride along with every pass and the number has to answer to them.</p>`;

  if (!state.anchors.length) {
    h += `<p class="note">Nothing set. Two is enough to start: something you'd call a 9, something you'd call a 3.</p>`;
  } else {
    for (const a of state.anchors.slice().sort((x, y) => y.score - x.score)) {
      h += `<div class="mark" style="border-left-color:var(--ink);background:transparent">
        <span class="tag" style="color:var(--ink)">${Number(a.score).toFixed(1)}${a.note ? " · " + esc(a.note) : ""}
          <button class="del" data-act="delanchor" data-v="${esc(a.id)}" style="float:right" aria-label="Remove">&times;</button></span>
        <div class="q">${esc(String(a.text).slice(0, 300))}${String(a.text).length > 300 ? "…" : ""}</div>
      </div>`;
    }
  }

  h += `
    <label class="fld eyebrow" for="apassage">Passage</label>
    <textarea id="apassage" class="big" placeholder="Paste a passage. A paragraph or two is plenty.">${esc(newAnchorText)}</textarea>
    <div class="addrow">
      <input type="text" id="ascore" class="sc" placeholder="9" inputmode="decimal" value="${esc(newAnchorScore)}">
      <input type="text" id="anote" placeholder="Whose it is, or why — optional" value="${esc(newAnchorNote)}">
      <button class="go" data-act="addanchor">Set it</button>
    </div>
    ${err && tab === "pattern" ? `<div class="err">${esc(err)}</div>` : ""}
    ${saveMsg ? `<p class="saved">${esc(saveMsg)}</p>` : ""}`;
  return h;
}

let newAnchorText = "", newAnchorScore = "", newAnchorNote = "";

async function promoteRule(kind) {
  const card = activeCard();
  const p = pattern(state.active);
  const r = p && p.repeats.find(x => x.kind === kind);
  if (!r) return;
  err = ""; ruleBusy = kind; render();
  try {
    const out = await sample.json(
`A writer keeps being marked for the same fault. Write ONE rule that would prevent it.

The fault: ${kind.replace(/-/g, " ")}
How it has shown up: ${r.examples.join(" / ")}

The rule must be a single imperative sentence, concrete enough that an editor could
check a page against it. Not advice, not encouragement. "Show don't tell" is useless.
"Cut any sentence naming what a character feels" is useful.

Reply with only: {"rule":""}`, { modelTier:"quick", cache:false });
    const rule = String((out && out.rule) || "").trim();
    if (rule) {
      card.rules = (card.rules || []).concat(rule + " [" + kind + "]");
      await saveState();
      flash("Added to " + card.name + ".");
    }
  } catch (e) { err = errCopy(e); }
  ruleBusy = ""; render();
}

async function deriveRules(samples) {
  const prompt =
`Read these passages and derive the style specification they share.

Be concrete and enforceable — each rule must be something a writer could follow and
an editor could check against a page. "Evocative and lyrical" is useless. "Sentences
rarely exceed twelve words", "no adjective before a concrete noun", "scenes open on
dialogue" are useful.

Cover: sentence length and rhythm, diction, how paragraphs are shaped, how scenes
open and close, how dialogue is handled and attributed, punctuation habits, and —
most usefully — what this writer never does.

PASSAGES:
---
${samples.slice(0, 12000)}
---

Reply with only a JSON array of 8 to 14 rule strings. No preamble, no object wrapper.`;

  const out = await sample.json(prompt, { modelTier:"complex", cache:false });
  if (Array.isArray(out)) return out.map(String).filter(Boolean);
  if (out && Array.isArray(out.rules)) return out.rules.map(String).filter(Boolean);
  return [];
}

/* ---------- plumbing ---------- */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function paras(t) {
  return String(t || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  const m = { write:["panel-write", writePanel], cards:["panel-cards", cardsPanel],
              pattern:["panel-pattern", patternPanel] };
  for (const k of Object.keys(m)) {
    const el = document.getElementById(m[k][0]);
    el.hidden = k !== tab;
    if (k === tab) el.innerHTML = m[k][1]();
  }
}

function flash(msg) { saveMsg = msg; render(); setTimeout(() => { saveMsg = ""; render(); }, 2500); }

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act], .tab");
  if (!t) return;
  if (t.classList.contains("tab")) {
    if (tab === "write") { const b = document.getElementById("brief"); if (b) brief = b.value; }
    tab = t.dataset.tab; err = ""; return render();
  }
  const act = t.dataset.act, v = t.dataset.v;

  if (act === "write")    return void doWrite();
  if (act === "markup")   return void doMarkup();
  if (act === "cardfrom") return void cardFromPassage();
  if (act === "mode") {
    if (mode === "write") { const b = document.getElementById("brief"); if (b) brief = b.value; }
    else { const p = document.getElementById("paste"); if (p) pasted = p.value; }
    mode = v; err = ""; return render();
  }
  if (act === "audit")   return void doAudit("draft");
  if (act === "reaudit") return void doAudit("revision");
  if (act === "revise")  return void doRevise();
  if (act === "stop")    { if (ctl) ctl.abort(); return; }
  if (act === "len")     { length = v; return render(); }

  if (act === "pick") {
    state.active = v; saveState();
    if (tab === "write") { const b = document.getElementById("brief"); if (b) brief = b.value; }
    return render();
  }
  if (act === "copy") {
    const text = t.dataset.which === "revision" ? work.revision : work.draft;
    try { await navigator.clipboard.writeText(text || ""); t.textContent = "Copied"; setTimeout(render, 1200); }
    catch (e) { t.textContent = "Select it manually"; }
    return;
  }

  if (act === "takeout") {
    takeout = takeout === v ? null : v;
    render();
    // Select it as well as copying — clipboard access can be refused inside the
    // viewer frame, and a selected textarea always leaves a manual way out.
    const box = document.getElementById("takeoutbox");
    if (box) { box.focus(); box.select(); }
    return;
  }
  if (act === "copyvoice") {
    const c = state.cards.find(x => x.id === v); if (!c) return;
    try { await navigator.clipboard.writeText(voiceBlock(c)); t.textContent = "Copied"; setTimeout(render, 1400); }
    catch (e) {
      const box = document.getElementById("takeoutbox");
      if (box) { box.focus(); box.select(); }
      t.textContent = "Selected — copy it";
    }
    return;
  }
  if (act === "addanchor") {
    const txt = (document.getElementById("apassage").value || "").trim();
    const sc = Number(document.getElementById("ascore").value);
    if (!txt) { err = "Paste a passage first."; return render(); }
    if (!isFinite(sc)) { err = "Give it a score out of 10."; return render(); }
    state.anchors.push({ id: "a" + Date.now().toString(36), text: txt.slice(0, 1200),
      score: clamp(sc, 1, 10), note: (document.getElementById("anote").value || "").trim() });
    newAnchorText = ""; newAnchorScore = ""; newAnchorNote = ""; err = "";
    const ok = await saveState(); render();
    return flash(ok ? "Set. It'll ride along with every pass." : "Added, but it couldn't be saved.");
  }
  if (act === "delanchor") {
    state.anchors = state.anchors.filter(a => a.id !== v);
    await saveState(); return render();
  }
  if (act === "promote") return void promoteRule(v);
  if (act === "clearhist") {
    state.history = state.history.filter(h => h.card !== state.active);
    await saveState(); render();
    return flash("History cleared for this voice.");
  }
  if (act === "editcard") { editing = editing === v ? null : v; return render(); }
  if (act === "delcard") {
    state.cards = state.cards.filter(c => c.id !== v);
    if (state.active === v) state.active = state.cards[0].id;
    if (editing === v) editing = null;
    await saveState(); return render();
  }
  if (act === "savecard") {
    const c = state.cards.find(x => x.id === v); if (!c) return;
    c.name = (document.getElementById("ename").value || c.name).trim() || c.name;
    c.rules = (document.getElementById("erules").value || "").split("\n").map(s => s.trim()).filter(Boolean);
    c.samples = document.getElementById("esamples").value || "";
    editing = null;
    const ok = await saveState();
    return flash(ok ? (lastSave.cloud ? "Saved." : "Saved to this browser.") : "Couldn't save — it resets on reload.");
  }
  if (act === "rederive") {
    const c = state.cards.find(x => x.id === v); if (!c) return;
    const s = document.getElementById("esamples").value || "";
    if (!s.trim()) { err = "Paste some samples first."; return render(); }
    err = ""; extractBusy = true; render();
    try { const rules = await deriveRules(s); if (rules.length) { c.rules = rules; c.samples = s; await saveState(); } }
    catch (e) { err = errCopy(e); }
    extractBusy = false; return render();
  }
  if (act === "blankcard" || act === "makecard") {
    const nameEl = document.getElementById("nname"), sampEl = document.getElementById("nsamples");
    newName = (nameEl.value || "").trim(); newSamples = sampEl.value || "";
    if (!newName) { err = "Give the card a name."; return render(); }
    const id = "c" + Date.now().toString(36);
    let rules = [];
    if (act === "makecard") {
      if (!newSamples.trim()) { err = "Paste samples, or add a blank card and write the rules yourself."; return render(); }
      err = ""; extractBusy = true; render();
      try { rules = await deriveRules(newSamples); }
      catch (e) { err = errCopy(e); extractBusy = false; return render(); }
      extractBusy = false;
    }
    state.cards.push({ id, name: newName, samples: newSamples, rules });
    state.active = id; newName = ""; newSamples = ""; err = "";
    const ok = await saveState();
    render();
    return flash(ok ? "Card added and in use." : "Added, but it couldn't be saved.");
  }
});

document.addEventListener("input", ev => {
  if (ev.target.id === "brief")    brief = ev.target.value;
  if (ev.target.id === "paste")    pasted = ev.target.value;
  if (ev.target.id === "apassage") newAnchorText = ev.target.value;
  if (ev.target.id === "ascore")   newAnchorScore = ev.target.value;
  if (ev.target.id === "anote")    newAnchorNote = ev.target.value;
  if (ev.target.id === "nname")    newName = ev.target.value;
  if (ev.target.id === "nsamples") newSamples = ev.target.value;
});

render();

(async () => {
  try { sample = await claude.use("sample"); } catch (e) { sample = null; }
  if (!sample) { err = "This page can't reach Claude from here. Open it from your Claude account."; render(); }
  loadState();
})();
</script>
