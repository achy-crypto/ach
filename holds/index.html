<style>

  color:var(--sig);font-variant-numeric:tabular-nums;text-align:right}

/* shape stats */

/* axes */

/* verdict capture */

/* picks */

/* tables */
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}

  background:var(--rule);border:1px solid var(--rule)}

<div class="wrap">
  <header class="top">
    <h1>Will It Hold</h1>
    <p>Not whether a show is good — whether you'll actually get through it. Two different questions, and the answers often disagree.</p>
  </header>
  <div class="hr"></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="read" aria-selected="true">Check one</button>
    <button class="tab" data-tab="find" aria-selected="false">Find one</button>
    <button class="tab" data-tab="cal" aria-selected="false">Your scale</button>
  </div>
  <section id="panel-read"></section>
  <section id="panel-find" hidden></section>
  <section id="panel-cal" hidden></section>
</div>

<script>
"use strict";

/* ---------- what actually decides whether you finish something ---------- */

const AXES = [
  { key:"hook",     label:"Grabs you fast",        hint:"Something pulls in the first few minutes, not the third episode", w:2.5 },
  { key:"payoff",   label:"Pays off often",        hint:"A joke, a turn, a reveal lands regularly. Little dead air",       w:2.5 },
  { key:"tracking", label:"Easy to follow",        hint:"Few names and threads to hold. Look away and you're not lost",    w:2.5 },
  { key:"reentry",  label:"Easy to come back to",  hint:"Drop it three weeks, pick it up without rewatching",              w:2   },
  { key:"epload",   label:"Cheap to start one",    hint:"Short episodes. Low cost to press play on the next",             w:1.5 },
  { key:"pull",     label:"Makes you want more",   hint:"Ends leaving you wanting the next one",                          w:1.5 },
];
const WSUM = AXES.reduce((a,x)=>a+x.w,0);

const VERDICTS = [
  { key:"finished", label:"Finished it" },
  { key:"stuck",    label:"Still watching" },
  { key:"drifted",  label:"Drifted off" },
  { key:"bailed",   label:"Bailed early" },
];

// Starting estimates, deliberately including titles from the aura scale so the
// two rulers share a vocabulary. Justified is the point of the whole app: low
// on aura, high here. Quality and holdability are not the same axis.
const BASE_ANCHORS = [
  { title:"It's Always Sunny in Philadelphia", score:9.5, note:"22 minutes, no continuity to hold, funny inside a minute. The ceiling for holdability.", seed:true },
  { title:"Eastbound & Down", score:9, note:"Half-hour, per-episode payoff, nothing to track.", seed:true },
  { title:"Mr Inbetween", score:9, note:"25-minute episodes, largely self-contained, no homework.", seed:true },
  { title:"Justified", score:7.5, note:"Case of the week. Low tracking load, easy re-entry. Holds fine even if the aura score is a 3 — that is the point of this scale.", seed:true },
  { title:"The Shield", score:6.5, note:"Propulsive, but the serialised arcs punish a long gap.", seed:true },
  { title:"Fargo (season 1)", score:6.5, note:"Hour-long, moderate tracking, strong pull forward.", seed:true },
  { title:"Severance", score:6, note:"Hooks hard and pulls hard, but it is deliberately slow and the mystery demands you hold details.", seed:true },
  { title:"Ozark", score:4.5, note:"Hour-long, grim, heavy plot tracking, long flat stretches.", seed:true },
  { title:"The Wire", score:3, note:"Enormous cast, no hand-holding, four episodes before it opens up. Needs a locked-in brain.", seed:true },
];

const DOCTRINE = `HOLDABILITY is whether this person actually gets through the thing. It is NOT
quality, prestige, taste, or whether the show is worth watching. A brilliant show can score 3
and a mediocre one can score 9. Never let your opinion of the work move this number.

What raises it: something grabbing inside the first few minutes; frequent payoff so attention
gets fed; a low load on working memory — few names, factions, timelines to hold; episodes
short enough that starting one is cheap; being able to return after weeks away without
rewatching; ending in a way that makes the next one easy to start.

What sinks it: a slow burn that asks for patience up front; long atmospheric stretches with
nothing landing; a large cast and dense plot you must track or be lost; hour-plus episodes;
heavy serialisation that punishes a gap; subtitles combined with a second-screen habit;
a season count that reads as impossible before you begin.

Be concrete about the work. Runtimes, cast size, how fast the first episode moves, whether
episodes close anything. Do not speak in generalities about attention.`;

const FILM_RULES = `IF IT IS A FILM the shape of the problem changes and these override:
- There is no next episode to rescue a slow open, so the first ten minutes carry far more
  weight than they do for a series.
- Cost to start is the entire runtime as one commitment, not one cheap episode. Ninety
  minutes and a hundred and fifty are genuinely different propositions, and a long film is
  a harder ask than a long series made of short parts.
- Re-entry mostly does not exist. A film paused forty minutes in is usually never resumed,
  so the real question is whether he finishes it in one sitting. Score re-entry on whether
  it survives being stopped at all, and say so in the note.
- Judge pull as whether the middle sags, not whether there is a cliffhanger — the failure
  mode is drifting out during the second act, not failing to start episode four.
- The wall is a point in the runtime, not an episode number.
Set epMinutes to the runtime and leave episodes and seasons at 0.`;

const PLACEMENT = `THE USER'S SCALE IS THE FINAL AUTHORITY.
Pick exactly ONE anchor below that is closest in HOLDABILITY — not genre, quality or subject.
Copy its title EXACTLY. Then give a delta from -1.5 to +1.5. 0 means the same difficulty to
finish; +0.5 clearly easier to finish; -0.5 clearly harder. Usually stay within +/-0.75.
Final score = anchor score + delta. The axes are evidence for the placement, never an override.`;

const SHAPE = `FAMILIARITY 0-3: 3 thoroughly; 2 well enough; 1 mostly reputation; 0 unknown.
IDENT: creator, years, and the premise in one line so a wrong match is caught.`;

const STATES = [
  ["fried",  "Fried",     "He is depleted. Only recommend things that need almost nothing from him: short, funny or propulsive, no tracking load, no subtitles."],
  ["normal", "Normal",    ""],
  ["locked", "Locked in", "He has real attention available. Heavier, slower, denser work is allowed — but it still has to be genuinely finishable, not merely worthwhile."],
];

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const ax05=v=>clamp(Number(v)||0,0,5);
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
function band(v){
  if(v>=9)return"You'll finish it";
  if(v>=8)return"Sticks";
  if(v>=7)return"Holds, with effort";
  if(v>=5.5)return"You'll drift";
  if(v>=4)return"You'll drop it";
  return"Won't survive episode two";
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* ---------- state ---------- */

/* Two places, one page. Served by the standalone server in ../server it gets a
 * real TMDb catalog behind it: runtimes, episode and season counts become facts
 * instead of things the model remembered. Published as an artifact there is no
 * catalog at all, and it says so. */
const HOST={mode:"unknown",screen:false,provider:null,missing:[],rater:false,
  needsToken:false,token:"",model:null};

function hdrs(){const h={"Content-Type":"application/json"};
  if(HOST.token)h.Authorization="Bearer "+HOST.token;return h}
async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:hdrs()},opts||{}));
  let body=null;try{body=await r.json()}catch(e){}
  if(!r.ok){const err=new Error((body&&body.error)||`request failed (${r.status})`);
    err.code=r.status===401?"needs_token":(body&&body.code)||("http_"+r.status);
    err.missing=body&&body.missing;throw err}
  return body}
async function detectHost(){
  try{HOST.token=localStorage.getItem("holds:token")||""}catch(e){}
  try{const h=await api("/api/health");
    if(h&&h.app==="two-hours-in"){
      HOST.mode="server";
      HOST.screen=!!(h.screen&&h.screen.connected);
      HOST.provider=h.screen&&h.screen.provider;
      HOST.missing=(h.screen&&h.screen.missing)||[];
      HOST.rater=!!(h.rater&&h.rater.configured);HOST.model=h.rater&&h.rater.model;
      HOST.needsToken=!!h.needsToken&&!h.authed;
      if(!HOST.rater)HOST.missing=HOST.missing.concat(["ANTHROPIC_API_KEY"]);
      return}}
  catch(e){if(e&&e.code==="needs_token"){HOST.mode="server";HOST.needsToken=true;return}}
  HOST.mode="artifact"}
function catalogOn(){return HOST.mode==="server"&&HOST.screen}

const state={anchors:BASE_ANCHORS.map(x=>({...x})),log:[],seen:[],titles:{},loaded:false};
let db=null,sample=null,tab="read",ctl=null;
let readTitle="",readBusy=false,readErr="",searchResults=[];
let mood="normal",form="either",floor=7,findBusy=false,findErr="",picks=[],findOffset=0;
let setEasy="",setHard="",setDrop="",setErr="";
let justAdded=null,addErr="",dbUnavailable=false,dbErr="",lastSave={cloud:null,local:null};
const saveStatus={};
const DOC="holds/state", LS="holds:v1";

let reading={name:"The Wire",example:true,
  ident:"David Simon, 2002-2008. Baltimore drug trade and the police who chase it, one institution per season.",
  placement:{anchor:"The Wire",delta:0},
  scores:{hook:1,payoff:2,tracking:1,reentry:1,epload:2,pull:3},
  notes:{hook:"Four episodes before the shape of it arrives. The pilot asks for patience it never promises to repay quickly.",
    payoff:"Long procedural stretches where nothing lands. Rewards accumulate over a season, not a sitting.",
    tracking:"Dozens of named characters across two organisations, no recaps, no hand-holding.",
    reentry:"Come back after a fortnight and you will not remember who half these people are.",
    epload:"Hour-long, and the episodes do not close anything.",
    pull:"Genuinely strong once you are in — the problem is getting in."},
  shape:{epMinutes:60,episodes:60,seasons:5,hookMinutes:180,wall:"Most people stop somewhere in the first four episodes of season one."},
  tactics:["Commit to five episodes before judging it, or don't start.",
    "Subtitles on — the sound mix and the slang both work against you.",
    "No second screen. This is the one show where it does not survive divided attention.",
    "One episode a night, same time, so re-entry is never cold."],
  secondScreen:"no",familiarity:3};

function payload(){return{anchors:state.anchors,log:state.log.slice(-300),seen:state.seen.slice(-300),
  titles:state.titles,last:reading&&!reading.example?reading:null,lastPicks:picks.slice(0,8)}}
function adopt(d){if(!d)return false;
  if(Array.isArray(d.anchors))state.anchors=d.anchors;
  if(Array.isArray(d.log))state.log=d.log;
  if(Array.isArray(d.seen))state.seen=d.seen;
  if(d.titles&&typeof d.titles==="object")state.titles=d.titles;
  if(d.last&&d.last.name){reading=d.last;readTitle=d.last.name}
  if(Array.isArray(d.lastPicks))picks=d.lastPicks;return true}

function thaw(v){try{return v==null?v:JSON.parse(JSON.stringify(v))}catch(e){return null}}

async function loadState(){let got=false;
  if(HOST.mode==="server"){
    try{const out=await api("/api/screen/state");if(out&&out.state)got=adopt(thaw(out.state))}
    catch(e){dbUnavailable=true;dbErr=(e&&e.message)||"server storage unavailable"}
    try{localStorage.setItem(LS+":probe","1");localStorage.removeItem(LS+":probe");lastSave.local=true}
    catch(e){lastSave.local=false}
    if(!got){try{const raw=localStorage.getItem(LS);if(raw)adopt(JSON.parse(raw))}catch(e){}}
    state.loaded=true;return render()}
  try{db=await claude.use("db");
    if(!db){dbUnavailable=true;dbErr="not available in this view"}
    else{const s=await db.doc(DOC).get();if(s.exists)got=adopt(thaw(s.data()))}}
  catch(e){db=null;dbUnavailable=true;dbErr=(e&&(e.code||e.message))||"unknown error"}
  try{localStorage.setItem(LS+":probe","1");localStorage.removeItem(LS+":probe");lastSave.local=true}
  catch(e){lastSave.local=false}
  if(!got){try{const raw=localStorage.getItem(LS);if(raw)adopt(JSON.parse(raw))}catch(e){}}
  state.loaded=true;render()}

async function saveState(){const body=payload();let local=false,cloud=false;
  try{localStorage.setItem(LS,JSON.stringify(body));local=true}catch(e){}
  if(HOST.mode==="server"){
    try{await api("/api/screen/state",{method:"PUT",body:JSON.stringify(body)});cloud=true;dbErr=""}
    catch(e){dbErr=(e&&e.message)||"server write failed"}
    lastSave={cloud,local};return local||cloud}
  if(db){try{await db.doc(DOC).set(body);cloud=true;dbErr=""}catch(e){dbErr=(e&&(e.code||e.message))||"unknown error"}}
  lastSave={cloud,local};return local||cloud}

/* ---------- prompt blocks ---------- */

function anchorBlock(){return"HIS HOLDABILITY ANCHORS (1-10; his numbers are ground truth):\n"+
  state.anchors.slice().sort((a,b)=>b.score-a.score)
  .map(a=>`  ${a.title} = ${a.score}${a.note?" — "+a.note:""}`).join("\n")}

function correctionBlock(){const rows=state.log.filter(e=>Number.isFinite(Number(e.actual))).slice(-30);
  if(!rows.length)return"";
  return`HIS CORRECTIONS — these outrank any prediction:\n`+
    rows.map(e=>`  ${e.title}: app said ${Number(e.score).toFixed(1)}; he says ${Number(e.actual).toFixed(1)}`).join("\n")+
    `\nTreat each as an anchor.`}

// What he actually did with a show is the ground truth this scale exists to predict.
function outcomeBlock(){const rows=state.log.filter(e=>e.verdict).slice(-24);
  if(!rows.length)return"";
  const w={finished:"finished it",stuck:"is still watching it",drifted:"drifted off it",bailed:"bailed early"};
  return`WHAT ACTUALLY HAPPENED — the outcomes this scale exists to predict. Where a prediction\nmissed, correct toward the outcome:\n`+
    rows.map(e=>`  ${e.title} — predicted ${Number(e.score).toFixed(1)} — he ${w[e.verdict]}`).join("\n")}

function fallbackComposite(s){let t=0;for(const a of AXES)t+=ax05(s&&s[a.key])*a.w;
  return clamp(1+9*Math.pow(t/(5*WSUM),1.15),1,10)}
function placedScore(r){if(!r)return 1;const p=r.placement;
  if(p&&p.anchor){const a=state.anchors.find(x=>norm(x.title)===norm(p.anchor));const d=Number(p.delta);
    if(a&&Number.isFinite(d))return clamp(Number(a.score)+clamp(d,-1.5,1.5),1,10)}
  const direct=Number(r.scaleScore);if(Number.isFinite(direct))return clamp(direct,1,10);
  return fallbackComposite(r.scores)}

/* Every failure is kept — where, code, message — so a report says what broke
 * instead of "that didn't go through". Shown under Your scale. */
let lastError=null;
function noteError(where,e,ms){
  lastError={where,at:Date.now(),code:(e&&e.code)||"",
    message:String((e&&e.message)||e||"").slice(0,300),seconds:ms?Math.round(ms/1000):null};
  try{localStorage.setItem("holds:lastError",JSON.stringify(lastError))}catch(x){}
  return errCopy(e,ms)}

function errCopy(e,ms){const c=e&&e.code,msg=String((e&&e.message)||"");
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled")
    return"This page can't reach Claude. Open it from your Claude account and allow it.";
  if(c==="rate_limited"||/rate.?limit|429|overloaded|529/i.test(msg))
    return"Too many requests, or the API is busy. Give it a minute and try again.";
  if(c==="session_expired")return"Session expired. Sign in again, then retry.";
  if(c==="invalid_json"||c==="invalid_output")return"The reply came back malformed. Try again.";
  if(c==="refused")return"Claude declined that one. Try a different title.";
  if(c==="needs_token")return"This server needs its access token again.";
  if(c==="no_api_key"||/ANTHROPIC_API_KEY/.test(msg))return"The server has no Anthropic key set, so it can't place anything.";
  if(/credit|billing|balance/i.test(msg))return"The Anthropic account behind this server is out of credit.";
  if(/authentication|invalid x-api-key|401/i.test(msg))return"The server's Anthropic key was rejected — check it in Render's Environment tab.";
  if(/TMDb failed \(401\)/.test(msg))return"The server's TMDb key was rejected — check TMDB_API_KEY in Render's Environment tab.";
  if(/fetch failed|ECONNREFUSED|ENOTFOUND|ETIMEDOUT|socket hang up/i.test(msg))
    return"The server couldn't reach TMDb or Anthropic just now. Try again in a minute.";
  // A fetch that dies with no response is the connection, not the server saying no.
  if(!c&&e instanceof TypeError)
    return ms&&ms>45000
      ? `The connection dropped after ${Math.round(ms/1000)} seconds — it took too long. Try again; it's faster now.`
      : "Couldn't reach the server. Check your connection and try again.";
  return`That didn't go through${msg?": "+msg.slice(0,160):c?" ("+c+")":""}.`}

function saveLine(title,done){const s=saveStatus[title];
  if(s==="saving")return`<div class="status" style="margin-top:9px"><span class="dot"></span>Saving…</div>`;
  if(s==="failed")return`<div class="err" style="margin-top:9px">On screen only — the write to storage failed.</div>`;
  if(s==="ok"||done)return`<div class="saved">${lastSave.cloud?"Saved.":"Saved to this browser."}</div>`;
  return""}

/* The anchors ARE the ruler, so unlike the games side this call is deliberately
 * not blind — the scale is the input. It is still an inference, never a fact. */
function scalePayload(){
  return {
    anchors:state.anchors.map(a=>({title:a.title,score:a.score,note:a.note||""})),
    corrections:state.log.filter(e=>Number.isFinite(Number(e.actual)))
      .slice(-30).map(e=>({title:e.title,said:Number(e.score),actual:Number(e.actual)})),
    outcomes:state.log.filter(e=>e.verdict).slice(-24).map(e=>({title:e.title,said:Number(e.score),
      verdict:({finished:"finished it",stuck:"is still watching it",drifted:"drifted off it",
                bailed:"bailed early"})[e.verdict]||e.verdict})),
    state:(STATES.find(x=>x[0]===mood)||[])[2]||"",
  }}

function putTitle(rec){
  const prev=state.titles[rec.id]||{};
  state.titles[rec.id]=Object.assign({},prev,rec,{meta:Object.assign({},prev.meta,rec.meta)});
  const ids=Object.keys(state.titles);
  if(ids.length>400){ids.sort((a,b)=>((state.titles[a].meta||{}).retrievedAt||0)-((state.titles[b].meta||{}).retrievedAt||0));
    for(const id of ids.slice(0,ids.length-400))
      if(!state.log.some(e=>e.id===id))delete state.titles[id]}
  return state.titles[rec.id]}

/* Turns a server placement into the reading shape the page already renders,
 * with the catalog's numbers winning over anything inferred. */
function readingFrom(row,facts){
  const shape=Object.assign({},row.reading.shape||{});
  if(facts&&Object.keys(facts).length){
    if(facts.epMinutes!=null)shape.epMinutes=facts.epMinutes;
    if(facts.episodes!=null)shape.episodes=facts.episodes;
    if(facts.seasons!=null)shape.seasons=facts.seasons;
  }
  const scores={},notes={};
  for(const a of AXES){const c=(row.reading.axes||{})[a.key]||{};
    scores[a.key]=ax05(c.score);notes[a.key]=String(c.note||"")}
  return {id:row.id,name:row.title,kind:row.kind,example:false,
    ident:row.reading.ident,placement:row.reading.placement,
    near:row.reading.placement&&row.reading.placement.near,
    scores,notes,shape,tactics:row.reading.tactics||[],stopRule:row.reading.stopRule||"",
    secondScreen:row.reading.secondScreen,familiarity:row.reading.familiarity,
    source:facts&&facts.source||null,groundedIn:row.reading.groundedIn||null,
    method:row.reading.method||"model-inference"}}

async function placeTitles(list){
  const out=await api("/api/screen/place",{method:"POST",body:JSON.stringify({
    titles:list.map(t=>({id:t.id,title:t.title,kind:t.kind})),scale:scalePayload()})});
  const readings=[];
  for(const row of out.placed||[]){
    const facts=(out.facts||{})[row.id]||{};
    if(facts&&Object.keys(facts).length)putTitle({id:row.id,title:row.title,kind:row.kind,meta:facts});
    readings.push(readingFrom(row,facts))}
  return {readings,missed:out.missed||[]}}

async function doFind(){

  if(catalogOn()){
    const t0=Date.now();
    try{
      const out=await api("/api/screen/discover?form="+encodeURIComponent(form)
        +"&offset="+findOffset);
      findOffset+=20;
      const seen=new Set(state.seen);
      const anchored=new Set(state.anchors.map(a=>norm(a.title)));
      const pool=[];
      for(const r of (out.results||[])){
        if(!r||!r.id||!r.title)continue;
        putTitle({id:r.id,title:r.title,kind:r.kind,meta:r.meta});

      if(!pool.length){findErr="Everything that came back you've already seen. Try again — it pages through.";
        findBusy=false;return render()}
      const {readings}=await placeTitles(pool.slice(0,12));

        .sort((a,b)=>placedScore(b)-placedScore(a)).slice(0,6);
      picks=kept.map(r=>Object.assign({title:r.name,year:(state.titles[r.id]||{}).meta&&state.titles[r.id].meta.year},r));
      const notes=[`${(out.results||[]).length} retrieved from TMDb, ${readings.length} placed on your scale, top ${picks.length} shown.`];
      if(readings.length-kept.length)notes.push(`${readings.length-kept.length} fell below your ${floor} floor.`);
      if(!picks.length)notes.push("Nothing cleared it. Lower the floor, or look again.");
      else{state.seen=state.seen.concat(picks.map(p=>p.id)).slice(-400);await saveState()}
      findErr=notes.join(" ")}
    catch(e){findErr=noteError("find",e,Date.now()-t0)}
    findBusy=false;return render()}

  const st=(STATES.find(s=>s[0]===mood)||[])[2]||"";

${DOCTRINE}

${anchorBlock()}

${correctionBlock()}

${outcomeBlock()}

${st}

${PLACEMENT}

Score each candidate on the axes as evidence:
${rubric}

${SHAPE}

${FILM_RULES}

HOW TO CHOOSE

   abandon in episode two is a failure of this tool, not a good suggestion.

   over variety every time.

Reply with only this JSON:
{"picks":[{"title":"","year":0,"ident":"","placement":{"anchor":"EXACT title from the anchors","delta":0},
"scaleScore":0,"near":"why that anchor matches for difficulty of finishing",
"scores":{"hook":0,"payoff":0,"tracking":0,"reentry":0,"epload":0,"pull":0},
"shape":{"epMinutes":0,"episodes":0,"seasons":0},"secondScreen":"yes|partly|no","familiarity":3,
"why":"the specific thing about its shape that makes it finishable"}]}`;
  try{const out=await sample.json(prompt,{modelTier:"complex",signal:ctl.signal,cache:false});
    const raw=(out&&Array.isArray(out.picks)?out.picks:[]).filter(p=>p&&p.title);
    picks=raw.filter(p=>placedScore(p)>=floor).sort((a,b)=>placedScore(b)-placedScore(a)).slice(0,6);
    const notes=[];
    if(raw.length-picks.length)notes.push(`${raw.length-picks.length} fell below your ${floor} floor.`);
    if(!picks.length)notes.push("Nothing cleared it. Lower the floor, or try again.");
    else{state.seen=state.seen.concat(picks.map(p=>p.title)).slice(-300);saveState()}
    findErr=notes.join(" ")}
  catch(e){if(!(e&&e.code==="cancelled"))findErr=errCopy(e)}
  findBusy=false;render()}

/* ---------- logging ---------- */

async function logVerdict(title,score,verdict,id){
  const i=state.log.findIndex(e=>(id&&e.id===id)||e.title===title);
  const row=Object.assign({},i>=0?state.log[i]:{},{title,id:id||(i>=0?state.log[i].id:null),
    score:Number(score),verdict,at:Date.now()});
  if(i>=0)state.log[i]=row;else state.log.push(row);
  saveStatus[title]="saving";render();
  const ok=await saveState();saveStatus[title]=ok?"ok":"failed";render()}

async function logCorrection(title,predicted,actual,id){
  const n=Number(actual);if(!Number.isFinite(n))return;
  const v=clamp(n,1,10);
  const i=state.log.findIndex(e=>(id&&e.id===id)||e.title===title);
  const row=Object.assign({},i>=0?state.log[i]:{},{title,id:id||(i>=0?state.log[i].id:null),
    score:Number(predicted),actual:v,at:Date.now()});
  if(i>=0)state.log[i]=row;else state.log.push(row);
  const ex=state.anchors.find(a=>norm(a.title)===norm(title));
  if(ex)ex.score=v;else state.anchors.push({title,score:v,note:`Yours, after the app said ${Number(predicted).toFixed(1)}.`});
  saveStatus[title]="saving";render();
  const ok=await saveState();saveStatus[title]=ok?"ok":"failed";render()}

async function mutateAnchors(fn){fn();saveStatus.anchors="saving";render();
  const ok=await saveState();saveStatus.anchors=ok?"ok":"failed";render();
  const row=document.getElementById("justadded");
  if(row&&row.scrollIntoView)row.scrollIntoView({block:"center",behavior:"smooth"})}

/* ---------- YOUR SCALE ---------- */

function calPanel(){
  const corr=state.log.filter(e=>Number.isFinite(Number(e.actual)));
  const mae=corr.length?corr.reduce((s,e)=>s+Math.abs(Number(e.score)-Number(e.actual)),0)/corr.length:null;
  const fin=state.log.filter(e=>e.verdict==="finished"||e.verdict==="stuck");
  const bail=state.log.filter(e=>e.verdict==="bailed"||e.verdict==="drifted");
  const avg=rows=>rows.length?(rows.reduce((s,e)=>s+Number(e.score),0)/rows.length).toFixed(1):"—";

  let h=`<h2 class="sec">Is it reading you</h2>
    <p class="subtle">The scale works if what it scores high is what you actually finish. These are its predictions against what happened.</p>
    <div class="readout">
      <div><div class="n">${avg(fin)}</div><span class="lab">Finished / watching</span><div class="aval">${fin.length} logged</div></div>
      <div><div class="n">${avg(bail)}</div><span class="lab">Dropped</span><div class="aval">${bail.length} logged</div></div>
      <div><div class="n">${mae===null?"—":mae.toFixed(2)}</div><span class="lab">Avg miss</span><div class="aval">${corr.length} corrections</div></div>
    </div>
    <p class="note">The top-left number should sit well above the middle one. If they converge, the scale isn't tracking you — correct a few numbers below.</p>`;

  h+=`<h2 class="sec">Log</h2>`;
  if(!state.log.length)h+=`<p class="empty">Nothing yet. Check something, watch it, then say what happened.</p>`;
  else h+=`<div class="tw"><table><thead><tr><th>Title</th><th>Said</th><th>You</th><th>Outcome</th><th></th></tr></thead><tbody>
    ${state.log.slice().reverse().map(e=>`<tr><td>${esc(e.title)}</td>
      <td class="num">${Number(e.score).toFixed(1)}</td>
      <td class="num">${Number.isFinite(Number(e.actual))?Number(e.actual).toFixed(1):"—"}</td>
      <td>${(VERDICTS.find(v=>v.key===e.verdict)||{}).label||"—"}</td>
      <td class="num"><button class="del" data-act="dellog" data-t="${esc(e.title)}" aria-label="Remove">&times;</button></td></tr>`).join("")}
    </tbody></table></div>`;

  if(state.anchors.some(a=>a.seed))h+=`
    <h2 class="sec">Build your scale</h2>
    <p class="subtle">The nine anchors below are mine — estimates about a generic viewer, not your history. Everything gets placed against them, so they need to be yours. Name shows you have actually watched and it will replace mine with those.</p>
    <label class="fieldlab lab" for="s-easy">Got through without effort</label>
    <input type="text" id="s-easy" placeholder="Comma separated" value="${esc(setEasy)}">
    <label class="fieldlab lab" for="s-hard">Finished, but it was work</label>
    <input type="text" id="s-hard" placeholder="Comma separated" value="${esc(setHard)}">
    <label class="fieldlab lab" for="s-drop">Started and dropped</label>
    <input type="text" id="s-drop" placeholder="Comma separated" value="${esc(setDrop)}">
    <div class="seg" style="margin-top:14px">
      <button class="go" data-act="setscale">Use these as my scale</button>
      <button data-act="dropseeds">Just delete yours</button>
    </div>
    ${setErr?`<div class="err">${esc(setErr)}</div>`:""}
    <p class="note">Scored 9 / 6.5 / 3 to start. Adjust any of them below — those numbers are the ruler.</p>`;

  h+=`<h2 class="sec">Anchors</h2>
    <p class="subtle">The actual ruler. Every check and every recommendation is placed against these, so fix any number you disagree with — ADHD is not one thing and these are only starting estimates.</p>
    <div class="tw"><table><thead><tr><th>Title</th><th>Score</th><th>Note</th><th></th></tr></thead><tbody>
    ${state.anchors.slice().sort((a,b)=>b.score-a.score).map(a=>`<tr${a.title===justAdded?` class="justadded" id="justadded"`:""}>
      <td>${esc(a.title)}${a.title===justAdded?` <span class="lab" style="color:var(--sig)">added</span>`:""}${a.seed?` <span class="lab">my guess</span>`:""}</td>
      <td class="num"><input type="text" class="anchsc" data-t="${esc(a.title)}" value="${a.score}" style="width:62px;padding:7px 6px" inputmode="decimal"></td>
      <td style="color:var(--dim);font-size:13px">${esc(a.note||"")}</td>
      <td class="num"><button class="del" data-act="delanch" data-t="${esc(a.title)}" aria-label="Remove">&times;</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="addrow">
      <input type="text" id="na" placeholder="Title" autocomplete="off">
      <input type="text" id="ns" class="sc" placeholder="8" inputmode="decimal">
      <button class="go" data-act="addanch">Add</button></div>
    ${addErr?`<div class="err">${esc(addErr)}</div>`:""}
    ${saveStatus.anchors==="ok"&&justAdded?`<div class="saved">Added. It's the ruler now.</div>`:""}
    ${failureLine()}
    ${storageLine()}`;
  return h}

function failureLine(){
  if(!lastError)try{lastError=JSON.parse(localStorage.getItem("holds:lastError")||"null")}catch(e){}
  if(!lastError)return"";
  const le=lastError;
  return`<h2 class="sec">Last failure</h2>
    <p class="subtle">Kept so it can be reported exactly. Nothing is sent anywhere.</p>
    <div class="tw"><table><tbody>
      <tr><td>Where</td><td>${esc(le.where)}${le.seconds!=null?` · after ${le.seconds}s`:""}</td></tr>
      <tr><td>Code</td><td>${esc(le.code||"(none)")}</td></tr>
      <tr><td>Message</td><td>${esc(le.message||"(none)")}</td></tr>
      <tr><td>When</td><td>${esc(new Date(le.at).toLocaleString())}</td></tr>
    </tbody></table></div>
    <div class="seg"><button data-act="clearerr">Clear it</button></div>`}

function storageLine(){
  const cloud=HOST.mode==="server"
    ?(dbErr?`failing (${esc(dbErr)})`:"working")
    :db?(dbErr?`failing (${esc(dbErr)})`:"working"):`unavailable${dbErr?` (${esc(dbErr)})`:""}`;
  const local=lastSave.local===true?"working":lastSave.local===false?"blocked":"untested";
  return`<h2 class="sec">Where this is running</h2><p class="subtle">
    Running as: <b>${HOST.mode==="server"?"the standalone server":"a published artifact"}</b><br>
    Catalog: <b>${catalogOn()?"TMDb connected":HOST.mode==="server"
      ?"not configured — set "+esc((HOST.missing||[]).join(", ")||"TMDB_API_KEY")
      :"none — an artifact can't reach one"}</b><br>
    ${HOST.mode==="server"?"Server store":"Cloud"}: <b>${cloud}</b><br>This browser: <b>${local}</b></p>
  <p class="note">${catalogOn()
    ? "Runtimes, episode and season counts come from TMDb and are facts. The six axes and the placement on your scale are inferred — a catalog grounds them, it doesn't verify them."
    : "There is no catalog here, so episode counts and runtimes are recalled by the model and do drift. Run the server in <code>server/</code> with a TMDB_API_KEY to make them facts."}</p>`}

/* ---------- plumbing ---------- */

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===tab)));
  const m={read:["panel-read",readPanel],find:["panel-find",findPanel],cal:["panel-cal",calPanel]};
  for(const k of Object.keys(m)){const el=document.getElementById(m[k][0]);
    el.hidden=k!==tab;if(k===tab)el.innerHTML=m[k][1]()}}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act],.tab");if(!t)return;
  if(t.classList.contains("tab")){tab=t.dataset.tab;addErr="";return render()}
  const act=t.dataset.act,v=t.dataset.v;
  if(act==="read")return void doRead();
  if(act==="clearerr"){lastError=null;try{localStorage.removeItem("holds:lastError")}catch(e){}return render()}
  if(act==="pick")return void openTitle(t.dataset.id);
  if(act==="savetok"){const el=document.getElementById("tok");
    HOST.token=((el&&el.value)||"").trim();
    try{localStorage.setItem("holds:token",HOST.token)}catch(e){}
    return void (async()=>{await detectHost();await loadState();render()})()}
  if(act==="find")return void doFind();
  if(act==="mood"){mood=v;return render()}
  if(act==="form"){form=v;return render()}
  if(act==="floor"){floor=Number(v);return render()}
  if(act==="correct"&&reading&&!reading.example){
    const el=document.getElementById("actual"),raw=(el&&el.value||"").trim();
    if(!raw||!Number.isFinite(Number(raw))){readErr="Give a score from 1 to 10.";return render()}
    readErr="";return void logCorrection(reading.name,placedScore(reading),Number(raw),reading.id)}
  if(act==="verdict"&&reading&&!reading.example)
    return void logVerdict(reading.name,placedScore(reading),v,reading.id);
  if(act==="pverdict"){const p=picks[Number(t.dataset.i)];
    if(p)void logVerdict(p.title,placedScore(p),v,p.id);return}
  if(act==="dellog"){state.log=state.log.filter(e=>e.title!==t.dataset.t);saveState();return render()}
  if(act==="delanch")return void mutateAnchors(()=>{state.anchors=state.anchors.filter(a=>a.title!==t.dataset.t)});
  if(act==="setscale"){
    const grab=id=>(document.getElementById(id).value||"").split(",").map(x=>x.trim()).filter(Boolean);
    const easy=grab("s-easy"),hard=grab("s-hard"),drop=grab("s-drop");
    setEasy=easy.join(", ");setHard=hard.join(", ");setDrop=drop.join(", ");
    if(easy.length+hard.length+drop.length<3){setErr="Name at least three between them, and try to fill more than one row — a scale needs a spread.";return render()}
    if(!easy.length||!drop.length){setErr="It needs both ends: something you got through easily and something you dropped.";return render()}
    setErr="";
    const mk=(list,score,note)=>list.map(t=>({title:t,score,note}));
    return void mutateAnchors(()=>{
      state.anchors=state.anchors.filter(a=>!a.seed).concat(
        mk(easy,9,"You got through it without effort."),
        mk(hard,6.5,"You finished it, but it was work."),
        mk(drop,3,"You started it and dropped it."));
      setEasy=setHard=setDrop=""})}
  if(act==="dropseeds")return void mutateAnchors(()=>{state.anchors=state.anchors.filter(a=>!a.seed)});
  if(act==="addanch"){
    const ti=document.getElementById("na"),sc=document.getElementById("ns");
    const title=(ti.value||"").trim(),raw=(sc.value||"").trim();
    if(!title){addErr="Type a title first.";return render()}
    if(!raw||!Number.isFinite(Number(raw))){addErr="Give it a score out of 10.";return render()}
    addErr="";const score=clamp(Number(raw),1,10);justAdded=title;
    return void mutateAnchors(()=>{
      state.anchors=state.anchors.filter(a=>norm(a.title)!==norm(title));
      state.anchors.push({title,score,note:""})})}});

document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id==="q")doRead();
  if(ev.key==="Enter"&&(ev.target.id==="na"||ev.target.id==="ns")){
    const b=document.querySelector('[data-act="addanch"]');if(b)b.click()}});

document.addEventListener("change",ev=>{
  if(!ev.target.classList.contains("anchsc"))return;
  const v=Number(ev.target.value),a=state.anchors.find(x=>x.title===ev.target.dataset.t);
  if(a&&Number.isFinite(v))void mutateAnchors(()=>{a.score=clamp(v,1,10)})});

window.__h={HOST,state};
render();
(async()=>{
  await detectHost();
  if(HOST.mode!=="server"){
    try{sample=await claude.use("sample")}catch(e){sample=null}
    if(!sample){readErr="This page can't reach Claude from here. Open it from your Claude account.";
      findErr=readErr}}
  render();
  loadState()})();
</script>
