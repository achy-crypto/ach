<title>Wavelength</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEEAF0;--surface:#F8F6FA;--ink:#1D1830;--dim:#6C6580;--rule:#D8D2E0;--soft:#E5E0EA;
  --signal:#2B6F6A;--signal-wash:#2B6F6A18;--off:#A0567A;--warn:#A0567A;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#141221;--surface:#1C1930;--ink:#ECE8F4;--dim:#9A93B0;--rule:#2E2A45;--soft:#24203A;
  --signal:#6FD1C6;--signal-wash:#6FD1C620;--off:#E08BB2;--warn:#E08BB2}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#141221;--surface:#1C1930;--ink:#ECE8F4;--dim:#9A93B0;--rule:#2E2A45;--soft:#24203A;
  --signal:#6FD1C6;--signal-wash:#6FD1C620;--off:#E08BB2;--warn:#E08BB2}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding-inline:18px;padding-block:28px 90px}
.mark{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

/* the question is the page */
.ask h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,44px);line-height:1.08;
  margin:10px 0 14px;text-wrap:balance;letter-spacing:-.01em}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:4px}
.box:focus-within{border-color:var(--signal)}
textarea{display:block;width:100%;min-height:96px;resize:vertical;border:0;background:transparent;color:var(--ink);
  font-family:var(--body);font-size:18px;line-height:1.5;padding:12px 13px;outline:none}
textarea::placeholder{color:var(--dim)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--dim);font-family:var(--body);font-size:14px;
  font-weight:500;padding:10px 14px;min-height:44px;cursor:pointer;touch-action:manipulation}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.go{appearance:none;border:0;border-radius:5px;background:var(--signal);color:var(--ground);font-family:var(--body);
  font-weight:600;font-size:16px;padding:11px 22px;min-height:46px;cursor:pointer;margin-left:auto;touch-action:manipulation}
.go[disabled]{opacity:.5;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.tries{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.try{appearance:none;background:transparent;border:1px dashed var(--rule);border-radius:999px;color:var(--dim);
  font-family:var(--body);font-size:13.5px;padding:7px 12px;min-height:36px;cursor:pointer;text-align:left}
.try:hover{color:var(--ink);border-color:var(--dim)}

.status{margin-top:18px;display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14.5px}
.pulse{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.pulse i{width:3px;background:var(--signal);border-radius:1px;animation:tune 1s ease-in-out infinite}
.pulse i:nth-child(2){animation-delay:.15s}.pulse i:nth-child(3){animation-delay:.3s}.pulse i:nth-child(4){animation-delay:.45s}
@keyframes tune{0%,100%{height:3px}50%{height:14px}}
@media (prefers-reduced-motion:reduce){.pulse i{animation:none;height:10px}}
.stop{appearance:none;background:none;border:1px solid var(--rule);border-radius:4px;color:var(--dim);
  font:inherit;font-size:13px;padding:5px 10px;cursor:pointer;margin-left:auto}
.err{margin-top:18px;border-left:3px solid var(--warn);background:var(--surface);padding:10px 14px;font-size:14.5px;border-radius:0 5px 5px 0}

/* how it heard you */
.heard{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule)}
.heard .line{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;margin-top:8px}
.heard .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  min-width:78px}
.pill{font-size:13.5px;border-radius:999px;padding:3px 11px;background:var(--soft);color:var(--ink)}
.pill.tag{font-family:var(--mono);font-size:11.5px;background:transparent;border:1px solid var(--rule);color:var(--dim)}
.pill.avoid{background:transparent;border:1px solid var(--off);color:var(--off)}
.flag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule);color:var(--dim);padding:3px 8px;border-radius:3px;margin-bottom:6px}

/* results */
.results{margin-top:22px}
.row{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--rule)}
.row.noposter{grid-template-columns:1fr}
.poster{width:62px;aspect-ratio:2/3;max-width:100%;border-radius:3px;background:var(--soft);object-fit:cover;display:block}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.name{font-family:var(--display);font-size:20px;line-height:1.2;text-wrap:balance}
.meta{color:var(--dim);font-size:13.5px;margin-top:2px}
.score{text-align:right;flex:none}
.num{font-family:var(--mono);font-weight:500;font-size:22px;color:var(--signal);font-variant-numeric:tabular-nums;line-height:1}
.num small{font-size:11px;color:var(--dim)}
.bar{display:flex;gap:2px;margin-top:7px;width:84px}
.bar i{flex:1;height:8px;background:var(--soft);border-radius:1px}
.bar i.on{background:var(--signal)}
.why{margin-top:8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;border-radius:999px;padding:2px 10px;background:var(--signal-wash);color:var(--ink)}
.chip.fact{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--rule);color:var(--dim)}
.miss{margin-top:6px;font-size:13.5px;color:var(--dim)}
.miss b{color:var(--off);font-weight:500}
.links{margin-top:8px;font-size:13px}
.links a{color:var(--dim)}
details.weak{margin-top:8px;border-top:1px solid var(--rule);padding-top:10px}
details.weak>summary{cursor:pointer;color:var(--dim);font-size:14px;padding:6px 0;list-style:none}
details.weak>summary::-webkit-details-marker{display:none}
.source{margin-top:26px;font-size:13px;color:var(--dim);max-width:60ch}
.lock{margin-top:18px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:14px}
.lock .r{display:flex;gap:8px;margin-top:10px}
.lock input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:4px;
  font:inherit;padding:10px 12px}
.lock button{appearance:none;border:0;border-radius:4px;background:var(--ink);color:var(--ground);font:inherit;font-weight:600;padding:10px 16px}
</style>

<div class="wrap">
  <section class="ask">
    <div class="mark">Wavelength</div>
    <h1>What are you in the mood for?</h1>
    <div class="box"><textarea id="vibe" placeholder="A feeling, a vibe, a scene you want to be in. As loose as you like."></textarea></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Series or films">
        <button data-form="either" aria-pressed="true">Either</button>
        <button data-form="show" aria-pressed="false">Series</button>
        <button data-form="film" aria-pressed="false">Films</button>
      </div>
      <button class="go" id="go">Tune in</button>
    </div>
    <div class="tries" id="tries"></div>
  </section>
  <div id="out"></div>
</div>

<script>
"use strict";

const EXAMPLES=[
  "Cosy and a bit melancholy, like a rainy Sunday. Nothing too dark.",
  "A tense heist where everyone's smarter than me",
  "Something that feels like a long summer road trip with friends",
  "Unsettling, slow, beautiful. I want to feel slightly haunted after",
  "Low-stakes and funny, background for folding laundry",
  "Big dumb fun, explosions, don't make me think",
];

// Shown until the first real search, clearly marked. Titles from memory, not a result.
const EXAMPLE={
  vibe:EXAMPLES[0],
  reading:{heard:["gentle","wistful","small everyday moments","rainy-day comfort"],
    resolvedKeywords:[{name:"small town"},{name:"slice of life"},{name:"friendship"}],avoid:["violence"]},
  results:[
    {title:"Paterson",kind:"film",meta:{year:2016,epMinutes:118},match:92,
     reason:"A bus driver's quiet week of poems and routines; tender, funny, and a little sad without any real peril.",
     matchedOn:["gentle","everyday moments"],misses:"",overlap:{tags:["small town"],genres:["Drama"]}},
    {title:"Detectorists",kind:"show",meta:{year:2014,seasons:3},match:88,
     reason:"Two men with metal detectors in English fields; warm, dry, melancholy about time passing.",
     matchedOn:["cosy","wistful"],misses:"Sunnier than a rainy Sunday.",overlap:{tags:["friendship"],genres:["Comedy"]}},
    {title:"Columbus",kind:"film",meta:{year:2017,epMinutes:104},match:81,
     reason:"Two strangers talk through a small Indiana town's architecture; hushed and reflective.",
     matchedOn:["melancholy","nothing dark"],misses:"Slow enough that it needs your attention.",overlap:{tags:[],genres:["Drama"]}},
  ],
};

const HOST={mode:"unknown",tmdb:false,rater:false,needsToken:false,token:"",missing:[]};
let sample=null,form="either",busy=false,step="",err="",ctl=null;
let last={...EXAMPLE,example:true,source:"example"};

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");
  localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---- where are we running ---- */

function hdrs(){const h={"Content-Type":"application/json"};if(HOST.token)h.Authorization="Bearer "+HOST.token;return h}
async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:hdrs(),body:body?JSON.stringify(body):undefined,
    signal:ctl&&ctl.signal});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.error)||`request failed (${r.status})`);
    e.code=r.status===401?"needs_token":(j&&j.code)||("http_"+r.status);throw e}
  return j}
async function detectHost(){
  for(const k of ["wavelength:token","holds:token","games:token"]){
    try{const t=localStorage.getItem(k);if(t){HOST.token=t;break}}catch(e){}}
  try{const h=await api("/api/health");
    if(h&&h.app==="two-hours-in"){HOST.mode="server";
      HOST.tmdb=!!(h.screen&&h.screen.connected);HOST.rater=!!(h.rater&&h.rater.configured);
      HOST.needsToken=!!h.needsToken&&!h.authed;
      HOST.missing=[].concat(HOST.tmdb?[]:["TMDB_API_KEY"],HOST.rater?[]:["ANTHROPIC_API_KEY"]);return}}
  catch(e){if(e&&e.code==="needs_token"){HOST.mode="server";HOST.needsToken=true;return}}
  HOST.mode="artifact"}
const catalogOn=()=>HOST.mode==="server"&&HOST.tmdb&&HOST.rater;

/* ---- errors that say what happened ---- */

function errCopy(e){const c=e&&e.code,m=String((e&&e.message)||"");
  if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled")return"This page can't reach Claude. Open it from your Claude account and allow it.";
  if(c==="needs_token")return"This server needs its access token.";
  if(c==="rate_limited"||/rate.?limit|overloaded|529/i.test(m))return"Claude is busy or you've hit a usage limit. Give it a minute.";
  if(/credit|billing|balance/i.test(m))return"The Anthropic account behind this server is out of credit.";
  if(/TMDb failed \(401\)/.test(m))return"TMDb rejected the server's key. Check TMDB_API_KEY in Render's Environment tab.";
  if(/x-api-key|authentication/i.test(m))return"Anthropic rejected the server's key. Check ANTHROPIC_API_KEY in Render's Environment tab.";
  if(/fetch failed|ECONNREFUSED|ETIMEDOUT/i.test(m))return"The server couldn't reach TMDb or Anthropic just now. Try again in a minute.";
  if(c==="invalid_json"||c==="invalid_output")return"The reply came back garbled. Try again.";
  if(!c&&e instanceof TypeError)return"Couldn't reach the server. Check your connection and try again.";
  return`That didn't work${m?": "+m.slice(0,160):""}.`}

/* ---- the search ---- */

async function tune(){
  const vibe=($("#vibe").value||"").trim();
  if(vibe.length<3){err="Say a bit about what you're after first.";return render()}
  if(busy)return;
  busy=true;err="";ctl=new AbortController();
  const recent=(store("wavelength:recent")||[]).filter(v=>v!==vibe);store("wavelength:recent",[vibe].concat(recent).slice(0,5));
  try{
    if(catalogOn()){
      step="Reading your vibe";render();
      const pool=await api("/api/vibe/pool",{vibe,form});
      if(!pool.pool.length)throw new Error("TMDb had nothing matching that reading. Try describing it differently.");
      step=`Scoring ${pool.pool.length} titles from TMDb against what you said`;render();
      const out=await api("/api/vibe/rank",{vibe,reading:pool.reading,ids:pool.pool.map(p=>p.id)});
      last={vibe,reading:pool.reading,results:out.ranked,source:"tmdb",dropped:pool.seedsDropped||[]};
    } else if(HOST.mode==="server"){
      throw new Error("This server is missing "+HOST.missing.join(" and ")+".");
    } else {
      if(!sample)throw{code:"not_granted"};
      step="Thinking of titles";render();
      last=await fromMemory(vibe);
    }
  }catch(e){if(!(e&&e.name==="AbortError"))err=errCopy(e)}
  busy=false;step="";render();
  const o=$("#out");if(o&&!err&&o.scrollIntoView)o.scrollIntoView({block:"start",behavior:"smooth"})}

// With no catalog there is nothing to retrieve from, so titles come from Claude's memory.
async function fromMemory(vibe){
  const out=await sample.json(`Someone wants something to watch and described it in their own words:
"""${vibe.slice(0,600)}"""
${form!=="either"?`They want a ${form==="film"?"film":"series"}.`:""}

First say in 3-6 short plain phrases how you read the feeling. Then name 10 real titles that fit
the FEELING, spread across decades, countries and sizes, not just famous ones. Score each 0-100
for fit (90+ almost exactly it, 75-89 strong with one thing off, 55-74 partly, below 55 weak) —
quality and popularity don't count. Only name titles you are confident exist.

Reply with only this JSON:
{"heard":[""],"results":[{"title":"","year":0,"kind":"film|show","match":0,
"reason":"under 22 words, concrete to this title","matchedOn":[""],"misses":""}]}`,
    {modelTier:"default",signal:ctl.signal,cache:false});
  const results=(out.results||[]).filter(r=>r&&r.title).map(r=>({title:r.title,kind:r.kind==="show"?"show":"film",
    meta:{year:r.year||null},match:Math.max(0,Math.min(100,Math.round(Number(r.match)||0))),
    reason:r.reason||"",matchedOn:(r.matchedOn||[]).slice(0,3),misses:r.misses||"",overlap:{tags:[],genres:[]}}))
    .sort((a,b)=>b.match-a.match);
  return {vibe,reading:{heard:out.heard||[],resolvedKeywords:[],avoid:[]},results,source:"memory"}}

/* ---- drawing ---- */

function bar(n){const on=Math.round(n/10);
  return`<div class="bar" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("")}</div>`}

function metaLine(r){const m=r.meta||{},bits=[r.kind==="show"?"Series":"Film"];
  if(m.year)bits.push(m.year);
  if(r.kind==="film"&&m.epMinutes)bits.push(`${m.epMinutes} min`);
  if(r.kind==="show"&&m.seasons)bits.push(`${m.seasons} season${m.seasons===1?"":"s"}`);
  return bits.join(" · ")}

function row(r){
  const m=r.meta||{},img=last.source==="tmdb"&&m.poster;
  const facts=[].concat((r.overlap&&r.overlap.tags)||[],(r.overlap&&r.overlap.genres)||[]);
  return`<article class="row${img?"":" noposter"}">
    ${img?`<img class="poster" src="${esc(m.poster)}" alt="" loading="lazy">`:""}
    <div>
      <div class="top">
        <div><div class="name">${esc(r.title)}</div><div class="meta">${esc(metaLine(r))}</div></div>
        <div class="score"><div class="num">${r.match}<small>%</small></div>${bar(r.match)}</div>
      </div>
      <div class="why">${esc(r.reason)}</div>
      ${(r.matchedOn&&r.matchedOn.length)||facts.length?`<div class="chips">
        ${(r.matchedOn||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}
        ${facts.map(x=>`<span class="chip fact" title="Shared with TMDb's own tags">${esc(x)}</span>`).join("")}
      </div>`:""}
      ${r.misses?`<div class="miss"><b>Off:</b> ${esc(r.misses)}</div>`:""}
      ${m.sourceUrl?`<div class="links"><a href="${esc(m.sourceUrl)}" target="_blank" rel="noopener">On TMDb</a></div>`:""}
    </div></article>`}

function render(){
  document.querySelectorAll("[data-form]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.form===form)));
  $("#go").disabled=busy;$("#go").textContent=busy?"Tuning…":"Tune in";
  const recent=store("wavelength:recent")||[];
  const tries=recent.length?recent:EXAMPLES;
  $("#tries").innerHTML=(recent.length?`<span class="mark" style="align-self:center">Recent</span>`:"")+
    tries.slice(0,5).map(t=>`<button class="try" data-try="${esc(t)}">${esc(t)}</button>`).join("");

  let h="";
  if(HOST.needsToken)h+=`<div class="lock"><b>This server is locked.</b> Enter the access token it was set up with.
    <div class="r"><input id="tok" type="password" placeholder="Access token" autocomplete="off"><button id="savetok">Unlock</button></div></div>`;
  if(busy)h+=`<div class="status"><span class="pulse"><i></i><i></i><i></i><i></i></span><span>${esc(step)}…</span>
    <button class="stop" id="stop">Stop</button></div>`;
  if(err)h+=`<div class="err">${esc(err)}</div>`;

  if(last&&last.results){
    const rd=last.reading||{};
    const strong=last.results.filter(r=>r.match>=50),weak=last.results.filter(r=>r.match<50);
    h+=`<section class="heard">
      ${last.example?`<span class="flag">Example — try your own above</span>`:""}
      <div class="mark">${last.example?"For":"You said"}</div>
      <div style="font-family:var(--display);font-size:19px;margin-top:4px">“${esc(last.vibe)}”</div>
      ${rd.heard&&rd.heard.length?`<div class="line"><span class="k">Heard</span>${rd.heard.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>`:""}
      ${rd.resolvedKeywords&&rd.resolvedKeywords.length?`<div class="line"><span class="k">Searched</span>${rd.resolvedKeywords.map(k=>`<span class="pill tag">${esc(k.name)}</span>`).join("")}</div>`:""}
      ${rd.avoid&&rd.avoid.length?`<div class="line"><span class="k">Avoided</span>${rd.avoid.map(x=>`<span class="pill avoid">${esc(x)}</span>`).join("")}</div>`:""}
    </section>
    <section class="results">
      ${strong.length?strong.map(row).join(""):`<p class="meta">Nothing came through as a strong match. Try saying it another way.</p>`}
      ${weak.length?`<details class="weak"><summary>${weak.length} weaker match${weak.length===1?"":"es"}</summary>${weak.map(row).join("")}</details>`:""}
    </section>
    <p class="source">${last.source==="tmdb"
      ?"Titles, tags, posters and runtimes come from TMDb. The match is Claude's judgment of how well each fits what you wrote. It isn't a rating, and quality doesn't count toward it. Outlined tags are ones TMDb itself gives the title."
      :last.source==="memory"
      ?"No catalog here, so these titles come from Claude's memory and details can be wrong. Opened from your own server with a TMDb key, every title is a real TMDb record."
      :"An example of what a search returns."}
      ${last.dropped&&last.dropped.length?` ${last.dropped.length} suggestion${last.dropped.length===1?" wasn't":"s weren't"} on TMDb and ${last.dropped.length===1?"was":"were"} left out.`:""}</p>`}
  $("#out").innerHTML=h}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-try]");if(!t)return;
  if(t.dataset.form){form=t.dataset.form;return render()}
  if(t.dataset.try){$("#vibe").value=t.dataset.try;$("#vibe").focus();return}
  if(t.id==="go")return void tune();
  if(t.id==="stop"){if(ctl)ctl.abort();return}
  if(t.id==="savetok"){HOST.token=($("#tok").value||"").trim();
    try{localStorage.setItem("wavelength:token",HOST.token)}catch(e){}
    return void detectHost().then(render)}});
document.addEventListener("keydown",ev=>{
  if(ev.target.id==="vibe"&&ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();tune()}});

render();
(async()=>{
  await detectHost();
  if(HOST.mode!=="server"){try{sample=await claude.use("sample")}catch(e){sample=null}}
  render()})();
</script>
